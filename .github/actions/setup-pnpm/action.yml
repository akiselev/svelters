name: Set up Node and pnpm
description: Node 22, pnpm from package.json's packageManager, cached store, frozen install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
