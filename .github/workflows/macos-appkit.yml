name: macos-appkit

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The project's minimum macOS (REACTIVITY.md decision 13.10: KVO on BORROWED objects relies on the 10.13 relaxed
  # unregistration; display links need 14 and fall back to a timer below it).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # metadata/appkit/*.json is derived from Apple's SDK, so it is generated here, on Apple hardware
  # with Xcode, never on Linux. This re-runs the ingest and the generator and fails if the
  # committed output differs (determinism + freshness against the real SDK). The regenerated files
  # are uploaded either way, so updating them is: download the artifact, commit.
  appkit-metadata:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pick the Xcode whose SDK the committed metadata came from
        run: |
          want=$(python3 -c 'import json;print(json.load(open("metadata/appkit/_enums.json"))["sdk"].removeprefix("MacOSX"))')
          have=$(xcrun --sdk macosx --show-sdk-version)
          echo "committed SDK: $want; default Xcode: $(xcode-select -p) (SDK $have)"
          if [ "$want" != "$have" ]; then
            for x in /Applications/Xcode*.app; do
              v=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk macosx --show-sdk-version 2>/dev/null || true)
              echo "  $x: SDK $v"
              if [ "$v" = "$want" ]; then echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"; found=1; break; fi
            done
            [ -n "$found" ] || echo "::warning::no Xcode with the macOS $want SDK on this runner; ingesting with $have (expect a diff: commit the uploaded output to move to it)"
          fi
      - name: Environment
        run: sw_vers; xcode-select -p; xcrun --sdk macosx --show-sdk-path; xcrun --sdk macosx --show-sdk-version; xcrun clang --version
      - name: Python with the libclang bindings
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet clang==21.1.7 pyyaml jsonschema
      - name: Ingest from the Xcode SDK
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/metadata/appkit/ingest.py'
      - name: Inferred layer is current (rules + checked-in probe over the fresh ingest)
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/metadata/appkit/infer.py --check'
      - name: Generate tables and tests
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/metadata/appkit/gen_backend.py'
      - name: Committed output is current
        run: |
          git status --short
          git diff --stat
          git diff --exit-code -- metadata/appkit metadata/inferred/appkit crates/svelters-appkit/src/generated examples/counter-mac/tests/generated.rs
      - name: Upload regenerated metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: appkit-metadata
          path: |
            metadata/appkit/
            crates/svelters-appkit/src/generated/
            examples/counter-mac/tests/generated.rs

  appkit:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: sw_vers; uname -m; xcrun --show-sdk-path; xcrun --show-sdk-version

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-appkit

      - uses: ./.github/actions/setup-pnpm
      - name: Build svelters-compile (the fixtures are compiled by it)
        run: cargo build -p svelters-compiler --bin svelters-compile
      - name: Build bundles
        run: pnpm --filter './fixtures/*' build

      - name: Build tests
        run: cargo test --no-run -p svelters-apple -p svelters-appkit -p counter-mac

      # Each test binary is its own step so one crash doesn't hide the others.
      - name: Unit tests (svelters-apple, svelters-appkit)
        timeout-minutes: 10
        run: cargo test -p svelters-apple -p svelters-appkit
      - name: counter-mac backend
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          SVELTERS_APPKIT_TRACE_FRAMES: "1"
        run: cargo test -p counter-mac --test backend
      # One JSON line per generated case (svelters_apple::testing): the input of
      # `tools/metadata/ledger.py import --toolkit appkit` (uploaded below; commit the imported ledger).
      - name: counter-mac generated
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          SVELTERS_TEST_RESULTS: ${{ github.workspace }}/target/appkit-results/generated.jsonl
        run: |
          mkdir -p target/appkit-results && rm -f target/appkit-results/generated.jsonl
          cargo test -p counter-mac --test generated
      # N4: non-GUI types. The generated facts append to the same results file (one ledger import).
      - name: counter-mac types
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          SVELTERS_TEST_RESULTS: ${{ github.workspace }}/target/appkit-results/generated.jsonl
        run: cargo test -p counter-mac --test types
      - name: counter-mac types_core
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p counter-mac --test types_core
      - name: counter-mac counter
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p counter-mac --test counter
      # WP-A: every gallery page clicked natively; screenshots in target/gallery (uploaded below).
      - name: counter-mac gallery
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p counter-mac --test gallery
      # ST2: the styled todo app (decl dialect): native styling checks, screenshots in target/todo.
      - name: counter-mac todo
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p counter-mac --test todo
      - name: counter-mac run with screenshot
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: cargo run -p counter-mac -- --screenshot target/counter-mac.png --exit --report target/counter-mac.json

      # AI1: the runtime prober (tools/metadata/appkit/probe.py) writes metadata/probe/appkit/<SDK>.json;
      # uploaded as `appkit-probe` with the test results, to be committed (then infer.py, gen_backend.py,
      # ledger.py import). It must not fail the job: a crashing class is recorded, not fatal.
      - name: Python for the metadata tools
        if: ${{ !cancelled() }}
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml jsonschema
      - name: Probe AppKit
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/metadata/appkit/probe.py --out target/appkit-probe'
      # N4: declared Objective-C properties of the bindable Foundation/AppKit classes (objc2 does not mark
      # read-only properties); commit the uploaded `types-<SDK>.json` to metadata/probe/appkit/.
      - name: Probe non-GUI type properties
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          mkdir -p target/appkit-probe
          "$RUNNER_TEMP/venv/bin/python" -I tools/metadata/appkit/types_appkit_classify.py --probe-list > target/appkit-probe/types-classes.txt
          cargo run -p svelters-appkit --example types_probe -- target/appkit-probe/types-classes.txt > "target/appkit-probe/types-$(xcrun --show-sdk-version).json"
      - name: Ledger import (dry run against the committed ledger)
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/metadata/ledger.py import --toolkit appkit --dry-run target/appkit-results/generated.jsonl'
      - name: Upload probe and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: appkit-probe
          if-no-files-found: warn
          path: |
            target/appkit-probe/
            target/appkit-results/

      - name: Upload screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-appkit-artifacts
          if-no-files-found: ignore
          path: |
            target/gallery/
            target/todo/
            target/*.png
            target/*.json
