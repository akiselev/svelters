name: js

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Svelte's own runtime tests (tests/runtime-runes/samples @ svelte@5.57.2) through our compiler and
  # runtime on the jsdom host. --check fails when a sample in baseline.json no longer passes or an
  # expected.json entry goes stale. `pnpm test` in the js job skips it (no samples there).
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: js

      - uses: ./.github/actions/setup-pnpm

      - name: Build svelters-compile
        run: cargo build -p svelters-compiler --bin svelters-compile

      - name: Build packages (pnpm -r build, docs site excluded)
        run: pnpm build

      - name: Fetch Svelte samples (tag svelte@5.57.2)
        run: |
          up=$RUNNER_TEMP/up
          mkdir -p "$up/svelte"
          curl -sSfL https://codeload.github.com/sveltejs/svelte/tar.gz/refs/tags/svelte@5.57.2 -o "$up/svelte.tgz"
          tar -xzf "$up/svelte.tgz" -C "$up/svelte" --strip-components=1
          echo "UPSTREAM=$up" >> "$GITHUB_ENV"

      - name: Conformance --check
        working-directory: experiments/native-compiler/conformance
        env:
          TIMEOUT_MS: '60000'
          JOBS: '4'
        run: node run.mjs --check && tail -n 40 REPORT.md

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            experiments/native-compiler/conformance/results.json
            experiments/native-compiler/conformance/REPORT.md

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: No build artifacts tracked (target/ dirs, files over 8 MB)
        run: tools/dev/check-no-artifacts

      - name: Python deps (system python; build scripts run python3 -I)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-jsonschema python3-pytest

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: js

      - uses: ./.github/actions/setup-pnpm

      # The compiled experiment (pnpm -r build) and its tests need the Rust compiler binary.
      - name: Build svelters-compile
        run: cargo build -p svelters-compiler --bin svelters-compile

      - name: Build packages and fixtures (pnpm -r build, docs site excluded)
        run: pnpm build

      - name: JS package tests
        run: pnpm -r --workspace-concurrency=4 --filter '!@svelters/docs' test

      - name: pnpm test:meta
        if: ${{ !cancelled() }}
        run: pnpm test:meta

      - name: pnpm docs:test
        if: ${{ !cancelled() }}
        run: pnpm docs:test

      # `svelters docs` (C0, plans/milestones/CL0-cli-docs.md): unit + golden tests and the pack/site
      # consistency test (needs node and the docs IR, which docs:test above has built). No GUI here,
      # so the nextest headless wrapper is bypassed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: svelters-cli tests
        if: ${{ !cancelled() }}
        env:
          SVELTERS_SHOW_GUI: '1'
        run: |
          cargo clippy -p svelters-cli --all-targets -- -D warnings
          cargo nextest run -p svelters-cli --no-fail-fast
          cargo run -q -p svelters-cli -- docs-pack
          cargo run -q -p svelters-cli -- docs gtk button --brief
          cargo run -q -p svelters-cli -- docs qt main-window.close --json || test $? -eq 2
