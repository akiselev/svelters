name: linux-gtk

on:
  push:
    branches: [master, 'ci/**']
    # presto-only pushes (crates/presto*, lane records) are covered by presto.yml (coordinator, 2026-10-25)
    paths-ignore: ['crates/presto/**', 'crates/presto-*/**', 'plans/cloud/presto-*/**', 'plans/milestones/PRESTO-*', 'plans/research/presto/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Software GL under Xvfb is slow and flaky; the cairo renderer is deterministic.
  GSK_RENDERER: cairo
  NO_AT_BRIDGE: "1"

jobs:
  # The test suite, on a current GTK (Arch, like local development: 4.22 at the time of writing).
  gtk:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: System packages (GTK4, Xvfb, fonts, toolchain)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git gtk4 gobject-introspection-runtime xorg-server-xvfb xorg-xauth dbus \
            ttf-dejavu noto-fonts imagemagick python python-yaml python-jsonschema python-pytest \
            mesa libxkbcommon-x11 libxcursor libxrandr libxi \
            rustup nodejs
          pkg-config --modversion gtk4
          git config --global --add safe.directory '*'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-gtk-arch
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: ./.github/actions/setup-pnpm

      - name: Build svelters-compile (needed by pnpm build)
        run: cargo build -p svelters-compiler --bin svelters-compile
      - name: Build bundles
        run: pnpm build

      # counter is built without its Qt feature; its *_qt tests run in linux-qt.yml.
      - name: Build tests
        run: >
          cargo nextest run --no-run
          -p svelters-abi -p svelters-backend-log -p svelters-host -p svelters-modules -p svelters-compiler -p svelters-gtk -p svelters -p exports-example -p svelters-egui -p svelters-automation -p egui-kinds-example -p svelters-testkit -p svelters-conformance -p svelters-intl -p svelters-sched
          -p counter --no-default-features --features counter/gtk

      # ZU3 (plans/milestones/ZU3-ui-thread.md): the UI-thread lint. clippy.toml in svelters-host and
      # svelters-egui lists blocking fs/process/wait calls; their lib.rs deny it, so a new call fails
      # here unless it carries an `#[allow]` with a reason. No `-D warnings`: other lints stay advisory.
      - name: clippy (UI-thread lint)
        run: cargo clippy -p svelters-host -p svelters-egui --all-targets

      - name: nextest (GTK, egui, host, compiler)
        timeout-minutes: 30
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session --
          cargo nextest run --no-fail-fast
          -p svelters-abi -p svelters-backend-log -p svelters-host -p svelters-modules -p svelters-compiler -p svelters-gtk -p svelters -p exports-example -p svelters-egui -p svelters-automation -p egui-kinds-example -p svelters-testkit -p svelters-conformance -p svelters-intl -p svelters-sched
          -p counter --no-default-features --features counter/gtk
          -E 'not (package(counter) & test(/qt/))'

      # AU2b: @svelters/test on the real host: svelters' own e2e runner (svelters-e2e) on the counter
      # fixture and `mount`, and the client's own svelters-run test. "Build tests" built svelters-run
      # (svelters-automation's integration tests need its binary); no display is needed (kittest).
      - name: e2e runner (svelters-run, counter fixture)
        env:
          SVELTERS_RUN: ${{ github.workspace }}/target/debug/svelters-run
        run: pnpm --filter @svelters/test test

      # Platform-neutral parts of the other backends (tables, parsers; empty suites off-platform) and
      # the CSS engine (svelters-style), which links no toolkit.
      - name: nextest (portable backend crates)
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast -p svelters-apple -p svelters-appkit -p svelters-winui -p counter-mac -p counter-win -p svelters-style

      - name: Upload screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-gtk-artifacts
          if-no-files-found: ignore
          path: |
            target/gallery/
            target/p5/
            target/m2b/
            target/testkit/
            target/na/
            target/vis1c/
            target/*.png

  # LS2 (SV47): the T2 list benches in release: `virtual-list` (RowSource) and `table` (RowModel) at
  # 20k and 100k rows (bind per row, page rebind, fling, sort, filter). The numbers go to the job
  # summary; the asserted bounds are generous (they catch gross regressions, not the numbers).
  egui-benches:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-egui-benches
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: T2 benches (release)
        env:
          LS2_BENCH_OUT: ${{ runner.temp }}/ls2-bench.txt
        run: cargo nextest run --release -p svelters-egui --test ls2 -E 'test(/^bench_/)' --no-capture
      - name: Report the numbers
        if: ${{ !cancelled() }}
        run: |
          { echo '### LS2 T2 benches (release)'; echo '```'; cat "${{ runner.temp }}/ls2-bench.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # TK1: the egui runs of tests/cases with `snapshot` steps rendered through wgpu on lavapipe (Mesa's
  # software Vulkan) and compared with the committed PNGs in tests/cases/snapshots. A case whose
  # snapshot does not exist yet records it (uploaded below; commit it).
  egui-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Vulkan only: lavapipe. wgpu's GL fallback probes DRI devices the runner does not have.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: System packages (lavapipe, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools fonts-dejavu-core
          vulkaninfo --summary | grep -iE 'deviceName|driverName' || true
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-egui-snapshots
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: ./.github/actions/setup-pnpm
      - name: Build svelters-compile (the cases are compiled by it)
        run: cargo build -p svelters-compiler --bin svelters-compile
      - name: Build the cases and the egui gallery (VIS1c's page)
        run: |
          pnpm --filter ./tests/cases build
          pnpm --filter ./fixtures/gallery-egui build

      - name: nextest (egui cases with snapshots)
        timeout-minutes: 30
        run: cargo nextest run --no-fail-fast -p svelters-testkit --features snapshots -E 'test(cases_on_egui)'

      # VIS1c: the own widgets against the VS Code references (the gate also runs in the main job);
      # here with the review crops for conformance/visual/tools/sheet.py (uploaded below)
      - name: nextest (VIS1c visual gate, with crops)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo nextest run --no-fail-fast -p svelters-testkit --features snapshots -E 'binary(vis1)'

      - name: Upload snapshots and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: egui-snapshots
          if-no-files-found: ignore
          path: |
            tests/cases/snapshots/
            target/testkit/
            target/vis1c/

  # The oldest supported GTK (docs/notes/fg1-gtk-compat.md): Ubuntu 24.04 ships GTK 4.14. The same
  # backend build must link and pass here; kinds/members newer than 4.14 are resolved at run time
  # and their tests print "SKIP: needs GTK x.y".
  gtk-4-14:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages (GTK 4.14, Xvfb, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgirepository-2.0-dev gir1.2-gtk-4.0 xvfb xauth dbus dbus-x11 \
            fonts-dejavu-core fonts-noto-core librsvg2-common imagemagick python3-yaml python3-jsonschema python3-pytest
          pkg-config --modversion gtk4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-gtk-4-14
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: ./.github/actions/setup-pnpm

      - name: Build svelters-compile (needed by pnpm build)
        run: cargo build -p svelters-compiler --bin svelters-compile
      - name: Build bundles
        run: pnpm build

      - name: Build tests against GTK 4.14
        run: cargo nextest run --no-run -p svelters-gtk -p counter --no-default-features --features counter/gtk

      - name: nextest (GTK 4.14)
        timeout-minutes: 30
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session --
          cargo nextest run --no-fail-fast --success-output never
          -p svelters-gtk -p counter --no-default-features --features counter/gtk
          -E 'not (package(counter) & test(/qt/))'
