name: windows-winui

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Print each WinUI init step (crates/svelters-winui/src/app.rs).
  SVELTERS_WINUI_TRACE: "1"
  WINAPPRT_VERSION: "2.5.1"

jobs:
  winui:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # Keep LF checkouts: generated files and fingerprints are compared byte for byte.
      - name: git config
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          [Environment]::OSVersion.Version
          (Get-CimInstance Win32_OperatingSystem).Caption

      - name: Install Windows App Runtime (NuGet MSIX packages)
        run: |
          $v = $env:WINAPPRT_VERSION
          $dir = "$env:RUNNER_TEMP\winapprt"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk.runtime/$v/microsoft.windowsappsdk.runtime.$v.nupkg" -OutFile "$dir\rt.zip"
          Expand-Archive "$dir\rt.zip" "$dir\rt"
          Get-ChildItem "$dir\rt\tools\MSIX\win10-x64\*.msix" | Sort-Object { if ($_.Name -match 'Main|Singleton|DDLM') { 1 } else { 0 } } | ForEach-Object {
            Write-Host "Add-AppxPackage $($_.Name)"
            try { Add-AppxPackage -Path $_.FullName -ErrorAction Stop } catch { Write-Warning "$($_.Name): $_" }
          }
          Get-AppxPackage *WindowsAppRuntime* | Select-Object Name, Version | Format-Table -AutoSize

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal; rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-winui

      - uses: ./.github/actions/setup-pnpm
      - name: Build svelters-compile (the fixtures are compiled by it)
        run: cargo build -p svelters-compiler --bin svelters-compile
      - name: Build bundles
        run: pnpm --filter './fixtures/*' build

      - name: Fetch the Windows App SDK bootstrapper
        run: python tools/metadata/winui/fetch.py --bootstrap

      - name: Build tests
        run: cargo test --no-run -p svelters-winui -p counter-win

      - name: svelters-winui lib
        timeout-minutes: 10
        run: cargo test -p svelters-winui --lib
      - name: svelters-winui generated
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        # One JSON line per test start and result for the verified ledger, next to the fact manifest the binary was
        # generated from (artifact windows-winui-report, logs/winui-ledger):
        #   python3 tools/metadata/ledger.py import --toolkit winui <unpacked artifact>
        # records passes and parks failing inferred facts; the next run must then be green.
        run: |
          New-Item -ItemType Directory -Force logs/winui-ledger | Out-Null
          $env:SVELTERS_TEST_RESULTS = "$pwd\logs\winui-ledger\winui-results.jsonl"
          Remove-Item -ErrorAction SilentlyContinue $env:SVELTERS_TEST_RESULTS
          Copy-Item crates/svelters-winui/src/generated/facts.json logs/winui-ledger/facts.json
          git rev-parse HEAD | Out-File -Encoding ascii logs/winui-ledger/commit.txt
          cmd /c "cargo test -p svelters-winui --test generated > logs\generated.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content logs\generated.log
          exit $code
      - name: counter-win selftest
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          cmd /c "cargo run -p counter-win -- --selftest --report report.json > logs\selftest.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content logs\selftest.log
          if (Test-Path report.json) { Get-Content report.json }
          exit $code
      - name: counter-win test
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p counter-win --test counter

      - name: Application event log (crashes)
        if: ${{ failure() }}
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.LevelDisplayName -in 'Error','Critical' } | Format-List TimeCreated, ProviderName, Message

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-winui-report
          if-no-files-found: ignore
          path: |
            report.json
            logs/
            target/*.png
