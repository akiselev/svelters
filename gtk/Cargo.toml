[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters-gtk"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "lib.rs"
name = "svelters_gtk"

[dependencies]
gio = "0.14.8"
tracing = "0.1.26"
gobject-sys = "0.14.0"
lazy_static = "1.4.0"
rquickjs = { version = "0.1.2", path = "../lib/rquickjs", features = [
    "full",
    "backtrace",
    "tokio",
    "rust-alloc",
    # "bindgen",
    # "frunk",
    # "dump-gc",
    # "dump-gc-free",
    # "dump-free",
    "dump-leaks",
    # "dump-mem",
] }
anyhow = "1.0.40"
glib = "0.14.8"
itertools = "0.10.1"
convert_case = "0.4.0"
typedmap = "0.1.1"
gdk4 = "0.3.1"
inventory = "0.2.0"
once_cell = "1.8.0"
futures-util = "0.3.17"
tracing-subscriber = "0.3.1"
tracing-log = "0.1.2"
tarpc = "0.27.2"
sled = "0.34.7"
flume = "0.10.9"

[dependencies.gtk4]
version = "0.3.1"
features = ["v4_2"]
