# Rules for tools/icons/icons.py (lint, build, sheet), from plans/research/ICON-STYLE.md (IC0): §3 (grid),
# §5.1 (per-size table), §5.2 (masters), §6 (colour slots), §7 (tone and badges) and §10 (lint rules L1-L13).
# Change a value here when ICON-STYLE changes; the lint has no other copy of these numbers.
#
# Fixed in the code, not here: the user's choices O1 round terminals (caps round, butt where §3.1 allows),
# O2 the 45-degree cut on every frame (square corners: no rx/ry), O3 solid 90-degree arrowheads (L11).

max_bytes = 1536                                  # L13
badges = ["add", "remove", "warning", "link", "lock", "run", "check", "error", "settings", "queued", "stale"]
# L4: `class="accent"` only on state glyphs (§6). Globs.
accent_ids = ["chrome.run", "chrome.stop", "chrome.error", "chrome.warning", "chrome.info", "chrome.breakpoint*",
              "chrome.pass", "chrome.fail", "status.*"]
fringe_ids = ["sim.result*"]                      # L5: the results fringe may use .2 and .45
subject_outline = true                            # L4: a subject fill may keep its outline (pending ICR1's usvg test, §6)
hc_tone = 0.6                                     # build: High Contrast copies raise the subject tone (§5.4)

[masters]                                         # L12 (§5.2)
all = [16]                                        # every id
domains = { chrome = [16, 20, 24] }               # all chrome: crisp at 125% and 150%
# per-icon `uses` in icons.toml: the command strip, comfortable toolbars, the status bar and compact density,
# inline text and tree badges
uses = { strip = [24], toolbar = [20], status = [14], compact = [14], inline = [12], tree-badge = [12] }

# One table per optical size (§5.1). Coordinates are stroke centres.
#   stroke       root stroke-width (L1). Centres (L6): even whole widths on integers, every other width on .5
#   copper       copper traces and spokes, and gear teeth (L9)
#   hatch        an extra width allowed only inside a clip-path (section and fixed-support hatching, L9)
#   pad          L8: stroke centres lie in pad..size-pad, fills reach half a pixel further (heads, clipped parts and
#                the ends of open strokes are exempt). This is ICON-STYLE's pad + .5, except at 24, where §5.1's pad 2
#                and §3.2's iso-slab keyline (1.5..21.5) disagree; the samples follow the keyline, so 24 uses 1.5.
#   min_gap      clear px between parallel strokes that run side by side for more than 1px (L10)
#   min_counter  clear px across a stroked rect or circle (L10)
#   arrowhead    half-base = length of the solid 90-degree head (L11)
#   cut          the T2 corner cut (review only; listed for the generator prompt)
#   tone         false: no 40% subject tone at this size, the subject is solid or an outline (L5)
#   badge        the badge cell, bottom right (0: no badges at this size)
#   dash         the one allowed dasharray (centre lines; [] = no dashed lines at this size)
# Copper at 12, 14 and 20, and dash at 14 and 20, are not in ICON-STYLE; they are placeholders.

[size.12]
stroke = 1
copper = 2
pad = 0.5                                       # the main shape may use the pad at 12
min_gap = 1
min_counter = 2
arrowhead = 2
cut = 2
tone = false
badge = 0
dash = []                                         # dash-dot becomes solid at 12

[size.14]
stroke = 1
copper = 2
pad = 1.5
min_gap = 1
min_counter = 2
arrowhead = 2.5
cut = 3
tone = true
badge = 0
dash = [4, 1, 1, 1]

[size.16]
stroke = 1
copper = 2
hatch = 1
pad = 1.5
min_gap = 1
min_counter = 2
arrowhead = 3
cut = 3
tone = true
badge = 8
dash = [4, 1, 1, 1]

[size.20]
stroke = 1.25
copper = 2
hatch = 1
pad = 1.5
min_gap = 1.75
min_counter = 3
arrowhead = 3.5
cut = 4
tone = true
badge = 10
dash = [5, 1.25, 1.25, 1.25]

[size.24]
stroke = 1.5
copper = 3
hatch = 1
pad = 1.5
min_gap = 1.5
min_counter = 3
arrowhead = 4.5
cut = 5
tone = true
badge = 12
dash = [6, 1.5, 1.5, 1.5]

# 32: illustration masters only; UI 32 and 48 are the 16 and 24 masters at 2x (§4, §5.1). Values are the 16
# master doubled.
[size.32]
stroke = 2
copper = 4
hatch = 2
pad = 3
min_gap = 2
min_counter = 4
arrowhead = 6
cut = 6
tone = true
badge = 16
dash = [8, 2, 2, 2]
