# Rules data for tools/metadata/qt/infer.py (AI1 slice 2, plans/research/ANNOTATION-AUTOMATION.md sections 2 and 11).
#
# Qt exposure is accept-by-pattern (decision 6): only the fact patterns listed under `accept` are written, and only
# on classes a manual override already exposes as an element (tags and constructs stay a manual decision). Every
# other candidate is a review row in metadata/inferred/qt/_review.json.

# Facts at or above this confidence (and of an accepted pattern) are written; the rest are review rows.
promote_at: 0.9

# Patterns the inference writes (`<section>:<rule>`):
accept:
  - prop:round-trip           # P1/P3: a writable scalar or enum Q_PROPERTY whose probe sample read back exactly
  - method:read-only-getter   # M1: the READ accessor of a read-only Q_PROPERTY (probe: getter == property)
  - signal:notify-trigger     # R2: a signal with scalar/enum arguments emitted once per set of the property it NOTIFYs
  - signal:property-trigger   # R2: the same, emitted by setting another probed property (sample, default, sample)
  - signal:delivery-only      # R2: a scalar-argument signal no probed set emits; the generated test emits it through
                              #     QMetaMethod::invoke (decision 2: counts as `verified: delivery`)
  - binding:notify            # B1: a writable scalar/enum property with a NOTIFY signal that fired on the probe set

# Q_PROPERTY C++ type -> neutral ref the generated tests compare (anything else: no sampler, no fact).
scalar_types: { bool: bool, int: i32, uint: u32, qlonglong: i64, qulonglong: u64, double: f64, qreal: f64, float: f32, QString: string }

# Probe recipe call -> the C++ precondition the generated test runs after creating the element ($w: the widget,
# cast to the element's class). Same call, same arguments as tools/metadata/qt/probe.py.
recipes:
  setRange: "$w->setRange(0, 100)"
  addItems: '$w->addItems(QStringList{QStringLiteral("a"), QStringLiteral("b"), QStringLiteral("c")})'
  addTab: 'for (int k = 0; k < 3; ++k) $w->addTab(new QWidget, QStringLiteral("t"))'
  addWidget: "for (int k = 0; k < 3; ++k) $w->addWidget(new QWidget)"
  addItem: 'for (int k = 0; k < 3; ++k) $w->addItem(QStringLiteral("x"))'
  setCheckable: "$w->setCheckable(true)"
  setText: '$w->setText(QStringLiteral("hello world"))'
  setPlainText: '$w->setPlainText(QStringLiteral("hello world"))'

# Never inferred, by native name (regex, full match), with the reason shown in the review summary.
deny_props:
  - { pattern: "(windowTitle|windowModality|windowFlags|windowState|modal|visible|enabled|geometry)", reason: "window/visibility state owned by the renderer" }
  - { pattern: "(currentFont|font\\w*)", reason: "font defaults differ between platforms and Qt versions" }
deny_methods:
  - { pattern: "(winId|effectiveWinId|internalWinId|devicePixelRatio\\w*|logicalDpi\\w*|physicalDpi\\w*|width\\w*|height\\w*|depth|colorCount|paintingActive)", reason: "display-dependent value" }
deny_signals:
  - { pattern: "(windowTitleChanged|windowIconChanged|windowIconTextChanged|customContextMenuRequested|objectNameChanged|destroyed)", reason: "QWidget/QObject signal, annotated on the QWidget inherit block" }

# Observability rules O2-O5, O8, O10 (milestone R0, plans/research/REACTIVITY.md section 4.4;
# tools/metadata/qt/observe_rules.py). Evidence: the observe probe of this Qt version
# (tools/metadata/qt/probe.py --section observe) and moc's BINDABLE/NOTIFY/CONSTANT (tools/metadata/qt/ingest_moc.py).
observe:
  probe: "6.11.3"
  # O4: QWidget properties without NOTIFY whose changes arrive as QEvents (QWidget docs, QEvent::Type). Keys are
  # `<class>:<prop>`; `QWidget:<prop>` applies to every QWidget subclass.
  events:
    "QWidget:enabled": [EnabledChange]
    "QWidget:visible": [Show, Hide, ShowToParent, HideToParent]
    "QWidget:geometry": [Resize, Move]
    "QWidget:frameGeometry": [Resize, Move]
    "QWidget:normalGeometry": [Resize, Move]
    "QWidget:pos": [Move]
    "QWidget:x": [Move]
    "QWidget:y": [Move]
    "QWidget:size": [Resize]
    "QWidget:frameSize": [Resize]
    "QWidget:width": [Resize]
    "QWidget:height": [Resize]
    "QWidget:rect": [Resize]
    "QWidget:font": [FontChange]
    "QWidget:palette": [PaletteChange]
    "QWidget:toolTip": [ToolTipChange]
    "QWidget:windowState": [WindowStateChange]
    "QWidget:minimized": [WindowStateChange]
    "QWidget:maximized": [WindowStateChange]
    "QWidget:fullScreen": [WindowStateChange]
    "QWidget:windowModified": [ModifiedChange]
    "QWidget:cursor": [CursorChange]
    "QWidget:layoutDirection": [LayoutDirectionChange]
    "QWidget:styleSheet": [StyleChange]
    "QWidget:locale": [LocaleChange]
    "QWidget:acceptDrops": [AcceptDropsChange]
    "QWidget:mouseTracking": [MouseTrackingChange]
    "QWidget:tabletTracking": [TabletTrackingChange]
    "QWidget:isActiveWindow": [ActivationChange, WindowActivate, WindowDeactivate]
    "QWidget:focus": [FocusIn, FocusOut]
    "QLineEdit:readOnly": [ReadOnlyChange]
    "QTextEdit:readOnly": [ReadOnlyChange]
    "QPlainTextEdit:readOnly": [ReadOnlyChange]
    "QAbstractSpinBox:readOnly": [ReadOnlyChange]
  # Geometry of a hidden widget changes at once, but Qt sends Resize/Move only when it is shown (probe scenario).
  deferred: ["QWidget:geometry", "QWidget:frameGeometry", "QWidget:normalGeometry", "QWidget:pos", "QWidget:x", "QWidget:y",
             "QWidget:size", "QWidget:frameSize", "QWidget:width", "QWidget:height", "QWidget:rect"]
  # O5: signals that report a property without NOTIFY, beyond the name pairs `<prop>Changed`/`<prop>Edited`.
  signals:
    "QLineEdit:modified": [textEdited, textChanged]
    "QLineEdit:selectedText": [selectionChanged]
    "QLineEdit:hasSelectedText": [selectionChanged]
    "QLineEdit:displayText": [textChanged]
    "QLineEdit:undoAvailable": [textChanged]
    "QLineEdit:redoAvailable": [textChanged]
    "QTextEdit:plainText": [textChanged]
    "QTextDocument:modified": [modificationChanged]
    "QTextDocument:blockCount": [blockCountChanged]
    "QComboBox:currentData": [currentIndexChanged]
    "QAbstractButton:down": [pressed, released]
  # O10: whole-text properties: the host does not read and compare them on every change.
  proportional: ["QTextEdit:html", "QTextEdit:markdown", "QTextEdit:plainText", "QPlainTextEdit:plainText"]
  # What a probe scenario that changed a property unannounced stands for (`missed`); anything else: cross_prop.
  scenario_missed:
    "QLineEdit keyClicks": user_edit
    "QPlainTextEdit keyClicks": user_edit
    "QPlainTextEdit keyClicks: its document": user_edit
    "QTextEdit keyClicks": user_edit
    "QSpinBox keyClicks": user_edit
    "QCheckBox mouseClick": user_edit
    "parent setEnabled(false)": parent
    "parent hide()": parent
    "hidden QWidget resize": layout
    "setItemData(current)": programmatic
  # Scenarios whose changes Qt announces later rather than never (a hidden widget gets Resize/Move at show()).
  deferred_scenarios: ["hidden QWidget resize"]
  # The same for the probe's O4 section (milestone R3), whose table replaces `events` above as the source of O4:
  # `events` stays as the cross-check and fills in for properties the probe never saw change.
  o4_deferred: ["scenario:hidden resize", "scenario:hidden move"]
  # Milestone R3: how the generated test changes a property it cannot simply write (read-only, not a Q_PROPERTY),
  # and how a user changes it. C++ statements on `o`, a pointer to the fact's `verify.on` class:
  #   check    overrides the check (silent: the change `native` makes must not be announced)
  #   trigger  another Q_PROPERTY written natively (its next value); native: a statement; setup: run before observing
  #   user     a user-path synthesizer (ut_keys/ut_key/ut_click/ut_press of verify.cpp.in): its change is announced
  triggers:
    "QWidget:x": {trigger: geometry}
    "QWidget:y": {trigger: geometry}
    "QWidget:width": {trigger: geometry}
    "QWidget:height": {trigger: geometry}
    "QWidget:rect": {trigger: geometry}
    "QWidget:frameGeometry": {trigger: geometry}
    "QWidget:frameSize": {trigger: geometry}
    "QWidget:normalGeometry": {trigger: geometry}
    "QWidget:minimized": {native: "o->showMinimized()"}
    "QWidget:maximized": {native: "o->showMaximized()"}
    "QWidget:fullScreen": {native: "o->showFullScreen()"}
    "QLineEdit:cursorPosition": {setup: "o->setText(\"hello\")", native: "o->setCursorPosition(2)", user: "ut_keys(o, \"ab\")"}
    "QAction:checked": {setup: "o->setCheckable(true)", native: "o->setChecked(!o->isChecked())"}
    "QLineEdit:text": {user: "ut_keys(o, \"ab\")"}
    "QLineEdit:displayText": {native: "o->setText(o->text() + \"x\")", user: "ut_keys(o, \"ab\")"}
    "QLineEdit:undoAvailable": {native: "o->insert(\"b\")", user: "ut_keys(o, \"ab\")"}
    "QLineEdit:redoAvailable": {setup: "o->insert(\"ab\")", native: "o->undo()", user: "ut_key(o, Qt::Key_Z, Qt::ControlModifier)"}
    "QLineEdit:selectedText": {setup: "o->setText(\"hello\")", native: "o->setSelection(0, 3)", user: "ut_key(o, Qt::Key_Left, Qt::ShiftModifier)"}
    "QLineEdit:hasSelectedText": {setup: "o->setText(\"hello\")", native: "o->setSelection(0, 3)", user: "ut_key(o, Qt::Key_Left, Qt::ShiftModifier)"}
    "QLineEdit:modified": {user: "ut_keys(o, \"ab\")"}
    "QTextEdit:plainText": {user: "ut_keys(o, \"ab\")"}
    "QPlainTextEdit:plainText": {user: "ut_keys(o, \"ab\")"}
    "QPlainTextEdit:blockCount": {native: "o->setPlainText(\"a\\nb\")", user: "ut_key(o, Qt::Key_Return)"}
    "QTextDocument:blockCount": {native: "o->setPlainText(\"a\\nb\")"}
    "QComboBox:currentData": {check: silent, setup: "auto *m = new QStandardItemModel(o); m->appendRow(new QStandardItem(\"a\")); m->appendRow(new QStandardItem(\"b\")); o->setModel(m); o->setCurrentIndex(0); o->setItemData(0, 1)", native: "o->setItemData(o->currentIndex(), o->currentData().toInt() + 7)"}
    "QAbstractButton:down": {user: "ut_press(o)"}
    "QAbstractButton:checked": {user: "ut_click(o)"}
    "QAbstractSlider:value": {user: "ut_key(o, Qt::Key_Up)"}
    "QSpinBox:value": {user: "ut_key(o, Qt::Key_Up)"}
    "QInputDialog:intValue": {native: "o->setIntValue(o->intValue() + 1)"}
    "QInputDialog:doubleValue": {native: "o->setDoubleValue(o->doubleValue() + 1)"}
    "QInputDialog:textValue": {native: "o->setTextValue(o->textValue() + \"x\")"}
    "QTimer:active": {native: "o->start(100000)"}
    # Bindings R2 lowers onto observation (their exact facts were only `connect`-checked): a real native change.
    "QDateTimeEdit:date": {native: "o->setDate(o->date().addDays(1))"}
    "QDateTimeEdit:dateTime": {native: "o->setDateTime(o->dateTime().addSecs(3600))"}
    "QListWidget:currentRow": {setup: "o->addItem(\"a\"); o->addItem(\"b\")", native: "o->setCurrentRow(o->currentRow() == 1 ? 0 : 1)"}
    "QStackedWidget:currentIndex": {setup: "o->addWidget(new QWidget); o->addWidget(new QWidget)", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    "QTabBar:currentIndex": {setup: "o->addTab(\"a\"); o->addTab(\"b\")", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    "QTabWidget:currentIndex": {setup: "o->addTab(new QWidget, \"a\"); o->addTab(new QWidget, \"b\")", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    "QUndoStack:canUndo": {native: "o->push(new QUndoCommand(\"a\"))"}
    "QUndoStack:clean": {native: "o->push(new QUndoCommand(\"a\"))"}
    "QUndoStack:undoText": {native: "o->push(new QUndoCommand(\"a\"))"}
    "QUndoStack:canRedo": {setup: "o->push(new QUndoCommand(\"a\"))", native: "o->undo()"}
    "QUndoStack:redoText": {setup: "o->push(new QUndoCommand(\"a\"))", native: "o->undo()"}
    "QStackedLayout:currentIndex": {setup: "o->addWidget(new QWidget); o->addWidget(new QWidget)", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    "QDataWidgetMapper:currentIndex": {setup: "o->setModel(new QStandardItemModel(2, 1, o))", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    "QWizard:currentId": {setup: "o->addPage(new QWizardPage); o->addPage(new QWizardPage); o->restart()", native: "o->next()"}
    "QAction:icon": {native: "QPixmap px(4, 4); px.fill(Qt::red); o->setIcon(QIcon(px))"}
    "QWidget:windowIcon": {native: "QPixmap px(4, 4); px.fill(Qt::red); o->setWindowIcon(QIcon(px))"}
    "QToolBox:currentIndex": {setup: "o->addItem(new QWidget, \"a\"); o->addItem(new QWidget, \"b\")", native: "o->setCurrentIndex(o->currentIndex() == 1 ? 0 : 1)"}
    # OV1: exact facts whose rows only connected (R3): a native change for each.
    "QAbstractAnimation:currentLoop": {setup: "o->setDuration(10); o->setLoopCount(3)", native: "o->setCurrentTime(o->currentLoop() == 0 ? 15 : 5)"}
    "QAbstractAnimation:currentTime": {setup: "o->addAnimation(new QPauseAnimation(100))", native: "o->setCurrentTime(o->currentTime() == 50 ? 20 : 50)"}
    "QAbstractAnimation:direction": {native: "o->setDirection(o->direction() == QAbstractAnimation::Forward ? QAbstractAnimation::Backward : QAbstractAnimation::Forward)"}
    "QAbstractAnimation:loopCount": {native: "o->setLoopCount(o->loopCount() + 1)"}
    "QAbstractAnimation:state": {setup: "o->setDuration(100000)", native: "if (o->state() == QAbstractAnimation::Running) o->stop(); else o->start()"}
    "QAbstractProxyModel:sourceModel": {native: "o->setSourceModel(new QStandardItemModel(o))"}
    "QItemSelectionModel:selectedIndexes": {setup: "o->setModel(new QStandardItemModel(2, 1, o))", native: "o->select(o->model()->index(o->isSelected(o->model()->index(0, 0)) ? 1 : 0, 0), QItemSelectionModel::ClearAndSelect)"}
    "QSequentialAnimationGroup:currentAnimation": {setup: "o->addPause(100); o->addPause(100)", native: "o->setCurrentTime(o->currentTime() < 100 ? 150 : 50)"}
    "QSortFilterProxyModel:filterRegularExpression": {native: "o->setFilterRegularExpression(QRegularExpression(o->filterRegularExpression().pattern() + \"x\"))"}
    "QVariantAnimation:currentValue": {setup: "o->setStartValue(0); o->setEndValue(100); o->setDuration(100)", native: "o->setCurrentTime(o->currentTime() == 50 ? 20 : 50)"}
    "QVariantAnimation:easingCurve": {native: "o->setEasingCurve(o->easingCurve().type() == QEasingCurve::Linear ? QEasingCurve::InQuad : QEasingCurve::Linear)"}
    "QRegularExpressionValidator:regularExpression": {native: "o->setRegularExpression(QRegularExpression(o->regularExpression().pattern() + \"x\"))"}
  # OV1: exact facts without delivery evidence (no passing native-change row), by group with the reason. Read by
  # tools/metadata/common/observe.py `unverified_groups` for the coverage report; `facts` names or a `pattern`.
  connect_only:
    - group: no-element-or-type
      reason: the class is neither an element nor an NT2 type, so the backend cannot reach it and the generated test has no row; no `bind:` can name these properties either
      pattern: '^QtWidgets:(QGraphics\w+|QHeaderView|QRhiWidget|QScroller|QStackedLayout|QDataWidgetMapper):'
    - group: crashes-bare
      reason: QDockWidget crashes on a bare instance (R0, R3), so no row is generated
      pattern: '^QtWidgets:QDockWidget:'
    - group: window-input
      reason: focus and window activation need a window manager; offscreen/xcb without one gives no reliable headless focus or activation (R3)
      facts: ["QtWidgets:QWidget:focus", "QtWidgets:QWidget:isActiveWindow"]
