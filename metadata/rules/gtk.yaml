# Data the GTK inference rules read (tools/metadata/gtk/infer.py; plans/research/ANNOTATION-AUTOMATION.md section 5.1).
# Decisions made by reviews belong here (patterns), single-fact decisions in metadata/overrides/gtk (`deny:` or a manual record).
schema: svelters-rules/v1
toolkit: gtk

# Facts below this confidence are not written to metadata/inferred/gtk; they are listed in _review.json
# (middle band 0.6-0.9, low band < 0.6) and stay unreviewed until someone decides on them.
promote_at: 0.9

# V1: the gtk4-rs feature baseline of crates/svelters-gtk (Cargo.toml `features = ["v4_6"]`). Slots are generated as
# typed gtk4-rs calls, so a slot whose setter, getter or kind is newer than this does not compile and is not inferred.
# Everything else goes through GIRepository at run time; members newer than the build minimum (4.14) are skipped on
# older GTK by the generated test (`skip_below_gtk`), so the required GTK 4.14 CI job still passes.
typed_baseline: "4.6"

# M2, exposure policy for GTK is deny-by-pattern: every introspectable method is reachable through GI, so a method
# is inferred unless a pattern denies it. Patterns match the C-style method name.
deny_methods:
  - pattern: '^(run|.*_run|main|block.*|grab_add|dispose|destroy|realize|unrealize|map|unmap|show|present)$'
    reason: blocking or lifecycle call; changes the widget's state machine, not a property
  - pattern: '^(measure|size_allocate|allocate|snapshot.*|queue_\w+|init_template|dispose_template|unparent|compute_\w+|pick|get_allocat\w+)$'
    reason: vfunc-context call that needs a layout or snapshot pass
  - pattern: '^(insert_after|insert_before|.*_with_time|activate_default|activate|close|set_startup_id|fullscreen|maximize|minimize|.*_dialog|error_bell|keynav_failed|mnemonic_activate|popup|popdown|emit_\w+|spin|update)$'
    reason: acts on the window system or a running main loop
  - pattern: '^(grab_focus|set_focus.*|focus|child_focus|move_focus|set_cursor_from_name|set_cursor)$'
    reason: depends on the realized window and the focus chain
  # AI1 review (docs/notes/ai1-gtk-review.md): child setters re-parent behind the slot model (children go through
  # `children` slots), and the backend itself sets a toplevel's application; the display is the window system's.
  - pattern: '^(set_child|set_(start|end)_child|set_(center|start|end|label|title)_widget|set_titlebar|set_parent|set_application|set_display)$'
    reason: re-parents a widget or rebinds a toplevel behind the renderer; children are slots, the backend owns application and display
  # Dangerous members (metadata/dangerous/gtk.yaml): the container ops the slots use, popover attach and the transient parent
  # the backend sets. `dangerous.py --check` fails when a dangerous method is not denied here.
  - pattern: '^(append|prepend|insert|remove|remove_all|insert_child_after|reorder_child_after|attach|attach_next_to|remove_row|remove_column|put|add_overlay|remove_overlay|pack_start|pack_end|add_child|add_named|add_titled|(append|prepend|insert)_page(_menu)?|remove_page|reorder_child|detach_tab|set_popover|set_transient_for)$'
    reason: dangerous member (metadata/dangerous/gtk.yaml) - a slot op or a toplevel binding the backend owns

# Signals that are never emitted synthetically (their class handler acts on the window system or needs a drag).
deny_signals:
  - pattern: '^(popup-menu|move-focus|keynav-failed|mnemonic-activate|show-help|query-tooltip|drag-.*|close-request|activate-default|insert-emoji)$'
    reason: class handler needs a realized window, a drag, or crashes on an unrooted widget

# S1: widget-typed properties that reference another widget in the tree instead of owning it as a child.
reference_names: [default, focus, mnemonic, transient, relative, buddy, key-capture, stack, popover-parent]

# B1: properties that do not get a generic `bind:` (no notify, or the binding table cannot carry the type).
bind_exclude_types: [u64]

# Float properties the probe left unsampled (outcome `identity`): a sample is taken from the GIR range, the first of
# these inside it, different from the default and exact as an f32. The generated test is the check (confidence 0.9).
float_samples: [0.25, 0.75, 2.0]

# Preconditions the probe found necessary for a round trip, with their Rust twin (test `setup`).
recipes:
  range: 'h.call_args(o, "set_range", &[V::F64(0.0), V::F64(100.0)]).unwrap();'
  text: 'h.set_str(o, "text", "hello world").unwrap();'

# Abstract kinds and interfaces are probed, and their facts tested, on an instance of a concrete subject (the
# element tag is that kind's tag). Kinds that already declare `verify_subject` in their manual override keep it.
subjects:
  Actionable: Button
  Editable: Entry
  Orientable: Box
  Scrollable: TextView
  Widget: Label

# Observability rules O1-O10 (milestone R0, plans/research/REACTIVITY.md section 4.4; tools/metadata/gtk/observe_rules.py).
# The evidence is the observe probe, metadata/probe/gtk/observe/<version>.json (tools/metadata/gtk/probe.py --section
# observe), for the GTK version of the ingested metadata.
observe:
  # O10: whole-text properties. The host does not read and compare them on every change (invalidation only).
  proportional: ["Gtk:TextBuffer:text", "Gtk:TextView:text"]
  # What a probe scenario that changed a property without notify stands for (`missed` of a partial fact);
  # any other cause is `cross_prop` (a side effect of another property set).
  scenario_missed:
    "Entry insert_text": user_edit
    "Window present": wm
    "Window maximize": wm
  # Preconditions on a new instance of these types before a native change (statement on `o: &glib::Object`): an
  # adjustment of a fresh range is 0..0, so every value write would be clamped away.
  setup:
    "Gtk:Range": 'o.downcast_ref::<gtk::Range>().unwrap().set_range(0.0, 100.0);'
    "Gtk:Scale": 'o.downcast_ref::<gtk::Range>().unwrap().set_range(0.0, 100.0);'
    "Gtk:Scrollbar": 'o.downcast_ref::<gtk::Scrollbar>().unwrap().adjustment().configure(0.0, 0.0, 100.0, 1.0, 10.0, 0.0);'
    "Gtk:SpinButton": 'o.downcast_ref::<gtk::SpinButton>().unwrap().set_range(0.0, 100.0);'
    "Gtk:Adjustment": 'o.downcast_ref::<gtk::Adjustment>().unwrap().configure(0.0, 0.0, 100.0, 1.0, 10.0, 0.0);'
  # Review decisions by pattern for read-only properties the probe never saw change (otherwise 0.8, unwritten):
  # `pattern` is a regex over `<Ns>:<Type>:<prop>`; exact unless `class: none` (the trigger then checks silence).
  accept:
    - pattern: ':n-items$'
      reason: GListModel implementations notify n-items with items-changed (GTK 4.8+, GLib 2.74+); the probe saw it on Gio.ListStore and Gtk.StringList
    - pattern: '^Gtk:Widget:parent$'
      reason: gtk_widget_set_parent and gtk_widget_unparent notify parent; the generated test appends the widget to a box (trigger)
    - pattern: '^Gtk:Editable:(cursor-position|selection-bound)$'
      reason: GtkText notifies both on cursor moves and selection changes and editable delegates (GtkEntry) forward the notify; the generated test selects a region (trigger)
    - pattern: '^Gtk:Label:mnemonic-keyval$'
      reason: recomputed and notified when the label text with use-underline changes; the generated test sets "_abc" (trigger)
    - pattern: '^Gtk:DropDown:selected-item$'
      reason: notified with selected when the model or the selection changes; the generated test sets a model and a selection (trigger)
    - pattern: '^Gtk:MapListModel:has-map$'
      reason: has-map reads whether the model maps items; notified by gtk_map_list_model_set_map_func; the generated test sets a model and a map function (trigger)
    - pattern: '^Gtk:EventController:widget$'
      class: none
      reason: set when the controller is added to or removed from a widget, without notify (GTK 4.22 gtk_event_controller_set_widget; the generated cross test saw no announcement, R0); the generated test adds it to a box (trigger)
    - pattern: '^Gio:DBusMessage:locked$'
      reason: notified by g_dbus_message_lock; the generated test locks the message (trigger)
    - pattern: '^Gio:Action:enabled$'
      reason: GSimpleAction notifies enabled in g_simple_action_set_enabled; the generated test toggles it (trigger)
    - pattern: '^Gtk:DirectoryList:loading$'
      reason: GtkDirectoryList notifies loading when it starts and stops enumerating (N3, the list's loading indicator); the generated test sets a directory (trigger)
  # Review decisions by pattern: read-only properties the probe never saw change that are fixed for the object's
  # lifetime (documented immutable, or set once while the object is built) -> constant (0.9). The backend still
  # installs `notify` for them (it refuses only CONSTRUCT_ONLY), so these facts have no generated test.
  constant:
    - pattern: ':item-type$'
      reason: the item type of a list model is fixed by its class (G_TYPE_OBJECT for the wrapping models since GTK 4.8, the element type otherwise)
    - pattern: '^Gtk:EnumListItem:(name|nick|value)$'
      reason: an enum list item is created for one enum value and never changes
    - pattern: '^Gtk:StringObject:string$'
      reason: GtkStringObject is immutable (gtk_string_object_new)
    - pattern: '^Pango:FontFamily:(name|is-monospace|is-variable)$'
      reason: properties of a font family the font map loaded; immutable
    - pattern: '^Gio:(Simple)?Action:(name|parameter-type|state-type)$'
      reason: GAction documents name, parameter-type and state-type as immutable
    - pattern: '^Gio:IOStream:(input-stream|output-stream)$'
      reason: the streams of an IO stream are fixed when it is built
    - pattern: '^Gdk:(Drag|Drop):display$'
      reason: the display of the construct-only device
    - pattern: '^Gtk:MessageDialog:message-area$|^Gtk:FontChooserWidget:tweak-action$|^Gtk:ColumnView:(columns|sorter)$'
      reason: an internal object the widget creates in init and never replaces
    - pattern: '^Gtk:TreeListModel:model$|^Gtk:TreeListRow:depth$'
      reason: the root model of a tree list model and the depth of a row are fixed when they are created
  # Read-only properties left without a fact on purpose (no trigger the generated tests can run headless, and not
  # immutable): absent = unknown for the compiler. Grouped with a reason; coverage.py reports the counts per group.
  unreviewed:
    - group: display-server
      pattern: '^Gdk:(Device|Monitor|Surface|Display|Clipboard):|^Gtk:Window:suspended$|^Gtk:Widget:scale-factor$|^Gtk:Application:screensaver-active$'
      reason: changed by the display server, an input device or another client; no synthesizer without a real display (REACTIVITY section 4.4 keeps WM-driven causes manual)
    - group: print-backend
      pattern: '^Gtk:(Printer|PrintUnixDialog|PrintOperation):'
      reason: set by a print backend or a running print operation
    - group: realize
      pattern: '^(Gdk:GLContext|Gtk:GLArea|Gsk:Renderer|Gtk:ATContext):'
      reason: changes when a surface, renderer or GL context is realized; the generated tests do not realize
    - group: window-input
      pattern: '^Gtk:Widget:(has-default|has-focus|root)$|^Gtk:(Entry|Text):scroll-offset$|^Gtk:Paned:(min|max)-position$|^Gtk:TreeViewColumn:|^Gtk:CellAreaContext:|^Gtk:ShortcutsGroup:height$|^Gtk:(EventControllerFocus|EventControllerMotion|DropControllerMotion|DropTarget):|^Gtk:ComboBox:popup-shown$|^Gtk:ScaleButton:active$|^Gtk:Stack:transition-running$|^Gtk:WindowControls:empty$|^Gtk:CellArea:|^Gtk:CellRenderer:editing$|^Gtk:MountOperation:is-showing$|^Gtk:FontChooser:font-features$|^Gtk:FileChooserWidget:show-time$'
      reason: set by layout, focus, pointer, drag-and-drop, settings or a user dialog in a mapped window; the generated tests neither map windows nor synthesize input
    - group: list-view
      pattern: '^Gtk:(ListItem|ColumnViewCell|ColumnViewRow|ListHeader|TreeExpander|ColumnViewColumn|TreeListRow|ColumnViewSorter):'
      reason: set by a list or column view while it binds rows, expands or sorts; needs a realized view
    - group: async-io
      pattern: '^Gtk:(BookmarkList|DirectoryList):|^Gtk:(Filter|Sort)ListModel:pending$|^Gtk:MediaStream:|^Gtk:RecentManager:size$|^Gtk:IconTheme:icon-names$'
      reason: changed by background loading, file IO, a media backend or the icon theme on disk
    - group: gio-service
      pattern: '^Gio:(Application|ApplicationCommandLine|DBusConnection|Permission|FileMonitor|IOStream|Settings):|^Gtk:Application:active-window$'
      reason: needs a registered application, a D-Bus connection, a GSettings schema, a permission or file monitor backend
    - group: lazy-model
      pattern: '^Gtk:(Assistant|Notebook|Stack):pages$|^Gtk:FileChooser:(filters|shortcut-folders)$'
      reason: a GListModel the widget creates on first read (weakly held); consumers observe the model's items-changed, not the property
    - group: stateless-instance
      pattern: '^Gio:Action:state$'
      reason: GSimpleAction notifies state in g_simple_action_set_state, but a bare instance is stateless (state-type is construct-only), so the generated test has nothing to change
  # Native changes no property set makes, as a statement on `o: &glib::Object` (the generated verification test):
  # `silent` checks for none/partial facts, `cross` for exact read-only ones.
  triggers:
    "Gtk:Entry:text-length": 'o.downcast_ref::<gtk::Editable>().unwrap().insert_text("abc", &mut 0);'
    "Gtk:EntryBuffer:length": 'o.downcast_ref::<gtk::EntryBuffer>().unwrap().insert_text(0, "abc");'
    "Gtk:TextBuffer:cursor-position": 'o.downcast_ref::<gtk::TextBuffer>().unwrap().insert_at_cursor("abc");'
    "Gtk:TextBuffer:can-undo": 'o.downcast_ref::<gtk::TextBuffer>().unwrap().insert_at_cursor("abc");'
    "Gtk:TextBuffer:has-selection": 'let b = o.downcast_ref::<gtk::TextBuffer>().unwrap(); b.set_text("abc"); let (s, e) = b.bounds(); b.select_range(&s, &e);'
    "Gio:ListStore:n-items": 'o.downcast_ref::<gtk::gio::ListStore>().unwrap().append(&gtk::glib::Object::new::<gtk::glib::Object>());'
    "Gtk:StringList:n-items": 'o.downcast_ref::<gtk::StringList>().unwrap().append("a");'
    "Gtk:Widget:parent": 'let w = o.downcast_ref::<gtk::Widget>().unwrap(); if w.parent().is_some() { w.unparent(); } else { let b = gtk::Box::new(gtk::Orientation::Horizontal, 0); b.append(w); std::mem::forget(b); }'
    "Gtk:Editable:cursor-position": 'let e = o.downcast_ref::<gtk::Editable>().unwrap(); e.set_text("abcd"); e.select_region(1, 3);'
    "Gtk:Editable:selection-bound": 'let e = o.downcast_ref::<gtk::Editable>().unwrap(); e.set_text("abcd"); e.select_region(1, 3);'
    "Gtk:Label:mnemonic-keyval": 'let l = o.downcast_ref::<gtk::Label>().unwrap(); l.set_use_underline(true); l.set_label("_abc");'
    "Gtk:DropDown:selected-item": 'let d = o.downcast_ref::<gtk::DropDown>().unwrap(); d.set_model(Some(&gtk::StringList::new(&["a", "b"]))); d.set_selected(1);'
    "Gtk:MapListModel:has-map": 'let m = o.downcast_ref::<gtk::MapListModel>().unwrap(); m.set_model(Some(&gtk::StringList::new(&["a"]))); m.set_map_func(|x| x.clone());'
    "Gtk:EventController:widget": 'let c = o.downcast_ref::<gtk::EventController>().unwrap(); if let Some(w) = c.widget() { w.remove_controller(c); } else { let b = gtk::Box::new(gtk::Orientation::Horizontal, 0); b.add_controller(c.clone()); std::mem::forget(b); }'
    "Gio:DBusMessage:locked": 'o.downcast_ref::<gtk::gio::DBusMessage>().unwrap().lock();'
    "Gtk:DirectoryList:loading": 'o.downcast_ref::<gtk::DirectoryList>().unwrap().set_file(Some(&gtk::gio::File::for_path("/")));'
    "Gio:Action:enabled": 'let a = o.downcast_ref::<gtk::gio::SimpleAction>().unwrap(); a.set_enabled(!gtk::gio::prelude::ActionExt::is_enabled(a));'
