  # OV1: the instance the generated test of an owner's facts uses where the probe made none (it skips types that
  # could reach printers, D-Bus or other processes) or the bare instance is abstract: `on` (a type by `<Ns>:<Type>`),
  # `make` (`static:<method>` of `on`, or `borrow:<tag>.<getter>`). Each was tried headless (no printer, no bus).
  instances:
    "Gio:Application": {"on": "Gio:Application", reason: "a bare GApplication, never registered"}
    "Gtk:Application": {"on": "Gtk:Application", reason: "a bare GtkApplication, never registered"}
    "Gtk:PrintOperation": {"on": "Gtk:PrintOperation", reason: "a bare print operation; nothing prints until gtk_print_operation_run"}
    "Gtk:MountOperation": {"on": "Gtk:MountOperation", reason: "a bare mount operation; nothing is shown until a mount asks"}
    "Gtk:TreeSelection": {"on": "Gtk:TreeSelection", make: "borrow:Gtk.TreeView.get_selection", reason: "a bare GtkTreeSelection crashes; a tree view's selection"}
  # OV1: exact facts whose generated test stays `connect` (installs and removes the mechanism only): no native
  # change the headless test can make. By group with the reason; the compiler keeps a declared signal plan for them
  # (`verified: weak`), or warns `bind_observation_unverified`.
  connect_only:
    - group: display-server
      reason: changed by the window manager (activation) or needs a real display connection a test cannot fake
      facts: ["Gtk:Window:is-active", "Gdk:Device:seat", "Gdk:Drag:actions", "Gdk:Drag:selected-action", "Gtk:DragIcon:child"]
    - group: gio-service
      reason: needs a registered GApplication (gtk_application_add_window and gtk_application_set_menubar act on a registered application only), a D-Bus connection or a file monitor backend; no test instance is made for the last two
      facts: ["Gtk:Window:application", "Gtk:Application:menubar", "Gio:DBusConnection:exit-on-close", "Gio:FileMonitor:rate-limit"]
    - group: list-view
      reason: a tree list row, a list header and a tree list model's root exist only inside a list model or view that creates them; a bare instance has no model, so nothing can change them
      facts: ["Gtk:TreeListRow:expanded", "Gtk:TreeListModel:n-items", "Gtk:ListHeader:n-items"]
    - group: container-page
      reason: a page object belongs to its container (gtk_notebook_get_page, gtk_stack_get_page); a bare GtkNotebookPage has no container to reorder it in, and a bare GtkStackPage crashes (the probe's crash list), so no test instance exists
      facts: ["Gtk:NotebookPage:position", "Gtk:StackPage:icon-name", "Gtk:StackPage:name", "Gtk:StackPage:needs-attention", "Gtk:StackPage:title", "Gtk:StackPage:use-underline", "Gtk:StackPage:visible"]
    - group: stateless-instance
      reason: GSimpleAction notifies state in g_simple_action_set_state, but a bare instance is stateless (state-type is construct-only), so the generated test has nothing to change
      facts: ["Gio:SimpleAction:state"]
    - group: async-io
      reason: GtkBookmarkList loads its construct-only file asynchronously; a bare instance reads the user's bookmarks
      facts: ["Gtk:BookmarkList:n-items"]
    - group: deprecated-content
      reason: the shortcuts window shows sections added from a builder file (gtk_shortcuts_window_add_section needs GTK 4.14 bindings this crate does not enable); a bare window has none to switch to
      facts: ["Gtk:ShortcutsWindow:section-name"]
    - group: normalized-read
      reason: a native set leaves the read value unchanged, so there is no change to observe (GtkPasswordEntry extra-menu reads its own wrapper menu, which stays the same object; GtkFileDialog initial-file reads back unchanged on a dialog that is not shown, GTK 4.22)
      facts: ["Gtk:PasswordEntry:extra-menu", "Gtk:FileDialog:initial-file"]
    - group: media-backend
      reason: GtkMediaStream and GtkMediaFile are abstract; gtk_media_file_new returns the media backend's private subclass (GtkNoMediaFile without GStreamer), which the backend's property tables do not name, so no test instance exists (no row)
      facts: ["Gtk:MediaStream:loop", "Gtk:MediaStream:muted", "Gtk:MediaStream:playing", "Gtk:MediaStream:volume", "Gtk:MediaFile:file", "Gtk:MediaFile:input-stream"]
    - group: layout-child
      reason: a layout child belongs to a layout manager and its child widget; on a bare GtkFixedLayoutChild (no manager) the set transform is dropped, and making a real one needs a GtkFixed with a child
      facts: ["Gtk:FixedLayoutChild:transform"]
    - group: print-backend
      reason: a print dialog or print job enumerates printers through the print backends (CUPS, file); the probe and the tests make no instance
      facts: ["Gtk:PrintJob:track-print-status", "Gtk:PrintUnixDialog:current-page", "Gtk:PrintUnixDialog:embed-page-setup", "Gtk:PrintUnixDialog:has-selection", "Gtk:PrintUnixDialog:manual-capabilities", "Gtk:PrintUnixDialog:page-setup", "Gtk:PrintUnixDialog:print-settings", "Gtk:PrintUnixDialog:support-selection"]
    - group: realize
      reason: the instance exists only once a widget or surface is realized (GL context, accessibility context, surface); the tests do not realize
      facts: ["Gdk:GLContext:allowed-apis", "Gdk:Surface:cursor", "Gtk:ATContext:accessible-role", "Gtk:ATContext:display"]
    - group: font-config
      reason: the families of a font map change when the font configuration changes (fonts installed or added); no headless trigger, and the abstract font map types have no bare instance
      facts: ["Pango:FontFamily:n-items", "Pango:FontMap:n-items"]
    - group: newer-gtk
      reason: GtkEnumList is not in GTK 4.22.4, the version the facts are made for (the probe found no type), so no row is generated
      facts: ["Gtk:EnumList:n-items"]
