class: NSWindow
element:
  tag: window
  lifetime: toplevel
  construct: window
  # initWithContentRect:{0,0,width,height} styleMask:mask backing:NSBackingStoreBuffered defer:NO,
  # then releasedWhenClosed = NO (the handle table owns the window) and center.
  window: {width: 480, height: 320, style_mask: [titled, closable, miniaturizable, resizable]}
  provenance: "NSWindow.h: -initWithContentRect:styleMask:backing:defer:; releasedWhenClosed defaults to YES for programmatic windows, which would free the window under our handle"
props:
  - name: title
    sample: "Counter"
    provenance: "NSWindow.title (NSString, copy)"
  - name: style-mask
    sample: [titled, closable]
    expect: 3
    provenance: "NSWindow.styleMask (NSWindowStyleMask options)"
  - name: opaque
    sample: false
    provenance: "NSWindow.opaque (BOOL, getter isOpaque)"
  - name: movable-by-window-background
    sample: true
    provenance: "NSWindow.movableByWindowBackground (BOOL)"
setters:
  - name: content-size
    selector: "setContentSize:"
    type: size
    sample: {width: 300, height: 200}
    provenance: "NSWindow.h: -setContentSize: (no contentSize property)"
signals:
  - name: window-should-close
    via: delegate
    selector: "windowShouldClose:"
    delivery: sync
    result: veto_bool
    provenance: "NSWindowDelegate.windowShouldClose: returns BOOL, YES = allow. JS stops the close with e.preventDefault() (result true), so the delegate answers NO; no decision = YES. A busy host (JS running) vetoes, like close-request on GTK/Qt (ABI v2.1)."
  - name: window-will-close
    via: delegate
    selector: "windowWillClose:"
    provenance: "NSWindowDelegate.windowWillClose: (also NSWindowWillCloseNotification). The backend reports the window SVL_GONE_CLOSED after this, listened or not."
slots:
  - name: content-view
    default: true
    cardinality: one
    ops:
      set: "setContentView:"
      get: contentView
      clear: empty_view
    provenance: "NSWindow.contentView (strong, nullable). The window retains its content view; replacing it releases the old one but does not destroy it while we hold a handle. Clearing installs a fresh NSView so the window keeps a valid content view."
methods:
  - name: make-key-and-order-front
    selector: "makeKeyAndOrderFront:"
    expect: {get: visible, value: true}
    provenance: "NSWindow.h; `sender` is nil. The renderer shows a window with it (TOPLEVELS open list)."
  - name: center
    selector: center
    provenance: "NSWindow.h"
  - name: order-out
    selector: "orderOut:"
    expect: {get: visible, value: false}
    provenance: "NSWindow.h; hides without closing"
  - name: perform-close
    selector: "performClose:"
    test: false
    provenance: "NSWindow.h: simulates the close button; asks windowShouldClose: first"
  - name: order-front
    selector: "orderFront:"
    expect: {get: visible, value: true}
    provenance: "NSWindow.h; shows the window in front of its level without making it key; `sender` is nil"
  - name: order-back
    selector: "orderBack:"
    expect: {get: visible, value: true}
    provenance: "NSWindow.h; shows the window behind the others of its level; `sender` is nil"
  - name: make-key-window
    selector: makeKeyWindow
    test: false
    provenance: "NSWindow.h: makes a visible window key (needs an active app on the runner)"
  - name: display
    selector: display
    provenance: "NSWindow.h: redraws the whole window now"
  - name: invalidate-shadow
    selector: invalidateShadow
    provenance: "NSWindow.h"
  - name: miniaturize
    selector: "miniaturize:"
    test: false
    provenance: "NSWindow.h: to the Dock (animated, asynchronous); `sender` is nil"
  - name: deminiaturize
    selector: "deminiaturize:"
    test: false
    provenance: "NSWindow.h; `sender` is nil"
  - name: zoom
    selector: "zoom:"
    test: false
    provenance: "NSWindow.h: toggles between the user and the standard frame; `sender` is nil"
  - name: toggle-full-screen
    selector: "toggleFullScreen:"
    test: false
    provenance: "NSWindow.h: enters or exits full screen (animated, a new Space); `sender` is nil"
  - name: select-next-key-view
    selector: "selectNextKeyView:"
    provenance: "NSWindow.h: moves the focus to the next key view; `sender` is nil"
  - name: select-previous-key-view
    selector: "selectPreviousKeyView:"
    provenance: "NSWindow.h; `sender` is nil"

# Dangerous members (docs/notes/dangerous-members.md): reachable from JS (KVC), but the backend owns what they change.
dangerous:
  properties:
    delegate:
      severity: owned-by-backend
      reason: >-
        create() installs the backend's WindowDelegate (crates/svelters-appkit/src/backend.rs:474-478); replacing it means
        windowShouldClose:/windowWillClose: never reach the backend, so a user-closed window is never reported gone, its
        subtree handles are never released and the vetoable close stops working.
      use_instead: The window-should-close (preventDefault vetoes) and window-will-close events.
      evidence: [crates/svelters-appkit/src/backend.rs:474-478]
    releasedWhenClosed:
      severity: crashes
      reason: >-
        create() forces it to NO (crates/svelters-appkit/src/backend.rs:465) because the handle table holds a strong reference
        to the window (backend.rs:469); YES makes AppKit release the window on close under that handle (over-release).
      use_instead: Nothing to set; the window lives as long as its element (unmount closes it).
      evidence: [crates/svelters-appkit/src/backend.rs:463-469]
