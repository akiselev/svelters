class: NSPathControl
element:
  tag: path-control
  lifetime: owned
  construct: new
  provenance: "NSPathControl.h: -init gives a standard-style path control with no URL; `url` takes an NSURL handle or a string (a path starting with / or ~ becomes a file URL, anything else goes through URLWithString:). An editable control sends its action after the user picked a path (no bind: yet: the renderer has no binding type for object-typed props)."
props:
  - name: path-style
    sample: pop-up
    provenance: "NSPathControl.pathStyle (NSPathStyle)"
  - name: editable
    sample: true
    provenance: "NSPathControl.editable (BOOL, getter isEditable, 10.10+)"
  - name: placeholder-string
    sample: "No folder"
    provenance: "NSPathControl.placeholderString (NSString, copy, 10.10+)"
