class: NSView
element:
  tag: view
  lifetime: owned
  construct: new
  provenance: "NSView.h: -init is -initWithFrame:NSZeroRect"
props:
  - name: hidden
    sample: true
    provenance: "NSView.hidden (BOOL, getter isHidden)"
  - name: alpha-value
    sample: 0.5
    provenance: "NSView.alphaValue (CGFloat)"
  - name: tool-tip
    sample: "tip"
    provenance: "NSView.toolTip (NSString, copy)"
  - name: frame
    sample: {x: 0, y: 0, width: 120, height: 40}
    provenance: "NSView.frame (NSRect); KVC boxes it as NSValue"
slots:
  - name: subviews
    default: true
    cardinality: many
    ops:
      append: "addSubview:"
      insert_relative: "addSubview:positioned:relativeTo:"
      list: subviews
      detach: ["removeFromSuperview"]
    provenance: "NSView.h: addSubview:, addSubview:positioned:relativeTo: (NSWindowBelow puts the view below `relativeTo`), removeFromSuperview; the superview retains its subviews"
  - name: menu
    cardinality: one
    child: menu
    declared_on: NSResponder
    ops:
      set: "setMenu:"
      get: menu
      clear: nil
    provenance: "NSResponder.menu (strong, nullable), above the ingested chain (ingest stops at NSResponder): a view's context menu, shown on a right click or control-click. On a pop-up-button the same property is the pop-up's item menu."
methods:
  - name: display
    selector: display
    provenance: "NSView.h: draws the view now if it needs display"
  - name: layout-subtree-if-needed
    selector: layoutSubtreeIfNeeded
    provenance: "NSView.h (Auto Layout): lays out the view and its subviews now"
  - name: invalidate-intrinsic-content-size
    selector: invalidateIntrinsicContentSize
    provenance: "NSView.h (Auto Layout)"
  - name: scroll-rect-to-visible
    selector: "scrollRectToVisible:"
    test: false
    provenance: "NSView.h: scrolls the enclosing scroll views so a rect ({x, y, width, height}) of the view is visible; returns whether it scrolled"
