properties:
  - name: page
    js_name: page
    echo_suppress: ["notify::page", switch-page]
    setup: 'let nb = h.obj(o).downcast::<gtk::Notebook>().unwrap(); for _ in 0..8 { nb.append_page(&gtk::Label::new(None), None::<&gtk::Widget>); }'
    sample: 7
    provenance: "GtkNotebook:page (Gtk 4 docs); needs pages, set up in the test"
  - name: show-tabs
    provenance: "GtkNotebook:show-tabs (Gtk 4 docs); P prop"
  - name: show-border
    provenance: "GtkNotebook:show-border (Gtk 4 docs); P prop"
  - name: tab-pos
    provenance: "GtkNotebook:tab-pos (Gtk 4 docs); P prop"
  - name: scrollable
    provenance: "GtkNotebook:scrollable (Gtk 4 docs); P prop"
signals:
  - name: switch-page
    js_event: switch-page
    handler_result: none
    sync_required: false
    trigger:
      setup: 'let nb = h.obj(o).downcast::<gtk::Notebook>().unwrap(); for _ in 0..3 { nb.append_page(&gtk::Label::new(None), None::<&gtk::Widget>); } nb.set_current_page(Some(0));'
      rust: 'let nb = o.downcast_ref::<gtk::Notebook>().unwrap(); while nb.n_pages() < 3 { nb.append_page(&gtk::Label::new(None), None::<&gtk::Widget>); } nb.set_current_page(Some(((i + 1) % 3) as u32));'
      values: [a, b, c]
    provenance: "GtkNotebook::switch-page, run-last, void (Gtk 4 docs)"
  - name: "notify::page"
    derived_from: {property: page}
    js_event: "notify::page"
    trigger:
      setup: 'let nb = h.obj(o).downcast::<gtk::Notebook>().unwrap(); for _ in 0..3 { nb.append_page(&gtk::Label::new(None), None::<&gtk::Widget>); } nb.set_current_page(Some(0));'
      rust: 'let nb = o.downcast_ref::<gtk::Notebook>().unwrap(); while nb.n_pages() < 3 { nb.append_page(&gtk::Label::new(None), None::<&gtk::Widget>); } nb.set_current_page(Some(((i + 1) % 3) as u32));'
      values: [a, b, c]
    params: []
    returns: {type: void}
    handler_result: none
    sync_required: false
    phase: first
    flags: [detailed]
    connection: {disconnect_on: [handle_drop, native_destroy]}
    provenance: "GObject::notify for GtkNotebook:page"
bindings:
  - name: page
    direction: two_way
    property: page
    type: {ref: i32, nullable: false}
    change: {signal: "notify::page", role: any_change, value: prop}
    write: {natively_normalizes: false}
    echo: {strategy: host_suppressed, compare_before_set: true, read_back: false, sync_signals_on_set: ["notify::page", switch-page]}
    lifetime: {on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect}
    provenance: "set_current_page emits switch-page and notify::page only on change (Gtk 4 docs)"
# GtkNotebook pages. Tab label text, menu label and the page flags are properties of the child's
# GtkNotebookPage (X3 child attributes). Reordering tabs by hand is the user's `reorderable` choice.
# Svelte: <notebook><label parent:tabLabel="One">x</label></notebook>
children:
  policy: pages
  default_slot: pages
  slots:
    - name: pages
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: many
      order: native_index
      default: {kind: none}
      on_remove: empty
      attrs:
        - name: tabLabel
          type: string
          default: ""
          samples: ["Tab one", "Tab two"]
          set: {native: "GtkNotebook::set_tab_label_text(GtkWidget*, const char*)", args: [child, value]}
          get: {native: "GtkNotebook::get_tab_label_text(GtkWidget*)", args: [child]}
          expect: 'pw.downcast_ref::<gtk::Notebook>().unwrap().tab_label_text(&w).as_deref() == Some("Tab one")'
          provenance: [{origin: gir, ref: "gtk_notebook_set_tab_label_text"}, {origin: runtime, ref: "the GtkNotebookPage:tab-label property only stores a string; it does not create the visible tab label (GTK 4.22)"}]
        - name: menuLabel
          type: string
          default: ""
          samples: ["Menu one", "Menu two"]
          set: {native: "GtkNotebook::set_menu_label_text(GtkWidget*, const char*)", args: [child, value]}
          get: {native: "GtkNotebook::get_menu_label_text(GtkWidget*)", args: [child]}
          provenance: [{origin: gir, ref: "gtk_notebook_set_menu_label_text"}]
        - name: reorderable
          type: bool
          default: false
          samples: [true, false]
          via: {native: "GtkNotebook::get_page(GtkWidget*)"}
          property: reorderable
          expect: 'pw.downcast_ref::<gtk::Notebook>().unwrap().tab_is_reorderable(&w)'
          provenance: [{origin: gir, ref: "GtkNotebookPage:reorderable"}, {origin: gir, ref: "gtk_notebook_get_tab_reorderable"}]
        - name: detachable
          type: bool
          default: false
          samples: [true, false]
          via: {native: "GtkNotebook::get_page(GtkWidget*)"}
          property: detachable
          expect: 'pw.downcast_ref::<gtk::Notebook>().unwrap().tab_is_detachable(&w)'
          provenance: [{origin: gir, ref: "GtkNotebookPage:detachable"}, {origin: gir, ref: "gtk_notebook_get_tab_detachable"}]
        - name: tabExpand
          type: bool
          default: false
          samples: [true, false]
          via: {native: "GtkNotebook::get_page(GtkWidget*)"}
          property: tab-expand
          provenance: [{origin: gir, ref: "GtkNotebookPage:tab-expand"}]
        - name: tabFill
          type: bool
          default: true
          samples: [false, true]
          via: {native: "GtkNotebook::get_page(GtkWidget*)"}
          property: tab-fill
          provenance: [{origin: gir, ref: "GtkNotebookPage:tab-fill"}]
      requires: []
      ops:
        get:      {contains: ancestor}
        index_of: {native: "GtkNotebook::page_num(GtkWidget*)"}
        insert:   {native: "GtkNotebook::insert_page(GtkWidget*, GtkWidget*, int)", args: [child, null, index_opt], effects: {child: parented}}
        remove:   {native: "GtkNotebook::remove_page(int)", args: [child_index_opt], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_notebook_insert_page"}, {origin: gir, ref: "gtk_notebook_remove_page"}]
