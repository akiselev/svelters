properties:
  - name: text
    provenance: "GtkInscription:text (Gtk 4 docs)"
  - name: min-lines
    provenance: "GtkInscription:min-lines (Gtk 4 docs)"
  - name: nat-chars
    provenance: "GtkInscription:nat-chars (Gtk 4 docs)"
methods:
  - name: set_markup
    dispatch: dynamic
    args: ["<b>svl</b>"]
    expect: 'h.get(o, "text") == V::Str("svl".into())'
    provenance: "gtk_inscription_set_markup (Gtk 4 docs); markup is write-only, it sets text (and attributes) from the parsed markup (AI1 review 2026-10-19, docs/notes/ai1-gtk-review.md)"
  - name: get_text
    js_name: get_text
    dispatch: dynamic
    args: []
    setup: 'h.set_str(o, "text", "ins").unwrap();'
    expect: 'r == V::Str("ins".into())'
    provenance: "gtk_inscription_get_text (Gtk 4 docs); called through GIRepository (X1)"
