children:
  policy: single_child
  default_slot: child
  slots:
    - name: child
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: one
      order: none
      default: {kind: none}
      on_remove: empty
      attrs: []
      requires: []
      ops:
        get:    {native: "GtkRevealer::get_child() const"}
        set:    {native: "GtkRevealer::set_child(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
        remove: {native: "GtkRevealer::set_child(GtkWidget*)", args: [null], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_revealer_set_child"}]
properties:
  - name: reveal-child
    provenance: "GtkRevealer:reveal-child (Gtk 4 docs); P prop"
  - name: transition-type
    provenance: "GtkRevealer:transition-type (Gtk 4 docs); P prop"
  - name: transition-duration
    provenance: "GtkRevealer:transition-duration (Gtk 4 docs); P prop"
