properties:
  - name: date
    provenance: "GtkCalendar:date, GDateTime (Gtk 4.14 docs); ABI v3 date value, round-trip test"
  - name: day
    sample: 15
    echo_suppress: ["notify::day", day-selected]
    provenance: "GtkCalendar:day (Gtk 4 docs)"
  - name: month
    sample: 5
    provenance: "GtkCalendar:month, 0-based (Gtk 4 docs)"
  - name: year
    sample: 2030
    provenance: "GtkCalendar:year (Gtk 4 docs)"
  - name: show-heading
    provenance: "GtkCalendar:show-heading (Gtk 4 docs)"
  - name: show-day-names
    provenance: "GtkCalendar:show-day-names (Gtk 4 docs)"
  - name: show-week-numbers
    provenance: "GtkCalendar:show-week-numbers (Gtk 4 docs)"
signals:
  - name: next-month
    js_event: next-month
    handler_result: none
    sync_required: false
    trigger: {rust: 'o.emit_by_name::<()>("next-month", &[]);', values: [a, b, c]}
    provenance: "GtkCalendar::next-month, run-first, action signal (Gtk 4 docs)"
  - name: next-year
    js_event: next-year
    handler_result: none
    sync_required: false
    trigger: {rust: 'o.emit_by_name::<()>("next-year", &[]);', values: [a, b, c]}
    provenance: "GtkCalendar::next-year, run-first, action signal (Gtk 4 docs)"
  - name: prev-month
    js_event: prev-month
    handler_result: none
    sync_required: false
    trigger: {rust: 'o.emit_by_name::<()>("prev-month", &[]);', values: [a, b, c]}
    provenance: "GtkCalendar::prev-month, run-first, action signal (Gtk 4 docs)"
  - name: prev-year
    js_event: prev-year
    handler_result: none
    sync_required: false
    trigger: {rust: 'o.emit_by_name::<()>("prev-year", &[]);', values: [a, b, c]}
    provenance: "GtkCalendar::prev-year, run-first, action signal (Gtk 4 docs)"
  - name: day-selected
    handler_result: none
    sync_required: false
    trigger: {property: day, values: [10, 11, 12]}
    provenance: "GtkCalendar::day-selected (Gtk 4 docs)"
  - name: "notify::day"
    derived_from: {property: day}
    js_event: "notify::day"
    trigger: {property: day, values: [10, 11, 12]}
    params: []
    returns: {type: void}
    handler_result: none
    sync_required: false
    phase: first
    flags: [detailed]
    connection: {disconnect_on: [handle_drop, native_destroy]}
    provenance: "GObject::notify for GtkCalendar:day"
bindings:
  - name: day
    direction: two_way
    property: day
    type: {ref: i32, nullable: false}
    change: {signal: "notify::day", role: any_change, value: prop}
    write: {natively_normalizes: false}
    echo: {strategy: host_suppressed, compare_before_set: true, read_back: false, sync_signals_on_set: ["notify::day", day-selected]}
    lifetime: {on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect}
    provenance: "gtk_calendar_set_day notifies day (Gtk 4 docs)"
methods:
  - name: select_day
    js_name: selectDay
    dispatch: dynamic
    args: [1905508800000]
    expect: 'h.get(o, "day") == V::I64(20)'
    provenance: "gtk_calendar_select_day (Gtk 4 docs)"
  - name: mark_day
    js_name: markDay
    dispatch: dynamic
    args: [5]
    expect: 'r == V::Null'
    provenance: "gtk_calendar_mark_day (Gtk 4 docs)"
  - name: clear_marks
    js_name: clearMarks
    dispatch: dynamic
    args: []
    expect: 'r == V::Null'
    provenance: "gtk_calendar_clear_marks (Gtk 4 docs)"
