properties:
  - name: selection-mode
    provenance: "GtkListBox:selection-mode (Gtk 4 docs); P prop"
  - name: show-separators
    provenance: "GtkListBox:show-separators (Gtk 4 docs); P prop"
  - name: activate-on-single-click
    provenance: "GtkListBox:activate-on-single-click (Gtk 4 docs); P prop"
signals:
  - name: row-activated
    js_event: row-activated
    handler_result: none
    sync_required: false
    trigger:
      setup: 'let lb = h.obj(o).downcast::<gtk::ListBox>().unwrap(); lb.append(&gtk::Label::new(None));'
      rust: 'o.downcast_ref::<gtk::ListBox>().unwrap().row_at_index(0).unwrap().emit_by_name::<()>("activate", &[]);'
      values: [a, b, c]
    provenance: "GtkListBox::row-activated, run-last, void; emitted by activating the row (Gtk 4 docs)"
  - name: row-selected
    js_event: row-selected
    handler_result: none
    sync_required: false
    trigger:
      setup: 'let lb = h.obj(o).downcast::<gtk::ListBox>().unwrap(); lb.append(&gtk::Label::new(None)); lb.append(&gtk::Label::new(None));'
      rust: 'let lb = o.downcast_ref::<gtk::ListBox>().unwrap(); lb.select_row(lb.row_at_index((i % 2) as i32).as_ref());'
      values: [a, b, c]
    provenance: "GtkListBox::row-selected, run-first, void (Gtk 4 docs)"
children:
  policy: ordered
  default_slot: children
  slots:
    - name: children
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: many
      order: native_index
      default: {kind: none}
      on_remove: empty
      # G8 (X8): GtkListBox sort/filter/header funcs are not exposed. JS sorts and filters (render the rows in the
      # order and subset you want, keyed) and decides which rows start a group: that row gets `parent:header`, the
      # text of its section header (the row's own header widget, a heading label). `null` or "" removes it.
      attrs:
        - name: header
          type: string
          default: ""
          samples: ["Fruit", "Vegetables"]
          set:
            class: ListBox
            expr: 'crate::util::set_row_header(p, child, v.as_str()?)?;'
          get:
            class: ListBox
            expr: 'crate::util::row_header(child)'
          expect: 'w.ancestor(gtk::ListBoxRow::static_type()).and_downcast::<gtk::ListBoxRow>().unwrap().header().is_some()'
          provenance: [{origin: gir, ref: "gtk_list_box_row_set_header"}, {origin: gir, ref: "gtk_list_box_row_get_header"}, {origin: manual, ref: "X8: header_func replaced by an attribute the app sets on the first row of each group"}]
      requires: []
      ops:
        get:    {contains: ancestor}
        insert: {native: "GtkListBox::insert(GtkWidget*, int)", args: [child, index], effects: {child: "wrapped:ListBoxRow"}}
        # remove() wants the GtkListBoxRow the list box wrapped the child in; the row is destroyed with it.
        remove: {native: "GtkListBox::remove(GtkWidget*)", args: [wrapper], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_list_box_insert"}, {origin: gir, ref: "gtk_list_box_remove"}, {origin: manual, ref: "non-row children are wrapped in a GtkListBoxRow (Gtk 4 docs)"}]
