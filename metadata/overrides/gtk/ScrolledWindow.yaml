children:
  policy: single_child
  default_slot: child
  slots:
    - name: child
      cardinality: one
      accepts: [Gtk.Widget]
      ops:
        set: {property: child}
        clear: {property: child, value: null}
      readback: {mode: property, property: child}
      ownership: parent_owned
      attached_props: []
      provenance: "gtk_scrolled_window_set_child docs: non-scrollable children are wrapped in a GtkViewport automatically"
