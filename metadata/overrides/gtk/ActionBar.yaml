        get:    {contains: ancestor}
        insert: {native: "GtkActionBar::pack_end(GtkWidget*)", args: [child], effects: {child: parented}}
        remove: {native: "GtkActionBar::remove(GtkWidget*)", args: [child], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_action_bar_pack_end"}, {origin: gir, ref: "gtk_action_bar_remove"}]
    - name: center
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: one
      order: none
      default: {kind: none}
      on_remove: empty
      attrs: []
      requires: []
      ops:
        get:    {native: "GtkActionBar::get_center_widget() const"}
        set:    {native: "GtkActionBar::set_center_widget(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
