    echo_suppress: [value-changed, "notify::value"]
    provenance: "GtkSpinButton:value (Gtk 4 docs); needs a non-empty adjustment range"
  - name: digits
    provenance: "GtkSpinButton:digits, 0..20 (Gtk 4 docs)"
  - name: numeric
