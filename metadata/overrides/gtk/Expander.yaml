children:
  policy: named_slots
  default_slot: child
  slots:
    - name: child
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: one
      order: none
      default: {kind: none}
      on_remove: empty
      attrs: []
      requires: []
      ops:
        get:    {native: "GtkExpander::get_child() const"}
        set:    {native: "GtkExpander::set_child(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
        remove: {native: "GtkExpander::set_child(GtkWidget*)", args: [null], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_expander_set_child"}]
    - name: label
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: one
      order: none
      default: {kind: builtin, restore: null, conflicts_with_props: [label]}
      on_remove: restore_default
      attrs: []
      requires: []
      ops:
        get:    {native: "GtkExpander::get_label_widget() const"}
        set:    {native: "GtkExpander::set_label_widget(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
        remove: {native: "GtkExpander::set_label_widget(GtkWidget*)", args: [null], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_expander_set_label_widget"}]
properties:
  - name: expanded
    echo_suppress: ["notify::expanded"]
    provenance: "GtkExpander:expanded (Gtk 4 docs); P prop"
  - name: label
    provenance: "GtkExpander:label (Gtk 4 docs); P prop"
  - name: use-markup
    provenance: "GtkExpander:use-markup (Gtk 4 docs); P prop"
  - name: use-underline
    provenance: "GtkExpander:use-underline (Gtk 4 docs); P prop"
  - name: resize-toplevel
    provenance: "GtkExpander:resize-toplevel (Gtk 4 docs); P prop"
signals:
  - name: activate
    js_event: activate
    handler_result: none
    sync_required: false
    provenance: "GtkExpander::activate is an action signal with void return (Gtk 4 docs)"
  - name: "notify::expanded"
    derived_from: {property: expanded}
    js_event: "notify::expanded"
    trigger: {property: expanded, values: [true, false, true]}
    params: []
    returns: {type: void}
    handler_result: none
    sync_required: false
    phase: first
    flags: [detailed]
    connection: {disconnect_on: [handle_drop, native_destroy]}
    provenance: "GObject::notify for GtkExpander:expanded"
bindings:
  - name: expanded
    direction: two_way
    property: expanded
    type: {ref: bool, nullable: false}
    change: {signal: "notify::expanded", role: any_change, value: prop}
    write: {natively_normalizes: false}
    echo: {strategy: host_suppressed, compare_before_set: true, read_back: false, sync_signals_on_set: ["notify::expanded"]}
    lifetime: {on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect}
    provenance: "set_expanded notifies expanded only on change (Gtk 4 docs)"
