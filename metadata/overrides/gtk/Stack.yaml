  - name: transition-type
    provenance: "GtkStack:transition-type (Gtk 4 docs); P prop"
  - name: hhomogeneous
    provenance: "GtkStack:hhomogeneous (Gtk 4 docs); P prop"
  - name: vhomogeneous
    provenance: "GtkStack:vhomogeneous (Gtk 4 docs); P prop"
  - name: transition-duration
