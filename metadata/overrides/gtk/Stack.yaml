# GtkStack pages. Name, title and the page flags are properties of the child's GtkStackPage (X3).
# Svelte: <stack><label parent:name="a" parent:title="First">x</label></stack>
children:
  policy: pages
  default_slot: pages
  slots:
    - name: pages
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: many
      order: append_only
      default: {kind: none}
      on_remove: empty
      attrs:
        - name: name
          type: string
          default: null
          samples: ["first", "second"]
          via: {native: "GtkStack::get_page(GtkWidget*)"}
          property: name
          expect: 'pw.downcast_ref::<gtk::Stack>().unwrap().child_by_name("first").as_ref() == Some(&w)'
          provenance: [{origin: gir, ref: "GtkStackPage:name"}, {origin: gir, ref: "gtk_stack_get_child_by_name"}]
        - name: title
          type: string
          default: null
          samples: ["First page", "Second page"]
          via: {native: "GtkStack::get_page(GtkWidget*)"}
          property: title
          provenance: [{origin: gir, ref: "GtkStackPage:title"}]
        - name: icon-name
          type: string
          default: null
          samples: ["document-new", "edit-copy"]
          via: {native: "GtkStack::get_page(GtkWidget*)"}
          property: icon-name
          provenance: [{origin: gir, ref: "GtkStackPage:icon-name"}]
        - name: needs-attention
          type: bool
          default: false
          samples: [true, false]
          via: {native: "GtkStack::get_page(GtkWidget*)"}
          property: needs-attention
          provenance: [{origin: gir, ref: "GtkStackPage:needs-attention"}]
        - name: use-underline
          type: bool
          default: false
          samples: [true, false]
          via: {native: "GtkStack::get_page(GtkWidget*)"}
          property: use-underline
          provenance: [{origin: gir, ref: "GtkStackPage:use-underline"}]
      requires: []
      ops:
        get:    {contains: parent}
        insert: {native: "GtkStack::add_child(GtkWidget*)", args: [child], effects: {child: parented}}
        remove: {native: "GtkStack::remove(GtkWidget*)", args: [child], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_stack_add_child"}, {origin: gir, ref: "gtk_stack_remove"}]
