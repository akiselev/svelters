children:
  policy: single_child
  default_slot: child
  slots:
    - name: child
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: one
      order: none
      default: {kind: none}
      on_remove: empty
      attrs: []
      requires: []
      ops:
        get:    {native: "GtkAspectFrame::get_child() const"}
        set:    {native: "GtkAspectFrame::set_child(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
        remove: {native: "GtkAspectFrame::set_child(GtkWidget*)", args: [null], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_aspect_frame_set_child"}]
properties:
  - name: ratio
    provenance: "GtkAspectFrame:ratio (Gtk 4 docs); P prop"
  - name: obey-child
    provenance: "GtkAspectFrame:obey-child (Gtk 4 docs); P prop"
  - name: xalign
    provenance: "GtkAspectFrame:xalign (Gtk 4 docs); P prop"
  - name: yalign
    provenance: "GtkAspectFrame:yalign (Gtk 4 docs); P prop"
