properties:
  - name: row-spacing
    provenance: "GtkGrid:row-spacing (Gtk 4 docs); P prop"
  - name: column-spacing
    provenance: "GtkGrid:column-spacing (Gtk 4 docs); P prop"
  - name: row-homogeneous
    provenance: "GtkGrid:row-homogeneous (Gtk 4 docs); P prop"
  - name: column-homogeneous
    provenance: "GtkGrid:column-homogeneous (Gtk 4 docs); P prop"
# GtkGrid: children are placed by per-child attributes (X3, ABI v2.2 `set_child_attr`). The attributes
# live on the GtkGridLayoutChild of the child, so moving a child is a property write: no re-attach.
# Svelte: <grid><label parent:column={1} parent:row={2} parent:columnSpan={2}>x</label></grid>
children:
  policy: layout_managed
  default_slot: cells
  slots:
    - name: cells
      content: widget
      accepts: [Gtk.Widget]
      route_by_kind: false
      cardinality: many
      order: unordered
      default: {kind: none}
      on_remove: empty
      attrs:
        - name: column
          type: i32
          default: 0
          samples: [2, 5]
          via: layout_child
          property: column
          expect: 'pw.downcast_ref::<gtk::Grid>().unwrap().query_child(&w).0 == 2'
          provenance: [{origin: gir, ref: "GtkGridLayoutChild:column"}, {origin: gir, ref: "gtk_grid_query_child"}]
        - name: row
          type: i32
          default: 0
          samples: [3, 1]
          via: layout_child
          property: row
          expect: 'pw.downcast_ref::<gtk::Grid>().unwrap().query_child(&w).1 == 3'
          provenance: [{origin: gir, ref: "GtkGridLayoutChild:row"}, {origin: gir, ref: "gtk_grid_query_child"}]
        - name: columnSpan
          type: i32
          default: 1
          samples: [2, 3]
          via: layout_child
          property: column-span
          expect: 'pw.downcast_ref::<gtk::Grid>().unwrap().query_child(&w).2 == 2'
          provenance: [{origin: gir, ref: "GtkGridLayoutChild:column-span"}, {origin: gir, ref: "gtk_grid_query_child"}]
        - name: rowSpan
          type: i32
          default: 1
          samples: [2, 4]
          via: layout_child
          property: row-span
          expect: 'pw.downcast_ref::<gtk::Grid>().unwrap().query_child(&w).3 == 2'
          provenance: [{origin: gir, ref: "GtkGridLayoutChild:row-span"}, {origin: gir, ref: "gtk_grid_query_child"}]
      requires: []
      ops:
        get:    {contains: parent}
        insert: {native: "GtkGrid::attach(GtkWidget*, int, int, int, int)", args: [child, "const:0", "const:0", "const:1", "const:1"], effects: {child: parented}}
        remove: {native: "GtkGrid::remove(GtkWidget*)", args: [child], effects: {child: unparented}}
      verify: {}
      provenance: [{origin: gir, ref: "gtk_grid_attach"}, {origin: gir, ref: "gtk_grid_remove"}]
