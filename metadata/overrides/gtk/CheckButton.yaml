properties:
  - name: active
    echo_suppress: [toggled, "notify::active"]
    provenance: "GtkCheckButton:active (Gtk 4 docs)"
  - name: inconsistent
    provenance: "GtkCheckButton:inconsistent (Gtk 4 docs)"
  - name: label
    provenance: "GtkCheckButton:label (Gtk 4 docs)"
  - name: use-underline
    provenance: "GtkCheckButton:use-underline (Gtk 4 docs)"
signals:
  - name: toggled
    js_event: toggled
    handler_result: none
    sync_required: false
    trigger: {property: active, values: [true, false, true]}
    provenance: "GtkCheckButton::toggled, run-first, void (Gtk 4 docs)"
  - name: "notify::active"
    derived_from: {property: active}
    js_event: "notify::active"
    trigger: {property: active, values: [true, false, true]}
    params: []
    returns: {type: void}
    handler_result: none
    sync_required: false
    phase: first
    flags: [detailed]
    connection: {disconnect_on: [handle_drop, native_destroy]}
    provenance: "GObject::notify for GtkCheckButton:active"
bindings:
  - name: active
    direction: two_way
    property: active
    type: {ref: bool, nullable: false}
    change: {signal: toggled, role: any_change, value: prop}
    write: {natively_normalizes: false}
    echo: {strategy: host_suppressed, compare_before_set: true, read_back: false, sync_signals_on_set: [toggled, "notify::active"]}
    lifetime: {on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect}
    provenance: "GtkCheckButton set_active emits toggled and notify::active only on change (Gtk 4 docs)"
methods:
  - name: set_inconsistent
    js_name: set_inconsistent
    dispatch: dynamic
    args: [true]
    expect: 'h.get(o, "inconsistent") == V::Bool(true)'
    provenance: "gtk_check_button_set_inconsistent (Gtk 4 docs); called through GIRepository (X1)"
  - name: get_label
    js_name: get_label
    dispatch: dynamic
    setup: 'h.set_str(o, "label", "hello").unwrap();'
    args: []
    expect: 'r == V::Str("hello".into())'
    provenance: "gtk_check_button_get_label (Gtk 4 docs); string return through GIRepository (X1)"
