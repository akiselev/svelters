    js_event: value-changed
    handler_result: none
    sync_required: false
    trigger: {rust: 'let sb = o.downcast_ref::<gtk::ScaleButton>().unwrap(); sb.set_adjustment(&gtk::Adjustment::new(0.0, 0.0, 100.0, 1.0, 10.0, 0.0)); sb.set_value(10.0 + i as f64);', values: [a, b, c]}
    provenance: "GtkScaleButton::value-changed, run-last, void (Gtk 4 docs)"
