    provenance: "GtkScaleButton:has-frame (Gtk 4 docs)"
  - name: value
    sample: 42.5
    setup: 'h.widget(o).downcast_ref::<gtk::ScaleButton>().unwrap().set_adjustment(&gtk::Adjustment::new(0.0, 0.0, 100.0, 1.0, 10.0, 0.0));'
