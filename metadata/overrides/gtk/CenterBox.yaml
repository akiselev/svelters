      attrs: []
      requires: []
      ops:
        get:    {native: "GtkCenterBox::get_start_widget() const"}
        set:    {native: "GtkCenterBox::set_start_widget(GtkWidget*)", args: [child], effects: {child: parented, old: unparented}}
