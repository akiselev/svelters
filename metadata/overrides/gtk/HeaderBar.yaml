children:
  policy: named_slots
  default_slot: start
  slots:
    - name: start
      cardinality: many
      accepts: [Gtk.Widget]
      ops:
        insert: {method: pack_start, args: [child]}
        remove: {method: remove, args: [child]}
      readback: {mode: ancestor}
      order: append_only
      ownership: parent_owned
      attached_props: []
      provenance: "gtk_header_bar_pack_start / gtk_header_bar_remove docs; children live in an internal box"
    - name: end
      cardinality: many
      accepts: [Gtk.Widget]
      ops:
        insert: {method: pack_end, args: [child]}
        remove: {method: remove, args: [child]}
      readback: {mode: ancestor}
      order: append_only
      ownership: parent_owned
      attached_props: []
      provenance: "gtk_header_bar_pack_end / gtk_header_bar_remove docs"
    - name: title
      cardinality: one
      accepts: [Gtk.Widget]
      ops:
        set: {property: title-widget}
        clear: {property: title-widget, value: null}
      readback: {mode: property, property: title-widget}
      ownership: parent_owned
      attached_props: []
      provenance: "GtkHeaderBar:title-widget property (Gtk 4 docs)"
