# Items are actions, separators and menus held by the `items` slot (QWidget::insertAction/removeAction, glue in
# menus.hpp.in; see QMenu.yaml): a menu item becomes a tool button that opens the menu.
# Place it in a vertical box like any widget (QMainWindow::addToolBar areas are gap G1); the element is a plain
# QToolBar there.
elements:
  - tag: tool-bar
    construct: { class: QToolBar }
    props:
      - { js: movable, native: movable, provenance: "QToolBar::movable (qdoc)" }
      - { js: floatable, native: floatable, provenance: "QToolBar::floatable (qdoc)" }
      - { js: orientation, native: orientation, provenance: "QToolBar::orientation (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: tool-button-style, native: toolButtonStyle, provenance: "QToolBar::toolButtonStyle (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: icon-size, native: iconSize, provenance: "QToolBar::iconSize (qdoc); typed by the S1 value model (ABI v3)" }
    signals:
      - js: movable-changed
        native: movableChanged
        connect: "movableChanged(bool)"
        args: [{ name: movable, type: bool }]
        trigger: '$w->setMovable(!$w->isMovable())'
        expect_args: ["false"]
        provenance: "QToolBar::movableChanged(bool) (qdoc)"
      - js: orientation-changed
        native: orientationChanged
        connect: "orientationChanged(Qt::Orientation)"
        args: [{ name: orientation, type: "enum<Qt::Orientation>" }]
        trigger: '$w->setOrientation(($i % 2) == 0 ? Qt::Vertical : Qt::Horizontal)'
        provenance: "QToolBar::orientationChanged(Qt::Orientation) (qdoc)"
    methods:
      - { js: clear, native: clear, provenance: "QToolBar::clear() (qdoc)" }
    children:
      policy: ordered
      default_slot: items
      slots:
        - name: items
          content: widget
          accepts: [QAction, QMenu]
          cardinality: many
          order: actions
          host: self
          default: { kind: none }
          on_remove: empty
          ops: {}
          provenance: "QWidget::insertAction/removeAction (qdoc); a QMenu item is its menuAction(); X4"
