# Element `window`. Slot annotations follow docs/notes/signals-and-slots-semantics.md section 2.5
# (op descriptors with `native`/`args`/`effects`). Every effect becomes a generated test.
# Child policy follows uic's QMainWindow mapping; ownership is cross-checked against the PySide
# typesystem replace_child entries and the probes in docs/notes/scripts/qt_slot_ownership_probe.py.
elements:
  - tag: window
    construct: { class: QMainWindow }
    props:
      - { js: title, native: windowTitle, provenance: "QWidget::windowTitle Q_PROPERTY (qdoc); P prop" }
      - { js: documentMode, native: documentMode, provenance: "QMainWindow::documentMode (qdoc)" }
      - { js: animated, native: animated, provenance: "QMainWindow::animated (qdoc)" }
      - { js: dockNestingEnabled, native: dockNestingEnabled, provenance: "QMainWindow::dockNestingEnabled (qdoc)" }
      - { js: tabShape, native: tabShape, provenance: "QMainWindow::tabShape (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: toolButtonStyle, native: toolButtonStyle, provenance: "QMainWindow::toolButtonStyle (qdoc); enum typed by the S1 value model (ABI v3)" }
    methods:
      - { js: show, native: show, provenance: "QWidget::show() slot (qdoc)" }
      - { js: present, native: show, provenance: "GTK name for show(); P host op call present" }
      - { js: close, native: close, provenance: "QWidget::close() slot (qdoc); non-blocking" }
      - { js: resize, native: resize, params: [i32, i32], provenance: "QWidget::resize(int, int) (qdoc)" }
    signals:
      # Synthetic: the backend vetoes a native close while this is listened to and posts the
      # event (React Native's onRequestClose). Without a listener the window is destroyed and
      # reported as closed.
      - { js: close-request, synthetic: close_request, provenance: "ABI v2 window close (plans/architecture/backend-abi.md); QCloseEvent via event filter" }
    children:
      policy: named_slots
      default_slot: central
      slots:
        - name: central
          content: widget
          accepts: [QWidget]
          cardinality: one
          host: self
          default: { kind: none }
          on_remove: empty
          ops:
            get: { native: "QMainWindow::centralWidget() const" }
            set:
              native: "QMainWindow::setCentralWidget(QWidget*)"
              args: [child]
              effects: { child: parented, old: deleted }     # probe: the old widget is deleted
            remove:                                           # NOT setCentralWidget(nullptr): that deletes
              native: "QMainWindow::takeCentralWidget()"
              effects: { child: unparented }
          provenance: [{ origin: uic, ref: "WriteInitialization::acceptWidget" }, { origin: typesystem, ref: replace_child }, { origin: probe, ref: qt_slot_ownership_probe.py }]
        - name: menubar
          content: widget
          accepts: [QMenuBar]
          route_by_kind: true
          cardinality: one
          host: self
          default: { kind: lazy, restore: restore }
          on_remove: destroys_child
          ops:
            get: { native: "QMainWindow::menuWidget() const" }   # menuBar() would create one
            set:
              native: "QMainWindow::setMenuBar(QMenuBar*)"
              args: [child]
              effects: { child: parented, old: deleted }
            remove:
              native: "QMainWindow::setMenuBar(QMenuBar*)"
              args: [null]
              effects: { child: deleted }
          provenance: [{ origin: typesystem, ref: replace_child }, { origin: probe, ref: qt_slot_ownership_probe.py }]
        - name: statusbar
          content: widget
          accepts: [QStatusBar]
          route_by_kind: true
          cardinality: one
          host: self
          default: { kind: lazy }
          on_remove: destroys_child
          ops:
            get:                                                 # statusBar() would create one
              native: "QMainWindow::findChild<QStatusBar*>(Qt::FindChildOptions) const"
              args: ["const:Qt::FindDirectChildrenOnly"]
            set:
              native: "QMainWindow::setStatusBar(QStatusBar*)"
              args: [child]
              effects: { child: parented, old: deleted }
            remove:
              native: "QMainWindow::setStatusBar(QStatusBar*)"
              args: [null]
              effects: { child: deleted }
          provenance: [{ origin: typesystem, ref: replace_child }, { origin: probe, ref: qt_slot_ownership_probe.py }]
        # Toolbars and dock widgets (X7). QMainWindow has no indexOf/count for them, so the slots are
        # append-only (membership by isAncestorOf, A1-GAPS G13) and the placement is a child attribute
        # (X3): `<toolbar parent:area="left" parent:breakBefore={true}>`, `<dockwidget parent:area="right">`.
        # removeToolBar / removeDockWidget hide the widget and keep it parented, so remove also unparents it.
        - name: toolbars
          content: widget
          accepts: [QToolBar]
          route_by_kind: true
          cardinality: many
          order: append_only
          host: self
          default: { kind: none }
          on_remove: empty
          attrs:
            - name: area
              type: enum
              values:
                top: "Qt::TopToolBarArea"
                left: "Qt::LeftToolBarArea"
                right: "Qt::RightToolBarArea"
                bottom: "Qt::BottomToolBarArea"
              default: top
              samples: [left, bottom]
              set: { native: "QMainWindow::addToolBar(Qt::ToolBarArea, QToolBar*)", args: [value, child] }
              get: { native: "QMainWindow::toolBarArea(QToolBar*) const", args: [child] }
              expect: "$p->toolBarArea(static_cast<QToolBar *>($w)) == Qt::LeftToolBarArea"
              provenance: "QMainWindow::addToolBar(Qt::ToolBarArea, QToolBar*) moves a toolbar the window already manages; toolBarArea(QToolBar*) (qdoc); X3 child attribute"
            - name: breakBefore
              type: bool
              default: false
              samples: [true, false]
              set: { expr: "if ($v) $h->insertToolBarBreak($c); else $h->removeToolBarBreak($c)", args: [] }
              get: { native: "QMainWindow::toolBarBreak(QToolBar*) const", args: [child] }
              setup: "pw->insertToolBar(static_cast<QToolBar *>(w), new QToolBar(pw));"   # a break needs a toolbar before it
              expect: "$p->toolBarBreak(static_cast<QToolBar *>($w))"
              provenance: "QMainWindow::insertToolBarBreak / removeToolBarBreak / toolBarBreak (qdoc); X3 child attribute"
          ops:
            insert:
              native: "QMainWindow::addToolBar(QToolBar*)"
              args: [child]
              effects: { child: parented }
            remove:
              native: "QMainWindow::removeToolBar(QToolBar*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
          provenance: [{ origin: qdoc, ref: "QMainWindow::addToolBar, removeToolBar: the toolbar is hidden, not deleted" }, { origin: typesystem, ref: addownership-1 }]
        - name: docks
          content: widget
          accepts: [QDockWidget]
          route_by_kind: true
          cardinality: many
          order: append_only
          host: self
          default: { kind: none }
          on_remove: empty
          attrs:
            - name: area
              type: enum
              values:
                left: "Qt::LeftDockWidgetArea"
                right: "Qt::RightDockWidgetArea"
                top: "Qt::TopDockWidgetArea"
                bottom: "Qt::BottomDockWidgetArea"
              default: left
              samples: [right, bottom]
              set: { native: "QMainWindow::addDockWidget(Qt::DockWidgetArea, QDockWidget*)", args: [value, child] }
              get: { native: "QMainWindow::dockWidgetArea(QDockWidget*) const", args: [child] }
              expect: "$p->dockWidgetArea(static_cast<QDockWidget *>($w)) == Qt::RightDockWidgetArea"
              provenance: "QMainWindow::addDockWidget(Qt::DockWidgetArea, QDockWidget*) moves a dock widget the window already manages; dockWidgetArea(QDockWidget*) (qdoc); X3 child attribute"
          ops:
            insert:
              native: "QMainWindow::addDockWidget(Qt::DockWidgetArea, QDockWidget*)"
              args: ["const:Qt::LeftDockWidgetArea", child]
              effects: { child: parented }
            remove:
              native: "QMainWindow::removeDockWidget(QDockWidget*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
          provenance: [{ origin: qdoc, ref: "QMainWindow::addDockWidget, removeDockWidget: the dock widget is hidden, not deleted" }]
