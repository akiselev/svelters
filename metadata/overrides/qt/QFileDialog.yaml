elements:
  - tag: file-dialog
    construct: { class: QFileDialog }
    props:
      - { js: file-mode, native: fileMode, provenance: "QFileDialog::fileMode (qdoc); enum by name (ABI v3)" }
      - { js: accept-mode, native: acceptMode, provenance: "QFileDialog::acceptMode (qdoc); enum by name (ABI v3)" }
      - { js: view-mode, native: viewMode, provenance: "QFileDialog::viewMode (qdoc); enum by name (ABI v3)" }
      - { js: default-suffix, native: defaultSuffix, provenance: "QFileDialog::defaultSuffix (qdoc)" }
    signals:
      # QFileDialog::accept() only accepts with a usable selection: AnyFile mode and a new file name.
      - { js: accepted, native: accepted, connect: "accepted()", args: [], trigger: '$w->setFileMode(QFileDialog::AnyFile); $w->selectFile(QStringLiteral("/tmp/svl-dialog-new-file")); static_cast<QDialog*>($w)->accept()', expect_args: [], provenance: "QDialog::accepted() (qdoc); QFileDialog::accept needs a selection" }
    methods:
      - { js: setDirectory, native: setDirectory, params: [string], provenance: "QFileDialog::setDirectory(const QString &) (qdoc)" }
