elements:
  - tag: entry
    construct: { class: QLineEdit }
    props:
      - { js: text, native: text, suppress_signals: true }
      - { js: placeholder, native: placeholderText }
      - { js: echoMode, native: echoMode }
      - { js: alignment, native: alignment }
      - { js: maxLength, native: maxLength }
    bindings:
      # Binding metadata (schema extension `bindings`, docs/notes/fork-bindings.md section 6).
      - name: text
        direction: two_way
        property: text
        type: { ref: string, nullable: false }
        change: { signal: changed, role: any_change }
        write: { natively_normalizes: false }    # a validator or inputMask would make this true
        echo:
          strategy: host_suppressed              # `suppress_signals` on the text prop: a per-handle flag, never QSignalBlocker
          compare_before_set: true               # an unchanged setText does not emit textChanged (probe)
          read_back: false
          sync_signals_on_set: ["textChanged(QString)"]
        lifetime: { on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect }
        provenance: "docs/notes/signals-and-slots-semantics.md 1.6 (qt_sync_probe.py: textEdited never fires for setText, textChanged does)"
    signals:
      # Synthetic (an event filter, not a Qt signal): a sync signal. The handler's result decides
      # whether the key press is consumed (`e.preventDefault()`), before the line edit sees it.
      - { js: key-press, synthetic: key_press }
      - js: changed
        native: textChanged
        connect: "textChanged(QString)"
        args: [{ name: text, type: string }]
        trigger: '$w->setText(QStringLiteral("v") + QString::number($i))'
        expect_args: ["v0"]
