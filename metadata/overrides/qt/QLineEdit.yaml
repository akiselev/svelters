elements:
  - tag: entry
    construct: { class: QLineEdit }
    props:
      - { js: text, native: text, suppress_signals: true, provenance: "QLineEdit::text Q_PROPERTY (qdoc); P prop; setText emits textChanged (qt_sync_probe.py)" }
      - { js: placeholder, native: placeholderText, provenance: "QLineEdit::placeholderText Q_PROPERTY (qdoc); P prop" }
      - { js: echoMode, native: echoMode, provenance: "QLineEdit::echoMode (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: alignment, native: alignment, provenance: "QLineEdit::alignment (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maxLength, native: maxLength, provenance: "QLineEdit::maxLength (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: readOnly, native: readOnly, provenance: "QLineEdit::readOnly (qdoc)" }
      - { js: clearButtonEnabled, native: clearButtonEnabled, provenance: "QLineEdit::clearButtonEnabled (qdoc)" }
      - { js: frame, native: frame, provenance: "QLineEdit::frame (qdoc)" }
      - { js: inputMask, native: inputMask, sample: "AAA", provenance: "QLineEdit::inputMask (qdoc)" }
      - { js: dragEnabled, native: dragEnabled, provenance: "QLineEdit::dragEnabled (qdoc)" }
      - { js: cursorPosition, native: cursorPosition, sample: 3, setup: '$w->setText(QStringLiteral("hello world"))', provenance: "QLineEdit::cursorPosition (qdoc); clamped to the text length, so the test sets text first" }
    methods:
      - { js: clear, native: clear, expect: "$w->text().isEmpty()", provenance: "QLineEdit::clear() slot (qdoc)" }
      - { js: selectAll, native: selectAll, provenance: "QLineEdit::selectAll() slot (qdoc)" }
      - { js: undo, native: undo, provenance: "QLineEdit::undo() slot (qdoc)" }
      - { js: redo, native: redo, provenance: "QLineEdit::redo() slot (qdoc)" }
      - { js: copy, native: copy, provenance: "QLineEdit::copy() slot (qdoc)" }
      - { js: setSelection, native: setSelection, params: [i32, i32], args: [0, 0], provenance: "QLineEdit::setSelection(int, int) (qdoc)" }
    bindings:
      # Binding metadata (schema extension `bindings`, docs/notes/fork-bindings.md section 6).
      - name: text
        direction: two_way
        property: text
        type: { ref: string, nullable: false }
        change: { signal: changed, role: any_change }
        write: { natively_normalizes: false }    # a validator or inputMask would make this true
        echo:
          strategy: host_suppressed              # `suppress_signals` on the text prop: a per-handle flag, never QSignalBlocker
          compare_before_set: true               # an unchanged setText does not emit textChanged (probe)
          read_back: false
          sync_signals_on_set: ["textChanged(QString)"]
        lifetime: { on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect }
        provenance: "docs/notes/signals-and-slots-semantics.md 1.6 (qt_sync_probe.py: textEdited never fires for setText, textChanged does)"
    signals:
      # Synthetic (an event filter, not a Qt signal): a sync signal. The handler's result decides
      # whether the key press is consumed (`e.preventDefault()`), before the line edit sees it.
      - { js: key-press, synthetic: key_press, provenance: "X2 sync key-press (docs/notes/x2-sync-frame.md); QKeyEvent via event filter" }
      - js: changed
        native: textChanged
        connect: "textChanged(QString)"
        args: [{ name: text, type: string }]
        trigger: '$w->setText(QStringLiteral("v") + QString::number($i))'
        expect_args: ["v0"]
        provenance: "QLineEdit::textChanged(const QString &) (qdoc); emitted for programmatic and user edits"
      - js: returnPressed
        native: returnPressed
        connect: "returnPressed()"
        args: []
        trigger: "Q_EMIT $w->returnPressed()"
        provenance: "QLineEdit::returnPressed() (qdoc)"
      - js: editingFinished
        native: editingFinished
        connect: "editingFinished()"
        args: []
        trigger: "Q_EMIT $w->editingFinished()"
        provenance: "QLineEdit::editingFinished() (qdoc)"
      - js: textEdited
        native: textEdited
        connect: "textEdited(QString)"
        args: [{ name: text, type: string }]
        trigger: 'Q_EMIT $w->textEdited(QStringLiteral("e") + QString::number($i))'
        expect_args: ["e0"]
        provenance: "QLineEdit::textEdited(const QString &) (qdoc); user edits only (qt_sync_probe.py)"
      - js: selectionChanged
        native: selectionChanged
        connect: "selectionChanged()"
        args: []
        trigger: 'Q_EMIT $w->selectionChanged()'
        provenance: "QLineEdit::selectionChanged() (qdoc)"
