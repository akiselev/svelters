elements:
  - tag: text-edit
    construct: { class: QTextEdit }
    props:
      - { js: plain-text, native: plainText, suppress_signals: true, provenance: "QTextEdit::plainText (qdoc)" }
      - { js: document, getter: document, setter: setDocument, provenance: "QTextEdit::document / setDocument (qdoc); a QTextDocument JS made (svelters:qt/gui, NT2) shared by several editors" }
      - { js: markdown, native: markdown, sample: 'x\n\n', provenance: "QTextEdit::markdown (qdoc)" }
      - { js: accept-rich-text, native: acceptRichText, provenance: "QTextEdit::acceptRichText (qdoc)" }
      - { js: read-only, native: readOnly, provenance: "QTextEdit::readOnly (qdoc)" }
      - { js: placeholder-text, native: placeholderText, provenance: "QTextEdit::placeholderText (qdoc)" }
      - { js: line-wrap-mode, native: lineWrapMode, provenance: "QTextEdit::lineWrapMode (qdoc)" }
      - { js: tab-changes-focus, native: tabChangesFocus, provenance: "QTextEdit::tabChangesFocus (qdoc)" }
      - { js: overwrite-mode, native: overwriteMode, provenance: "QTextEdit::overwriteMode (qdoc)" }
      - { js: word-wrap-mode, native: wordWrapMode, provenance: "QTextEdit::wordWrapMode (qdoc)" }
      - { js: undo-redo-enabled, native: undoRedoEnabled, provenance: "QTextEdit::undoRedoEnabled (qdoc)" }
      - { js: cursor-width, native: cursorWidth, provenance: "QTextEdit::cursorWidth (qdoc)" }
      - { js: line-wrap-column-or-width, native: lineWrapColumnOrWidth, provenance: "QTextEdit::lineWrapColumnOrWidth (qdoc)" }
      - { js: tab-stop-distance, native: tabStopDistance, provenance: "QTextEdit::tabStopDistance (qdoc)" }
      - { js: text-interaction-flags, native: textInteractionFlags, provenance: "QTextEdit::textInteractionFlags (qdoc)" }
      - { js: document-title, native: documentTitle, provenance: "QTextEdit::documentTitle (qdoc)" }
      - { js: auto-formatting, native: autoFormatting, provenance: "QTextEdit::autoFormatting (qdoc)" }
    methods:
      - { js: append, native: append, params: [string], args: ["x"], provenance: "QTextEdit::append (qdoc)" }
      - { js: insertPlainText, native: insertPlainText, params: [string], args: ["x"], provenance: "QTextEdit::insertPlainText (qdoc)" }
      - { js: insertHtml, native: insertHtml, params: [string], args: ["x"], provenance: "QTextEdit::insertHtml (qdoc)" }
      - { js: clear, native: clear, expect: "$w->toPlainText().isEmpty()", provenance: "QTextEdit::clear (qdoc)" }
      - { js: selectAll, native: selectAll, provenance: "QTextEdit::selectAll (qdoc)" }
      - { js: undo, native: undo, provenance: "QTextEdit::undo (qdoc)" }
      - { js: redo, native: redo, provenance: "QTextEdit::redo (qdoc)" }
      - { js: copy, native: copy, provenance: "QTextEdit::copy (qdoc)" }
      - { js: cut, native: cut, provenance: "QTextEdit::cut (qdoc)" }
      - { js: ensureCursorVisible, native: ensureCursorVisible, provenance: "QTextEdit::ensureCursorVisible (qdoc)" }
      - { js: document, native: document, provenance: "QTextEdit::document (qdoc)" }
    bindings:
      - name: plain-text
        direction: two_way
        property: plain-text
        type: { ref: string, nullable: false }
        change: { signal: text-changed, role: any_change, value: prop }
        write: { natively_normalizes: false }
        echo:
          strategy: host_suppressed
          compare_before_set: true
          read_back: false
          sync_signals_on_set: ["textChanged()"]
        lifetime: { on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect }
        provenance: "QTextEdit::textChanged() has no args, so the value is read from the property (docs/notes/fork-bindings.md 6)"
    signals:
      - { js: key-press, synthetic: key_press, provenance: "X2 sync key-press (docs/notes/x2-sync-frame.md)" }
      - js: text-changed
        native: textChanged
        connect: "textChanged()"
        args: []
        trigger: '$w->setPlainText(QStringLiteral("v") + QString::number($i))'
        provenance: "QTextEdit::textChanged() (qdoc)"
      - js: selection-changed
        native: selectionChanged
        connect: "selectionChanged()"
        args: []
        trigger: 'Q_EMIT $w->selectionChanged()'
        provenance: "QTextEdit::selectionChanged() (qdoc)"
      - js: cursor-position-changed
        native: cursorPositionChanged
        connect: "cursorPositionChanged()"
        args: []
        trigger: 'Q_EMIT $w->cursorPositionChanged()'
        provenance: "QTextEdit::cursorPositionChanged() (qdoc)"
