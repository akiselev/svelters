elements:
  - tag: tabwidget
    construct: { class: QTabWidget }
    props:
      - { js: tabPosition, native: tabPosition, provenance: "QTabWidget::tabPosition (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: tabShape, native: tabShape, provenance: "QTabWidget::tabShape (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: tabsClosable, native: tabsClosable, provenance: "QTabWidget::tabsClosable (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: movable, native: movable, provenance: "QTabWidget::movable (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: documentMode, native: documentMode, provenance: "QTabWidget::documentMode (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: usesScrollButtons, native: usesScrollButtons, provenance: "QTabWidget::usesScrollButtons (qdoc); typed by the S1 value model (ABI v3)" }
    signals:
      - js: changed
        native: currentChanged
        connect: "currentChanged(int)"
        args: [{ name: index, type: i32 }]
        trigger: 'if ($i == 2) $w->setCurrentIndex(1); else $w->addTab(new QWidget(), QString())'
        expect_args: ["0"]
        provenance: "QTabWidget::currentChanged(int) (qdoc)"
      - js: tab-close-requested
        native: tabCloseRequested
        connect: "tabCloseRequested(int)"
        args: [{ name: index, type: i32 }]
        trigger: '$w->tabCloseRequested(2 + $i)'
        expect_args: ["2"]
        provenance: "QTabWidget::tabCloseRequested(int) (qdoc); emitted directly (a close click needs a shown widget)"
      - js: tab-bar-clicked
        native: tabBarClicked
        connect: "tabBarClicked(int)"
        args: [{ name: index, type: i32 }]
        trigger: '$w->tabBarClicked(1 + $i)'
        expect_args: ["1"]
        provenance: "QTabWidget::tabBarClicked(int) (qdoc); emitted directly (a click needs a shown widget)"
    children:
      policy: named_slots
      default_slot: pages
      slots:
        - name: pages
          content: widget
          accepts: [QWidget]
          cardinality: many
          order: native_index
          nested: true
          host: self
          default: { kind: none }
          on_remove: empty
          attrs:
            - name: tabLabel
              type: string
              default: ""
              samples: ["First", "Second"]
              set: { native: "QTabWidget::setTabText(int, const QString&)", args: [child_index, value] }
              get: { native: "QTabWidget::tabText(int) const", args: [child_index] }
              expect: "static_cast<QTabWidget *>($p)->tabText(static_cast<QTabWidget *>($p)->indexOf($w)) == QString(\"First\")"
              provenance: "QTabWidget::setTabText(int, QString) (qdoc); X3 child attribute"
            - name: tabToolTip
              type: string
              default: ""
              samples: ["tip one", "tip two"]
              set: { native: "QTabWidget::setTabToolTip(int, const QString&)", args: [child_index, value] }
              get: { native: "QTabWidget::tabToolTip(int) const", args: [child_index] }
              expect: "static_cast<QTabWidget *>($p)->tabToolTip(static_cast<QTabWidget *>($p)->indexOf($w)) == QString(\"tip one\")"
              provenance: "QTabWidget::setTabToolTip(int, QString) (qdoc); X3 child attribute"
            - name: tabEnabled
              type: bool
              default: true
              samples: [false, true]
              set: { native: "QTabWidget::setTabEnabled(int, bool)", args: [child_index, value] }
              get: { native: "QTabWidget::isTabEnabled(int) const", args: [child_index] }
              expect: "!static_cast<QTabWidget *>($p)->isTabEnabled(static_cast<QTabWidget *>($p)->indexOf($w))"
              provenance: "QTabWidget::setTabEnabled(int, bool) (qdoc); X3 child attribute"
          ops:
            insert:
              native: "QTabWidget::addTab(QWidget*, const QString&)"
              args: [child, "const:QString()"]
              variants:
                - when: "before != null"
                  native: "QTabWidget::insertTab(int, QWidget*, const QString&)"
                  args: [index, child, "const:QString()"]
              effects: { child: parented }
            remove:                                   # removeTab leaves the page parented to the tab stack
              native: "QTabWidget::removeTab(int)"
              args: [index]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
            index_of: { native: "QTabWidget::indexOf(const QWidget*) const", args: [child] }
            list: { native: "QTabWidget::count() const", item: "QTabWidget::widget(int) const" }
          provenance: [{ origin: uic, ref: "QTabWidget/widget" }, { origin: docs, ref: "QTabWidget::insertTab" }, { origin: probe, ref: qt_slot_ownership_probe.py }]
