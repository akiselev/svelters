elements:
  - tag: messagebox
    construct: { class: QMessageBox }
    props:
      - { js: text, native: text, provenance: "QMessageBox::text (qdoc)" }
      - { js: informativeText, native: informativeText, provenance: "QMessageBox::informativeText (qdoc)" }
      - { js: detailedText, native: detailedText, provenance: "QMessageBox::detailedText (qdoc)" }
      - { js: icon, native: icon, provenance: "QMessageBox::icon (qdoc); enum by name (ABI v3)" }
      - { js: textFormat, native: textFormat, provenance: "QMessageBox::textFormat (qdoc); enum by name (ABI v3)" }
      - { js: standardButtons, native: standardButtons, provenance: "QMessageBox::standardButtons (qdoc); flags (ABI v3)" }
