elements:
  - tag: message-box
    construct: { class: QMessageBox }
    props:
      - { js: text, native: text, provenance: "QMessageBox::text (qdoc)" }
      - { js: informative-text, native: informativeText, provenance: "QMessageBox::informativeText (qdoc)" }
      - { js: detailed-text, native: detailedText, provenance: "QMessageBox::detailedText (qdoc)" }
      - { js: icon, native: icon, provenance: "QMessageBox::icon (qdoc); enum by name (ABI v3)" }
      - { js: text-format, native: textFormat, provenance: "QMessageBox::textFormat (qdoc); enum by name (ABI v3)" }
      - { js: standard-buttons, native: standardButtons, provenance: "QMessageBox::standardButtons (qdoc); flags (ABI v3)" }
