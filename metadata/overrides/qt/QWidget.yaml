inherit:
  props:
    - { js: enabled, native: enabled, provenance: "QWidget::enabled (qdoc)" }
    - { js: tool-tip, native: toolTip, provenance: "QWidget::toolTip (qdoc)" }
    - { js: status-tip, native: statusTip, provenance: "QWidget::statusTip (qdoc)" }
    - { js: whats-this, native: whatsThis, provenance: "QWidget::whatsThis (qdoc)" }
    - { js: minimum-width, native: minimumWidth, provenance: "QWidget::minimumWidth (qdoc)" }
    - { js: minimum-height, native: minimumHeight, provenance: "QWidget::minimumHeight (qdoc)" }
    - { js: maximum-width, native: maximumWidth, provenance: "QWidget::maximumWidth (qdoc)" }
    - { js: maximum-height, native: maximumHeight, provenance: "QWidget::maximumHeight (qdoc)" }
    - { js: style-sheet, native: styleSheet, provenance: "QWidget::styleSheet (qdoc)" }
    - { js: accessible-name, native: accessibleName, provenance: "QWidget::accessibleName (qdoc)" }
  # X8 event families: synthetic signals raised by an event filter (backend.cpp.in, "event families"). Payloads are v3
  # values: position/size records ({x, y}, {width, height}), integer masks for buttons and modifiers (Qt enum values).
  # key-release, mouse-*, wheel and context-menu are sync signals: `e.preventDefault()` consumes the event before the
  # widget sees it. focus-*, enter, leave and resize are posted (never consumed). All accept the capture flag
  # (`onmouse-presscapture`: ancestors see the event first, outermost first). mouse-move needs no pressed button:
  # listening turns on mouse tracking for the widget.
  signals:
    - { js: key-release, synthetic: key_release, args: [{ name: key, type: int }, { name: text, type: string }, { name: modifiers, type: int }], provenance: "X8: QKeyEvent (KeyRelease) via event filter" }
    - { js: mouse-press, synthetic: mouse_press, args: [{ name: position, type: Point }, { name: button, type: int }, { name: buttons, type: int }, { name: modifiers, type: int }], provenance: "X8: QMouseEvent (MouseButtonPress) via event filter" }
    - { js: mouse-release, synthetic: mouse_release, args: [{ name: position, type: Point }, { name: button, type: int }, { name: buttons, type: int }, { name: modifiers, type: int }], provenance: "X8: QMouseEvent (MouseButtonRelease) via event filter" }
    - { js: mouse-move, synthetic: mouse_move, args: [{ name: position, type: Point }, { name: button, type: int }, { name: buttons, type: int }, { name: modifiers, type: int }], provenance: "X8: QMouseEvent (MouseMove) via event filter" }
    - { js: mouse-double-click, synthetic: mouse_double_click, args: [{ name: position, type: Point }, { name: button, type: int }, { name: buttons, type: int }, { name: modifiers, type: int }], provenance: "X8: QMouseEvent (MouseButtonDblClick) via event filter" }
    - { js: wheel, synthetic: wheel, args: [{ name: position, type: Point }, { name: angleDelta, type: Point }, { name: buttons, type: int }, { name: modifiers, type: int }], provenance: "X8: QWheelEvent via event filter" }
    - { js: focus-in, synthetic: focus_in, args: [{ name: reason, type: int }], provenance: "X8: QFocusEvent (FocusIn) via event filter" }
    - { js: focus-out, synthetic: focus_out, args: [{ name: reason, type: int }], provenance: "X8: QFocusEvent (FocusOut) via event filter" }
    - { js: enter, synthetic: enter, args: [{ name: position, type: Point }], provenance: "X8: QEnterEvent via event filter" }
    - { js: leave, synthetic: leave, args: [], provenance: "X8: QEvent::Leave via event filter" }
    - { js: resize, synthetic: resize, args: [{ name: size, type: Size }, { name: oldSize, type: Size }], provenance: "X8: QResizeEvent via event filter" }
    - { js: context-menu, synthetic: context_menu, args: [{ name: position, type: Point }, { name: globalPosition, type: Point }, { name: reason, type: int }], provenance: "X8: QContextMenuEvent via event filter" }
  methods:
    - { js: show, native: show, provenance: "QWidget::show() slot (qdoc)" }
    - { js: hide, native: hide, provenance: "QWidget::hide() slot (qdoc)" }
    - { js: setFocus, native: setFocus, provenance: "QWidget::setFocus() slot (qdoc)" }
    - { js: update, native: update, provenance: "QWidget::update() slot (qdoc)" }
    - { js: adjustSize, native: adjustSize, provenance: "QWidget::adjustSize() slot (qdoc)" }
# Element `box`: a plain QWidget carrying a QBoxLayout. Children are layout-managed and ordered.
# Slot annotations follow docs/notes/signals-and-slots-semantics.md section 2.5. Extensions used here:
# `then` (extra steps after an op), `receiver: child` (receiver), `index_of`, and `list.item`.
elements:
  - tag: box-layout
    construct:
      class: QWidget
      composite:
        layout: { class: QBoxLayout, args: ["QBoxLayout::TopToBottom"] }
    props:
      - js: direction
        target: layout
        type: enum
        getter: direction
        setter: setDirection
        values:
          left-to-right: QBoxLayout::LeftToRight
          right-to-left: QBoxLayout::RightToLeft
          top-to-bottom: QBoxLayout::TopToBottom
          bottom-to-top: QBoxLayout::BottomToTop
        provenance: "QBoxLayout::direction (qdoc)"
      - { js: spacing, target: layout, native: spacing, provenance: "QLayout::spacing Q_PROPERTY (qdoc); P prop" }
      # Typed props (value model, ABI v3): records, enums, strings and flags share one converter set.
      - { js: geometry, native: geometry, provenance: "QWidget::geometry (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimum-size, native: minimumSize, provenance: "QWidget::minimumSize (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximum-size, native: maximumSize, provenance: "QWidget::maximumSize (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: size-increment, native: sizeIncrement, provenance: "QWidget::sizeIncrement (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: pos, native: pos, provenance: "QWidget::pos (qdoc); typed by the S1 value model (ABI v3)" }          # read-only: no setter
      - { js: size, native: size, provenance: "QWidget::size (qdoc); typed by the S1 value model (ABI v3)" }        # read-only: use resizeTo()
      - { js: contents-margins, target: layout, native: contentsMargins, provenance: "QWidget::contentsMargins (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: focus-policy, native: focusPolicy, provenance: "QWidget::focusPolicy (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: tool-tip, native: toolTip, provenance: "QWidget::toolTip (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: enabled, native: enabled, provenance: "QWidget::enabled (qdoc); typed by the S1 value model (ABI v3)" }
    methods:
      - { js: saveGeometry, native: saveGeometry, provenance: "QWidget::saveGeometry (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: restoreGeometry, native: restoreGeometry, params: [bytes], provenance: "QWidget::restoreGeometry (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: resizeTo, native: resize, params: ["record<Size>"], provenance: "QWidget::resize (qdoc); typed by the S1 value model (ABI v3)" }
      # Out parameters: JS passes nothing and gets {left, top, right, bottom}.
      - { js: getContentsMargins, target: layout, native: getContentsMargins, out: [left, top, right, bottom], provenance: "QLayout::getContentsMargins(int *, int *, int *, int *) (qdoc); out parameters, S2 ABI v3" }
    signals:
      # Synthetic (an event filter): the key presses this widget itself receives. Its main use is the capture
      # phase (X3): `onkey-presscapture` sees the keys of descendants (an entry inside the box) before they do.
      - { js: key-press, synthetic: key_press, provenance: "X2 sync key-press (docs/notes/x2-sync-frame.md); X3 capture phase (docs/notes/x3-childattr-listen.md)" }
    children:
      policy: layout_managed
      default_slot: children
      slots:
        - name: children
          content: widget
          accepts: [QWidget]
          cardinality: many
          order: native_index
          host: layout
          default: { kind: none }
          on_remove: empty
          requires:
            - { check: "QWidget::layout(self) != null", otherwise: error }   # satisfied by construction (composite layout)
          attrs:
            - name: stretch
              type: i32
              default: 0
              samples: [1, 3]
              set: { native: "QBoxLayout::setStretch(int, int)", args: [child_index, value] }
              get: { native: "QBoxLayout::stretch(int) const", args: [child_index] }
              expect: "qobject_cast<QBoxLayout *>($p->layout())->stretch(qobject_cast<QBoxLayout *>($p->layout())->indexOf($w)) == 1"
              provenance: "QBoxLayout::setStretch(int, int) (qdoc); X3 child attribute"
            - name: alignment
              type: enum
              values:
                none: "Qt::Alignment()"
                left: "Qt::AlignLeft"
                right: "Qt::AlignRight"
                hcenter: "Qt::AlignHCenter"
                top: "Qt::AlignTop"
                bottom: "Qt::AlignBottom"
                vcenter: "Qt::AlignVCenter"
                center: "Qt::AlignCenter"
              default: none
              samples: [right, center]
              set: { native: "QLayout::setAlignment(QWidget*, Qt::Alignment)", args: [child, value] }
              get: { native: "QLayout::itemAt(int) const", args: [child_index], member: alignment }
              expect: "($p->layout()->itemAt($p->layout()->indexOf($w))->alignment() == Qt::AlignRight)"
              provenance: "QLayout::setAlignment(QWidget*, Qt::Alignment), QLayoutItem::alignment() (qdoc); X3 child attribute"
          ops:
            insert:
              native: "QBoxLayout::addWidget(QWidget*, int, Qt::Alignment)"
              args: [child]
              variants:
                - when: "before != null"
                  native: "QBoxLayout::insertWidget(int, QWidget*, int, Qt::Alignment)"
                  args: [index, child]
              effects: { child: parented }
            remove:                                   # removeWidget leaves the widget parented and visible
              native: "QLayout::removeWidget(QWidget*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }   # also hides it
              effects: { child: unparented }
            index_of: { native: "QLayout::indexOf(const QWidget*) const", args: [child] }
            list: { native: "QLayout::count() const", item: "QLayout::itemAt(int) const" }
          provenance: [{ origin: uic, ref: "layout/item" }, { origin: typesystem, ref: addownership-1 }, { origin: probe, ref: qt_slot_ownership_probe.py }]

  # Element `grid`: a plain QWidget carrying a QGridLayout (X3). Position is not order: `cells` is unordered and
  # each child is placed by its `parent:column` / `parent:row` / `parent:column-span` / `parent:row-span` attributes.
  # QGridLayout fixes the cell when the widget is added, so changing an attribute removes and re-adds the widget
  # with all four current values (`readd`). A child is inserted at row 0, column 0, spanning one cell.
  - tag: grid-layout
    construct:
      class: QWidget
      composite:
        layout: { class: QGridLayout }
    children:
      policy: layout_managed
      default_slot: cells
      slots:
        - name: cells
          content: widget
          accepts: [QWidget]
          cardinality: many
          order: unordered
          host: layout
          default: { kind: none }
          on_remove: empty
          requires:
            - { check: "QWidget::layout(self) != null", otherwise: error }   # satisfied by construction (composite layout)
          attrs:
            - name: column
              type: i32
              default: 0
              samples: [2, 5]
              set: { native: "QGridLayout::addWidget(QWidget*, int, int, int, int, Qt::Alignment)", args: [child, attr.row, value, attr.row-span, attr.column-span], readd: true }
              get: { native: "QGridLayout::getItemPosition(int, int*, int*, int*, int*) const", args: [child_index], out: 2 }
              expect: "[&] { auto *l = qobject_cast<QGridLayout *>($p->layout()); int r, c, rs, cs; l->getItemPosition(l->indexOf($w), &r, &c, &rs, &cs); return c == 2; }()"
              provenance: "QGridLayout::addWidget, QGridLayout::getItemPosition (qdoc); X3 child attribute"
            - name: row
              type: i32
              default: 0
              samples: [3, 1]
              set: { native: "QGridLayout::addWidget(QWidget*, int, int, int, int, Qt::Alignment)", args: [child, value, attr.column, attr.row-span, attr.column-span], readd: true }
              get: { native: "QGridLayout::getItemPosition(int, int*, int*, int*, int*) const", args: [child_index], out: 1 }
              expect: "[&] { auto *l = qobject_cast<QGridLayout *>($p->layout()); int r, c, rs, cs; l->getItemPosition(l->indexOf($w), &r, &c, &rs, &cs); return r == 3; }()"
              provenance: "QGridLayout::addWidget, QGridLayout::getItemPosition (qdoc); X3 child attribute"
            - name: column-span
              type: i32
              default: 1
              samples: [2, 3]
              set: { native: "QGridLayout::addWidget(QWidget*, int, int, int, int, Qt::Alignment)", args: [child, attr.row, attr.column, attr.row-span, value], readd: true }
              get: { native: "QGridLayout::getItemPosition(int, int*, int*, int*, int*) const", args: [child_index], out: 4 }
              expect: "[&] { auto *l = qobject_cast<QGridLayout *>($p->layout()); int r, c, rs, cs; l->getItemPosition(l->indexOf($w), &r, &c, &rs, &cs); return cs == 2; }()"
              provenance: "QGridLayout::addWidget, QGridLayout::getItemPosition (qdoc); X3 child attribute"
            - name: row-span
              type: i32
              default: 1
              samples: [2, 4]
              set: { native: "QGridLayout::addWidget(QWidget*, int, int, int, int, Qt::Alignment)", args: [child, attr.row, attr.column, value, attr.column-span], readd: true }
              get: { native: "QGridLayout::getItemPosition(int, int*, int*, int*, int*) const", args: [child_index], out: 3 }
              expect: "[&] { auto *l = qobject_cast<QGridLayout *>($p->layout()); int r, c, rs, cs; l->getItemPosition(l->indexOf($w), &r, &c, &rs, &cs); return rs == 2; }()"
              provenance: "QGridLayout::addWidget, QGridLayout::getItemPosition (qdoc); X3 child attribute"
          ops:
            insert:
              native: "QGridLayout::addWidget(QWidget*, int, int, Qt::Alignment)"
              args: [child, "const:0", "const:0"]
              effects: { child: parented }
            remove:                                   # removeWidget leaves the widget parented and visible
              native: "QLayout::removeWidget(QWidget*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }   # also hides it
              effects: { child: unparented }
            index_of: { native: "QLayout::indexOf(const QWidget*) const", args: [child] }
            list: { native: "QLayout::count() const", item: "QLayout::itemAt(int) const" }
          provenance: [{ origin: uic, ref: "layout/item" }, { origin: docs, ref: "QGridLayout::addWidget" }, { origin: probe, ref: qt_slot_ownership_probe.py }]
