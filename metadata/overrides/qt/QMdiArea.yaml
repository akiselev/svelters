# Element `mdiarea`. The `subwindows` slot is append-only and nested (G13): QMdiArea has no count()/indexOf()/
# itemAt(); membership is isAncestorOf. Probe (Qt 6): addSubWindow(w) wraps w in a
# QMdiSubWindow (w->parent() is the wrapper); removeSubWindow(w) reparents w to null but leaves the empty wrapper in
# the area's list; the wrapper is only dropped by removeSubWindow(wrapper).
elements:
  - tag: mdi-area
    construct: { class: QMdiArea }
    props:
      - { js: activation-order, native: activationOrder, provenance: "QMdiArea::activationOrder (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: document-mode, native: documentMode, provenance: "QMdiArea::documentMode (qdoc)" }
      - { js: tab-position, native: tabPosition, provenance: "QMdiArea::tabPosition (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: tab-shape, native: tabShape, provenance: "QMdiArea::tabShape (qdoc); enum typed by the S1 value model (ABI v3)" }
      - { js: tabs-closable, native: tabsClosable, provenance: "QMdiArea::tabsClosable (qdoc)" }
      - { js: tabs-movable, native: tabsMovable, provenance: "QMdiArea::tabsMovable (qdoc)" }
      - { js: view-mode, native: viewMode, provenance: "QMdiArea::viewMode (qdoc); enum typed by the S1 value model (ABI v3)" }
    methods:
      - { js: cascadeSubWindows, native: cascadeSubWindows, provenance: "QMdiArea::cascadeSubWindows() slot (qdoc)" }
      - { js: tileSubWindows, native: tileSubWindows, provenance: "QMdiArea::tileSubWindows() slot (qdoc)" }
      - { js: closeAllSubWindows, native: closeAllSubWindows, provenance: "QMdiArea::closeAllSubWindows() slot (qdoc)" }
    children:
      policy: named_slots
      default_slot: subwindows
      slots:
        - name: subwindows
          content: widget
          accepts: [QWidget]
          cardinality: many
          order: append_only
          nested: true
          host: self
          default: { kind: none }
          on_remove: empty
          ops:
            insert:
              native: "QMdiArea::addSubWindow(QWidget*, Qt::WindowFlags)"
              args: [child]
              effects: { child: parented }
            remove:
              native: "QMdiArea::removeSubWindow(QWidget*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
          provenance: [{ origin: qdoc, ref: "QMdiArea::addSubWindow, removeSubWindow" }, { origin: probe, ref: "addSubWindow wraps the widget in a QMdiSubWindow" }]
