elements:
  - tag: fontdialog
    construct: { class: QFontDialog }
    exclude: [done]   # protected in QFontDialog; generated thunks call it on the subclass
    props:
      - { js: currentFont, native: currentFont, provenance: "QFontDialog::currentFont (qdoc); font string form (ABI v3)" }
      - { js: options, native: options, provenance: "QFontDialog::options (qdoc); flags (ABI v3)" }
