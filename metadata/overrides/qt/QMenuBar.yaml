# Element `menubar`: its items are menus (QMenu::menuAction()) and actions, held by the `items` slot
# (QWidget::insertAction/removeAction, glue in menus.hpp.in; see QMenu.yaml). Place it in a vertical `box` like any widget.
# nativeMenuBar was dropped: it cannot be enabled on the xcb test platform (setNativeMenuBar(true) reads back false).
elements:
  - tag: menu-bar
    construct: { class: QMenuBar }
    props:
      - { js: default-up, native: defaultUp, provenance: "QMenuBar::defaultUp (qdoc)" }
    methods:
      - { js: clear, native: clear, provenance: "QMenuBar::clear() (qdoc)" }
    children:
      policy: ordered
      default_slot: items
      slots:
        - name: items
          content: widget
          accepts: [QAction, QMenu]
          cardinality: many
          order: actions
          host: self
          default: { kind: none }
          on_remove: empty
          ops: {}
          provenance: "QWidget::insertAction/removeAction (qdoc); a QMenu item is its menuAction(); X4"

# Dangerous members (docs/notes/dangerous-members.md): reachable from JS, but the backend owns what they change.
dangerous:
  methods:
    clear:
      severity: corrupts-tree
      reason: >-
        The items slot parents and inserts the backend's actions and menus (tools/metadata/qt/templates/menus.hpp.in:69-73);
        clear() drops them behind it (and deletes the actions the bar parents), so a later remove fails
        ("child is not in this parent", menus.hpp.in:83).
      use_instead: Remove the <action>/<menu> children with {#if}/{#each}.
      evidence: [tools/metadata/qt/templates/menus.hpp.in:69-83]
