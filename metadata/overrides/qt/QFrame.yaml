inherit:
  props:
    - { js: frame-shape, native: frameShape, provenance: "QFrame::frameShape (qdoc)" }
    - { js: frame-shadow, native: frameShadow, provenance: "QFrame::frameShadow (qdoc)" }
    - { js: line-width, native: lineWidth, provenance: "QFrame::lineWidth (qdoc)" }
    - { js: mid-line-width, native: midLineWidth, provenance: "QFrame::midLineWidth (qdoc)" }
# Element `frame`: a QFrame carrying a QBoxLayout (like `box`). Children are layout-managed.
elements:
  - tag: frame
    construct:
      class: QFrame
      composite:
        layout: { class: QBoxLayout, args: ["QBoxLayout::TopToBottom"] }
    props:
      - js: direction
        target: layout
        type: enum
        getter: direction
        setter: setDirection
        values:
          left-to-right: QBoxLayout::LeftToRight
          right-to-left: QBoxLayout::RightToLeft
          top-to-bottom: QBoxLayout::TopToBottom
          bottom-to-top: QBoxLayout::BottomToTop
        provenance: "QBoxLayout::direction (qdoc)"
    children:
      policy: layout_managed
      default_slot: children
      slots:
        - name: children
          content: widget
          accepts: [QWidget]
          cardinality: many
          order: native_index
          host: layout
          default: { kind: none }
          on_remove: empty
          requires:
            - { check: "QWidget::layout(self) != null", otherwise: error }   # satisfied by construction (composite layout)
          ops:
            insert:
              native: "QBoxLayout::addWidget(QWidget*, int, Qt::Alignment)"
              args: [child]
              variants:
                - when: "before != null"
                  native: "QBoxLayout::insertWidget(int, QWidget*, int, Qt::Alignment)"
                  args: [index, child]
              effects: { child: parented }
            remove:
              native: "QLayout::removeWidget(QWidget*)"
              args: [child]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
            index_of: { native: "QLayout::indexOf(const QWidget*) const", args: [child] }
            list: { native: "QLayout::count() const", item: "QLayout::itemAt(int) const" }
          provenance: [{ origin: uic, ref: "layout/item" }, { origin: typesystem, ref: addownership-1 }, { origin: probe, ref: qt_slot_ownership_probe.py }]
