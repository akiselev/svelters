elements:
  - tag: scroll-bar
    construct: { class: QScrollBar }
    props:
      - { js: value, native: value, suppress_signals: true, provenance: "QAbstractSlider::value (qdoc); declared on the element so bind:value resolves it" }
    bindings:
      - name: value
        direction: two_way
        property: value
        type: { ref: i32, nullable: false }
        change: { signal: value-changed, role: any_change, value: arg0 }
        write: { natively_normalizes: false }
        echo: { strategy: host_suppressed, compare_before_set: true, read_back: false, sync_signals_on_set: ["valueChanged(int)"] }
        lifetime: { on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect }
        provenance: "setValue emits valueChanged only on change (qdoc)"
    signals:
      - js: value-changed
        native: valueChanged
        connect: "valueChanged(int)"
        args: [{ name: value, type: i32 }]
        trigger: "$w->setRange(0, 100); $w->setValue(($i + 1) * 3)"
        expect_args: ["3"]
        provenance: "QAbstractSlider::valueChanged(int) (qdoc); declared on the element so bind:value resolves it"
