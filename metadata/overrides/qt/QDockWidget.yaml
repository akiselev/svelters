# Element `dockwidget`. The `widget` one slot: QDockWidget::setWidget() replaces the old widget by hiding it and
# removing it from the layout, but it stays parented to the dock widget (probe, Qt 6). The clearing remove
# (setWidget(nullptr) + setParent(nullptr) on the child) therefore also runs on the old child before a replace (G15).
# Main-window dock areas need child attributes (gap:G1).
elements:
  - tag: dock-widget
    construct: { class: QDockWidget }
    props:
      - { js: features, native: features, provenance: "QDockWidget::features (qdoc); flags (ABI v3)" }
      - { js: allowed-areas, native: allowedAreas, provenance: "QDockWidget::allowedAreas (qdoc); flags (ABI v3)" }
      - { js: floating, native: floating, provenance: "QDockWidget::floating (qdoc)" }
      - { js: window-title, native: windowTitle, provenance: "QWidget::windowTitle (qdoc)" }
    signals:
      - js: top-level-changed
        native: topLevelChanged
        connect: "topLevelChanged(bool)"
        args: [{ name: topLevel, type: bool }]
        trigger: '$w->topLevelChanged(($i % 2) == 0)'
        expect_args: ["true"]
        provenance: "QDockWidget::topLevelChanged(bool) (qdoc); emitted directly (a drag needs a shown main window)"
      - js: visibility-changed
        native: visibilityChanged
        connect: "visibilityChanged(bool)"
        args: [{ name: visible, type: bool }]
        trigger: '$w->visibilityChanged(($i % 2) == 0)'
        expect_args: ["true"]
        provenance: "QDockWidget::visibilityChanged(bool) (qdoc); emitted directly (needs a shown main window)"
      - js: features-changed
        native: featuresChanged
        connect: "featuresChanged(QDockWidget::DockWidgetFeatures)"
        args: [{ name: features, type: "flags<QDockWidget::DockWidgetFeature>" }]
        trigger: '$w->setFeatures(($i % 2) == 0 ? QDockWidget::NoDockWidgetFeatures : QDockWidget::DockWidgetClosable)'
        provenance: "QDockWidget::featuresChanged(DockWidgetFeatures) (qdoc)"
      - js: allowed-areas-changed
        native: allowedAreasChanged
        connect: "allowedAreasChanged(Qt::DockWidgetAreas)"
        args: [{ name: allowedAreas, type: "flags<Qt::DockWidgetArea>" }]
        trigger: '$w->setAllowedAreas(($i % 2) == 0 ? Qt::LeftDockWidgetArea : Qt::RightDockWidgetArea)'
        provenance: "QDockWidget::allowedAreasChanged(DockWidgetAreas) (qdoc)"
    children:
      policy: named_slots
      default_slot: widget
      slots:
        - name: widget
          content: widget
          accepts: [QWidget]
          cardinality: one
          host: self
          default: { kind: none }
          on_remove: empty
          ops:
            get: { native: "QDockWidget::widget() const" }
            set:
              native: "QDockWidget::setWidget(QWidget*)"
              args: [child]
              effects: { child: parented, old: unparented }
            remove:
              native: "QDockWidget::setWidget(QWidget*)"
              args: [null]
              then:
                - { native: "QWidget::setParent(QWidget*)", receiver: child, args: [null] }
              effects: { child: unparented }
          provenance: [{ origin: qdoc, ref: "QDockWidget::setWidget" }, { origin: probe, ref: "old widget stays parented, hidden" }]
