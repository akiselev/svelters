elements:
  - tag: tool-button
    construct: { class: QToolButton }
    exclude: [checked]   # not checkable by default
    props:
      - { js: auto-raise, native: autoRaise, provenance: "QToolButton::autoRaise (qdoc)" }
      - { js: tool-button-style, native: toolButtonStyle, provenance: "QToolButton::toolButtonStyle (qdoc)" }
      - { js: arrow-type, native: arrowType, provenance: "QToolButton::arrowType (qdoc)" }
      - { js: popup-mode, native: popupMode, provenance: "QToolButton::popupMode (qdoc)" }
    methods:
      - { js: setMenu, native: setMenu, params: ["object<QMenu>"], provenance: "QToolButton::setMenu(QMenu*) (qdoc); the button does not take ownership" }
