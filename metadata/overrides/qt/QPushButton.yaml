elements:
  - tag: button
    construct: { class: QPushButton }
    props:
      - { js: label, native: text }
      - { js: minimumHeight, native: minimumHeight }   # X1 native styling: min-height
      - { js: default, native: default }               # X1 native styling: emphasis: accent
    methods:
      - { js: click, native: click }
    signals:
      - js: clicked
        native: clicked
        # clicked() and clicked(bool) are separate metamethods; connecting both would deliver twice.
        collapses: ["clicked()", "clicked(bool)"]
        connect: "clicked(bool)"
        args: []
        trigger: "$w->click()"
