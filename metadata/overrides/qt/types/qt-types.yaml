# Overrides of the Qt non-GUI type pipeline (tools/metadata/qt/types_qt_classify.py). Everything else is
# classified by rules from qdoc + PySide6 + moc (plans/research/NON-GUI-TYPES.md sections 3.1 and 3.4).
# Strict: every class named here must exist in metadata/qt/types/ingested/ (the classifier fails otherwise).

# The N2 curated set: every member of these types has a generated, ledger-verified test.
curated:
  - QTimer
  - QStringListModel
  - QStandardItemModel
  - QStandardItem
  - QTextDocument
  - QUrl
  - QFileInfo
  - QIcon
  - QMimeDatabase
  - QTemporaryDir

# How the generated ledger tests make a subject of a curated type that is not a constructible QObject
# (those are made with `construct`): the arguments of its constructor (`new`), as JSON-ish scalars.
subjects:
  QUrl: ["https://example.com/a/b?x=1#top"]
  QFileInfo: ["/usr/share"]
  QIcon: []
  QMimeDatabase: []
  QTemporaryDir: []
  QStandardItem: ["item"]

