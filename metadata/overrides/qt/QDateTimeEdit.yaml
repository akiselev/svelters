elements:
  - tag: date-time-edit
    construct: { class: QDateTimeEdit }
    props:
      - { js: date-time, native: dateTime, suppress_signals: true, provenance: "QDateTimeEdit::dateTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: display-format, native: displayFormat, sample: "yyyy-MM-dd HH:mm", provenance: "QDateTimeEdit::displayFormat (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: calendar-popup, native: calendarPopup, provenance: "QDateTimeEdit::calendarPopup (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimum-date, native: minimumDate, provenance: "QDateTimeEdit::minimumDate (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximum-date, native: maximumDate, provenance: "QDateTimeEdit::maximumDate (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimum-time, native: minimumTime, provenance: "QDateTimeEdit::minimumTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximum-time, native: maximumTime, provenance: "QDateTimeEdit::maximumTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimum-date-time, native: minimumDateTime, provenance: "QDateTimeEdit::minimumDateTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximum-date-time, native: maximumDateTime, provenance: "QDateTimeEdit::maximumDateTime (qdoc); typed by the S1 value model (ABI v3)" }
    bindings:
      - name: date-time
        direction: two_way
        property: date-time
        type: { ref: datetime, nullable: false }
        change: { signal: date-time-changed, role: any_change, value: arg0 }
        write: { natively_normalizes: true }    # clamped to the minimum..maximum range
        echo: { strategy: host_suppressed, compare_before_set: false, read_back: false, sync_signals_on_set: ["dateTimeChanged(QDateTime)"] }
        lifetime: { on_native_death: end_binding, on_stale_update: warn_noop, on_destroy: idempotent_disconnect }
        provenance: "QDateTimeEdit::setDateTime emits dateTimeChanged only on change (qdoc); no-echo test for non-scalar props (A1-GAPS G16)"
    signals:
      - js: date-time-changed
        native: dateTimeChanged
        connect: "dateTimeChanged(QDateTime)"
        args: [{ name: datetime, type: datetime }]
        trigger: '$w->setDateTime(QDateTime(QDate(2001, 1, 1), QTime(0, 0)).addDays($i + 1))'
        provenance: "QDateTimeEdit::dateTimeChanged(QDateTime) (qdoc)"
