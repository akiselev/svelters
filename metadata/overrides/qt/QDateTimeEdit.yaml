elements:
  - tag: datetimeedit
    construct: { class: QDateTimeEdit }
    props:
      - { js: dateTime, native: dateTime, provenance: "QDateTimeEdit::dateTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: displayFormat, native: displayFormat, sample: "yyyy-MM-dd HH:mm", provenance: "QDateTimeEdit::displayFormat (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: calendarPopup, native: calendarPopup, provenance: "QDateTimeEdit::calendarPopup (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimumDate, native: minimumDate, provenance: "QDateTimeEdit::minimumDate (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximumDate, native: maximumDate, provenance: "QDateTimeEdit::maximumDate (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimumTime, native: minimumTime, provenance: "QDateTimeEdit::minimumTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximumTime, native: maximumTime, provenance: "QDateTimeEdit::maximumTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: minimumDateTime, native: minimumDateTime, provenance: "QDateTimeEdit::minimumDateTime (qdoc); typed by the S1 value model (ABI v3)" }
      - { js: maximumDateTime, native: maximumDateTime, provenance: "QDateTimeEdit::maximumDateTime (qdoc); typed by the S1 value model (ABI v3)" }
