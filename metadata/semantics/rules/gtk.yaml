# Hand-written native semantics for the GTK 4 backend: facts that no upstream source encodes, or
# contracts our own backend adds. Merged over metadata/gtk/*.json by
# tools/metadata/semantics/gen_semantics.py into metadata/semantics/gtk.json.
# Every fact carries a provenance. See docs/notes/native-compiler/semantic-spec.md.
framework: "GTK 4 (svelters-gtk, gtk4-rs)"

# DOM-style event names accepted in `on<event>` attributes, as @svelters/renderer maps them.
event_aliases:
  click: clicked
  change: changed
  close: close-request
event_aliases_provenance: "@svelters/renderer EVENT_TO_SIGNAL"

# Kind rules are inherited along the kind chain (a rule on Gtk.Window applies to every window kind).
kinds:
  Gtk.Window:
    lifetime: toplevel
    present: present
    provenance: "backend-abi.md ABI v2 'As implemented': GTK toplevel is GtkWindow; present is the zero-arg method in METHODS"
  Gtk.Label:
    text_content: label
    provenance: "@svelters/renderer LABEL_KINDS: text children fold into the label property"
  Gtk.Button:
    text_content: label
    provenance: "@svelters/renderer LABEL_KINDS"
  Gtk.Editable:
    signals:
      changed:
        args: [{ name: text, type: string }]
        provenance: "svelters-gtk backend contract (P5 fix 2): `changed` delivers [text], matching Qt"
    bindings:
      text:
        event: changed
        value: { arg: 0 }
        echo: backend_blocks
        provenance: "Editable:text echo_suppress [changed, notify::text] in metadata; GtkEntry re-notifies identical sets (signals-and-slots §1.6), so the runtime also compares"

# GTK defaults come from GParamSpec (metadata/gtk/*.json); entries here override or fill gaps.
defaults: {}

style:
  units:
    dp: { scale: 1, provenance: "GTK 4 sizes are logical pixels; the scale factor is applied by GDK" }
  declarations:
    orientation:
      prop: orientation
      value: enum
      applies_to: Gtk.Orientable
      contract: common
      provenance: "GtkOrientable:orientation (Gtk 4 docs)"
    spacing:
      prop: spacing
      value: length
      applies_to: Gtk.Box
      contract: common
      provenance: "GtkBox:spacing, logical pixels (Gtk 4 docs)"
    min-width:
      prop: width-request
      value: length
      applies_to: Gtk.Widget
      contract: common
      provenance: "GtkWidget:width-request is a minimum size request (default -1 = natural)"
    min-height:
      prop: height-request
      value: length
      applies_to: Gtk.Widget
      contract: common
      provenance: "GtkWidget:height-request is a minimum size request (default -1 = natural)"
    enabled:
      prop: sensitive
      value: bool
      applies_to: Gtk.Widget
      contract: common
      provenance: "GtkWidget:sensitive (Gtk 4 docs)"
    emphasis:
      applies_to: Gtk.Button
      contract: native_intent
      intents:
        normal: {}
        accent: { add_token: { prop: css-classes, token: suggested-action } }
        destructive: { add_token: { prop: css-classes, token: destructive-action } }
      provenance: "GNOME HIG / Adwaita style classes .suggested-action and .destructive-action on GtkButton"
