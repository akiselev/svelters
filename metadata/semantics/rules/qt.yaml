# Hand-written native semantics for the QtWidgets backend. Merged over the annotated elements of
# metadata/overrides/qt/*.yaml (as resolved by tools/metadata/qt/gen_cpp.py) into
# metadata/semantics/qt.json. Only annotated elements/props/signals exist at runtime on Qt.
# Every fact carries a provenance. See docs/notes/native-compiler/semantic-spec.md.
framework: "Qt 6 Widgets (generated C++ backend)"

# Events are the native signal names in kebab-case (`onclicked`, `ontext-changed`): no DOM-style aliases (N1).

# The container a virtualized list renders each row into (lower/lists.rs, @svelters/lists).
row_outlet: box-layout
row_outlet_provenance: "@svelters/lists controller: one box-layout (QWidget + QBoxLayout) outlet per row, handed to the virtual-list's setRow"

# Applied to every annotated signal unless a kind rule says otherwise.
signal_defaults:
  disconnect_on_drop: true
  provenance: "generated backend: destroy deletes the QObject (deleteLater), which drops its connections; runtime-contract.md 'no explicit listen off'"

kinds:
  main-window:
    present: present
    provenance: "QMainWindow.yaml methods: present = show(); runtime-contract.md element(kind, present)"
  # Text children (`text_content`) come from `elements[].text_prop` in metadata/overrides/qt.
  # line-edit bind:text comes from the `bindings` annotation in metadata/overrides/qt/QLineEdit.yaml.

# Qt metaobject dumps carry no defaults for these properties; values from the Qt 6 docs.
defaults:
  main-window.window-title: { value: "", provenance: "QWidget::windowTitle default empty QString (Qt docs)" }
  label.text: { value: "", provenance: "QLabel::text default empty QString (Qt docs)" }
  push-button.text: { value: "", provenance: "QAbstractButton::text default empty QString (Qt docs)" }
  push-button.minimum-height: { value: 0, provenance: "QWidget::minimumHeight default 0 (Qt docs)" }
  push-button.default: { value: false, provenance: "QPushButton::default is false unless set (Qt docs)" }
  box-layout.spacing: { value: -1, provenance: "QLayout::spacing -1 = style default (Qt docs)" }
  box-layout.direction: { value: top-to-bottom, provenance: "box-layout constructs QBoxLayout::TopToBottom (QWidget.yaml)" }
  line-edit.text: { value: "", provenance: "QLineEdit::text default empty QString (Qt docs)" }
  line-edit.placeholder-text: { value: "", provenance: "QLineEdit::placeholderText default empty QString (Qt docs)" }
  line-edit.minimum-height: { value: 0, provenance: "QWidget::minimumHeight default 0 (Qt docs)" }

# Elements other backends have that Qt does not; used for diagnostics only.
element_hints:
  header-bar:
    hint: "QtWidgets has no header bar: the title comes from the main-window `window-title`, buttons go in its menu-bar slot or a tool-bar"
    provenance: "QMainWindow docs (window decoration is native); GTK HeaderBar has no QtWidgets equivalent"

# Style properties (setters, child attributes, native CSS) live in metadata/style/qt.yaml.
