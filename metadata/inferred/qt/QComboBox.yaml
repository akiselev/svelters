  bindings:
  - name: current-index
    direction: two_way
    property: current-index
    type:
      ref: i32
      nullable: false
    change:
      signal: current-index-changed
      role: any_change
      value: arg0
    write:
      natively_normalizes: false
    echo:
      strategy: none
      compare_before_set: true
      read_back: false
    lifetime:
      on_native_death: end_binding
      on_stale_update: warn_noop
      on_destroy: idempotent_disconnect
    verify:
      values:
      - 1
      - 0
    provenance:
    - origin: rule
      ref: 'B1: QComboBox::currentIndex is writable, scalar and NOTIFYs currentIndexChanged(int); the renderer compares before set'
