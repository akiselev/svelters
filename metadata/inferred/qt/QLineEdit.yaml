      ref: signal returnPressed()
    - origin: rule
      ref: 'R2: no probed property set emits it; emitted with sampled arguments (delivery only, no native trigger)'
  - js: selection-changed
    native: selectionChanged
    connect: selectionChanged()
    args: []
