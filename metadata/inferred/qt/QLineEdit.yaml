    expect_args:
    - svl
    provenance:
    - origin: metaobject
      ref: signal textEdited(QString)
    - origin: rule
      ref: 'R2: no probed property set emits it; emitted with sampled arguments (delivery only, no native trigger)'
  bindings:
  - name: text
    direction: two_way
    property: text
    type:
      ref: string
      nullable: false
    change:
      signal: text-changed
      role: any_change
      value: arg0
    write:
      natively_normalizes: false
    echo:
      strategy: none
      compare_before_set: true
      read_back: false
    lifetime:
      on_native_death: end_binding
      on_stale_update: warn_noop
      on_destroy: idempotent_disconnect
    verify:
      values:
      - svl probe
      - ''
    provenance:
    - origin: rule
      ref: 'B1: QLineEdit::text is writable, scalar and NOTIFYs textChanged(QString); the renderer compares before set'
