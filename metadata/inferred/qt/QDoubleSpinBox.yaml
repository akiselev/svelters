elements:
- tag: double-spin-box
  props:
  - js: decimals
    native: decimals
    sample: 3
    provenance:
    - origin: probe
      ref: round trip exact
  - js: maximum
    native: maximum
    sample: 101.49
    provenance:
    - origin: probe
      ref: round trip exact
  - js: minimum
    native: minimum
    sample: 1.5
    provenance:
    - origin: probe
      ref: round trip exact
  - js: prefix
    native: prefix
    sample: svl probe
    provenance:
    - origin: probe
      ref: round trip exact
  - js: single-step
    native: singleStep
    sample: 2.5
    provenance:
    - origin: probe
      ref: round trip exact
  - js: step-type
    native: stepType
    sample: AdaptiveDecimalStepType
    provenance:
    - origin: probe
      ref: round trip exact
  - js: suffix
    native: suffix
    sample: svl probe
    provenance:
    - origin: probe
      ref: round trip exact
  - js: value
    native: value
    sample: 1.5
    provenance:
    - origin: probe
      ref: round trip exact; NOTIFY fired
  methods:
  - js: cleanText
    native: cleanText
    provenance:
    - origin: probe
      ref: 'returns property cleanText (probe: equal on a new instance)'
  signals:
  - js: text-changed
    native: textChanged
    connect: textChanged(QString)
    args:
    - name: text
      type: string
    trigger:
      property: value
      values:
      - 1.5
      - 0.0
      - 1.5
    expect_args:
    - '1.50'
    provenance:
    - origin: metaobject
      ref: signal textChanged(QString)
    - origin: probe
      ref: emitted once per set of value (sample, default, sample)
  - js: value-changed
    native: valueChanged
    connect: valueChanged(double)
    args:
    - name: d
      type: f64
    trigger:
      property: value
      values:
      - 1.5
      - 0.0
      - 1.5
    expect_args:
    - '1.5'
    provenance:
    - origin: metaobject
      ref: signal valueChanged(double)
    - origin: probe
      ref: emitted once per set of value (sample, default, sample); its NOTIFY signal
  bindings:
  - name: value
    direction: two_way
    property: value
    type:
      ref: f64
      nullable: false
    change:
      signal: value-changed
      role: any_change
      value: arg0
    write:
      natively_normalizes: false
    echo:
      strategy: none
      compare_before_set: true
      read_back: false
    lifetime:
      on_native_death: end_binding
      on_stale_update: warn_noop
      on_destroy: idempotent_disconnect
    verify:
      values:
      - 1.5
      - 0.0
    provenance:
    - origin: rule
      ref: 'B1: QDoubleSpinBox::value is writable, scalar and NOTIFYs valueChanged(double); the renderer compares before set'
