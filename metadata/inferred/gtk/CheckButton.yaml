bindings:
- name: active
  direction: two_way
  property: active
  type:
    ref: bool
    nullable: false
  change:
    signal: notify::active
    role: any_change
    value: prop
  write:
    natively_normalizes: false
  echo:
    strategy: none
    compare_before_set: true
    read_back: false
  lifetime:
    on_native_death: end_binding
    on_stale_update: warn_noop
    on_destroy: idempotent_disconnect
  provenance:
  - origin: rule
    ref: 'B1: GtkCheckButton:active is writable, scalar and notifies; the renderer compares before set'
