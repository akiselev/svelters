methods:
- name: get_index
  dispatch: dynamic
  args: []
  expect: r == V::I64(-1)
  provenance:
  - origin: probe
    ref: called on a new instance, returned -1
- name: is_selected
  dispatch: dynamic
  args: []
  expect: r == V::Bool(false)
  provenance:
  - origin: probe
    ref: called on a new instance, returned False
children:
  policy: single_child
  default_slot: child
  slots:
  - name: child
    content: widget
    accepts:
    - Gtk.Widget
    route_by_kind: false
    cardinality: one
    order: none
    default:
      kind: none
    on_remove: empty
    attrs: []
    requires: []
    ops:
      get:
        native: GtkFlowBoxChild::get_child() const
      set:
        native: GtkFlowBoxChild::set_child(GtkWidget*)
        args:
        - child
        effects:
          child: parented
          old: unparented
      remove:
        native: GtkFlowBoxChild::set_child(GtkWidget*)
        args:
        - null
        effects:
          child: unparented
    verify: {}
    provenance:
    - origin: probe
      ref: set parents the child (direct); old child finalized on replace; set(None) unparents
