bindings:
- name: license-type
  direction: two_way
  property: license-type
  type:
    ref: enum<svelters-api:v1:type:gtk:Gtk:License>
    nullable: false
  change:
    signal: notify::license-type
    role: any_change
    value: prop
  write:
    natively_normalizes: false
  echo:
    strategy: none
    compare_before_set: true
    read_back: false
  lifetime:
    on_native_death: end_binding
    on_stale_update: warn_noop
    on_destroy: idempotent_disconnect
  provenance:
  - origin: rule
    ref: 'B1: GtkAboutDialog:license-type is writable, scalar and notifies; the renderer compares before set'
