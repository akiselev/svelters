signals:
- name: activate-link
  handler_result: bool_stop
  sync_required: true
  trigger:
    rust: let _ = o.emit_by_name::<bool>("activate-link", &[&"x"]);
    values:
    - a
    - b
    - c
  delivery_only: true
  provenance:
  - origin: runtime
    ref: returns gboolean, run-last
  - origin: probe
    ref: emitted synthetically with sampled arguments; delivery only, no native trigger
- name: notify::license-type
  derived_from:
    property: license-type
  js_event: notify::license-type
  trigger:
    property: license-type
    values:
    - custom
    - unknown
    - custom
  params: []
  returns:
    type: void
  handler_result: none
  sync_required: false
  phase: first
  flags:
  - detailed
  connection:
    disconnect_on:
    - handle_drop
    - native_destroy
  provenance:
  - origin: rule
    ref: GObject::notify for GtkAboutDialog:license-type
- name: notify::wrap-license
  derived_from:
    property: wrap-license
  js_event: notify::wrap-license
  trigger:
    property: wrap-license
    values:
    - true
    - false
    - true
  params: []
  returns:
    type: void
  handler_result: none
  sync_required: false
  phase: first
  flags:
  - detailed
  connection:
    disconnect_on:
    - handle_drop
    - native_destroy
  provenance:
  - origin: rule
    ref: GObject::notify for GtkAboutDialog:wrap-license
