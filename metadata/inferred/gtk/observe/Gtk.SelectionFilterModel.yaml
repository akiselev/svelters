schema: svelters-observe-layer/v1
toolkit: gtk
owner: Gtk:SelectionFilterModel
observe:
- prop: item-type
  class: constant
  provenance:
  - origin: runtime
    ref: read-only, never seen changing in the probe
  - origin: manual
    ref: 'review pattern :item-type$: the item type of a list model is fixed by its class (G_TYPE_OBJECT for the wrapping models since GTK 4.8,
      the element type otherwise)'
  confidence: 0.9
- prop: model
  class: exact
  via:
  - mechanism: notify
    signal: notify::model
  provenance:
  - origin: runtime
    ref: 'O1: GObject property, notify::model (EXPLICIT_NOTIFY)'
  - origin: rule
    ref: 'no probe row; not a scalar: the generated test only installs the mechanism'
  verify:
    'on': Gtk:SelectionFilterModel
    check: change
    values:
    - gtk::SingleSelection::new(Some(gtk::StringList::new(&["a", "b"])))
  confidence: 0.9
- prop: n-items
  class: exact
  via:
  - mechanism: notify
    signal: notify::n-items
  provenance:
  - origin: runtime
    ref: 'O1: GObject property, notify::n-items'
  - origin: manual
    ref: 'review pattern :n-items$: GListModel implementations notify n-items with items-changed (GTK 4.8+, GLib 2.74+); the probe saw it on Gio.ListStore
      and Gtk.StringList'
  verify:
    'on': Gtk:SelectionFilterModel
    check: cross
    rust: let m = o.downcast_ref::<gtk::SelectionFilterModel>().unwrap(); let s = m.model().unwrap_or_else(|| { let s = gtk::MultiSelection::new(Some(gtk::StringList::new(&["a",
      "b"]))).upcast::<gtk::SelectionModel>(); m.set_model(Some(&s)); s }); if m.n_items() == 0 { s.select_all(); } else { s.unselect_all(); }
  confidence: 0.9
