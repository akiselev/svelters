schema: svelters-observe-layer/v1
toolkit: gtk
owner: Gtk:FlattenListModel
observe:
- prop: item-type
  class: constant
  provenance:
  - origin: runtime
    ref: read-only, never seen changing in the probe
  - origin: manual
    ref: 'review pattern :item-type$: the item type of a list model is fixed by its class (G_TYPE_OBJECT for the wrapping models since GTK 4.8,
      the element type otherwise)'
  confidence: 0.9
- prop: model
  class: exact
  via:
  - mechanism: notify
    signal: notify::model
  provenance:
  - origin: runtime
    ref: 'O1: GObject property, notify::model (EXPLICIT_NOTIFY)'
  - origin: rule
    ref: 'no probe row; not a scalar: the generated test only installs the mechanism'
  verify:
    'on': Gtk:FlattenListModel
    check: change
    values:
    - gtk::StringList::new(&["a", "b"])
  confidence: 0.9
- prop: n-items
  class: exact
  via:
  - mechanism: notify
    signal: notify::n-items
  provenance:
  - origin: runtime
    ref: 'O1: GObject property, notify::n-items'
  - origin: manual
    ref: 'review pattern :n-items$: GListModel implementations notify n-items with items-changed (GTK 4.8+, GLib 2.74+); the probe saw it on Gio.ListStore
      and Gtk.StringList'
  verify:
    'on': Gtk:FlattenListModel
    check: cross
    rust: let m = o.downcast_ref::<gtk::FlattenListModel>().unwrap(); let s = m.model().and_downcast::<gtk::gio::ListStore>().unwrap_or_else(||
      { let s = gtk::gio::ListStore::new::<gtk::StringList>(); m.set_model(Some(&s)); s }); s.append(&gtk::StringList::new(&["a"]));
  confidence: 0.9
