    signal: notify::incremental
  fires: on_change
  provenance:
  - origin: runtime
    ref: 'O1: GObject property, notify::incremental (EXPLICIT_NOTIFY)'
  - origin: probe
    ref: 'observe probe GTK 4.22.4: notified on every observed change (set:Gtk.SortListModel:incremental)'
  verify:
    'on': Gtk:SortListModel
    check: change
  confidence: 0.95
- prop: item-type
  class: constant
  provenance:
