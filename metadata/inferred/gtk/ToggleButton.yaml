properties:
- name: active
  sample: true
  provenance:
  - origin: probe
    ref: round trip exact; notify fired
signals:
- name: toggled
  handler_result: none
  sync_required: false
  trigger:
    property: active
    values:
    - true
    - false
    - true
  provenance:
  - origin: runtime
    ref: returns void, run-first
  - origin: probe
    ref: emitted when active is set
- name: notify::active
  derived_from:
    property: active
  js_event: notify::active
  trigger:
    property: active
    values:
    - true
    - false
    - true
  params: []
  returns:
    type: void
  handler_result: none
  sync_required: false
  phase: first
  flags:
  - detailed
  connection:
    disconnect_on:
    - handle_drop
    - native_destroy
  provenance:
  - origin: rule
    ref: GObject::notify for GtkToggleButton:active
methods:
- name: get_active
  dispatch: dynamic
  args: []
  expect: r == h.get(o, "active")
  provenance:
  - origin: probe
    ref: equals property active
- name: set_active
  dispatch: dynamic
  args:
  - true
  expect: h.get(o, "active") == V::Bool(true)
  provenance:
  - origin: probe
    ref: 'set then read property active: exact'
bindings:
- name: active
  direction: two_way
  property: active
  type:
    ref: bool
    nullable: false
  change:
    signal: notify::active
    role: any_change
    value: prop
  write:
    natively_normalizes: false
  echo:
    strategy: none
    compare_before_set: true
    read_back: false
  lifetime:
    on_native_death: end_binding
    on_stale_update: warn_noop
    on_destroy: idempotent_disconnect
  provenance:
  - origin: rule
    ref: 'B1: GtkToggleButton:active is writable, scalar and notifies; the renderer compares before set'
