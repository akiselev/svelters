        native: GtkListBoxRow::get_child() const
      set:
        native: GtkListBoxRow::set_child(GtkWidget*)
        args:
        - child
        effects:
          child: parented
          old: unparented
      remove:
        native: GtkListBoxRow::set_child(GtkWidget*)
        args:
        - null
        effects:
          child: unparented
    verify: {}
    provenance:
