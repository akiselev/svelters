    route_by_kind: false
    cardinality: one
    order: none
    default:
      kind: none
    on_remove: empty
    attrs: []
    requires: []
    ops:
      get:
        native: GtkButton::get_child() const
      set:
        native: GtkButton::set_child(GtkWidget*)
        args:
        - child
        effects:
          child: parented
          old: unparented
      remove:
        native: GtkButton::set_child(GtkWidget*)
        args:
        - null
        effects:
          child: unparented
    verify: {}
    provenance:
    - origin: probe
      ref: set parents the child (direct); old child finalized on replace; set(None) unparents
