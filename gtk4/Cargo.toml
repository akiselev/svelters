[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters-gtk4"
version = "0.1.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.40"
either = "1.6.1"
flume = "0.10.7"
frunk = "0.4"
glib = "0.14"
gtk4-macros = "0.2.0"
itertools = "0.10.1"
lazy_static = "1.4.0"
log = "0.4.14"
parking_lot = "0.11.1"
serde = "1.0.126"
serde_json = "1.0.64"
smartstring = "0.2.6"
static_assertions = "1.1.0"
thiserror = "1.0.25"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.26"
tracing-log = "0.1.2"
tracing-macros = "0.0.0"
tracing-subscriber = "0.2.18"

[dependencies.svelters-core]
version = "0.1.0"
path = "../core"

[dependencies.gtk4]
version = "0.2"
features = ["v4_2"]

[dependencies.rquickjs]
version = "0.1.1"
path = "../crates/rquickjs"
features = ["full", "tokio"]
