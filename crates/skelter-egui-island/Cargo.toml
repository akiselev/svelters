[package]
name = "skelter-egui-island"
description = "skelter's egui island: an egui 0.37 context rendered on skelter's device and composited as a layer."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skelter-base = { workspace = true }
skelter-compositor = { workspace = true }
skelter-core = { workspace = true }
skelter-platform = { workspace = true }
accesskit = { workspace = true }
wgpu = { workspace = true }
# One egui minor, pinned exactly, as svelters-egui pins it (D9); egui moves together with cadatomic.
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }

[dev-dependencies]
pollster = "0.4"
# The AccessKit graft test applies the island's updates to a consumer tree, as the platform adapters do.
accesskit_consumer = "0.39.1"
