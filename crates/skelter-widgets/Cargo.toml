[package]
name = "skelter-widgets"
description = "skelter's built-in kinds: interaction units, paint helpers, theme tokens, Tier 0 and Tier 1 widgets, views, text editing."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skelter-base = { workspace = true }
skelter-core = { workspace = true }
skelter-text = { workspace = true }
skelter-anim = { workspace = true }
# The clipboard service (`Box<dyn skelter_platform::Clipboard>`) the text kinds read.
skelter-platform = { workspace = true }
# The CSS engine skelter uses as its style system (architecture §3, §5): widgets read computed values.
svelters-style = { workspace = true }
taffy = { workspace = true }
smallvec = { workspace = true }
serde_json = { workspace = true }
# Icon kit SVGs rasterised into images (EGUI.md §5 `icon`).
resvg = { version = "=0.45.1", default-features = false }
# The icon colour-slot rewrite (`paint::icon::registry::slot_svg`) parses icon SVGs with the roxmltree usvg links.
roxmltree = "=0.20.0"
# Icon masks of solid shapes drawn as path booleans (A32: the kit's knockout gaps stay vectors).
i_overlay = "=9.1.0"
# The text-editing core of the `text` kinds (lane TEXT-INPUT), at quire `388670c`: the rev skelter_quire
# (the gallery app) and cadatomic pin, so the graph has one quire-text (POL1-GALLERY Q1).
quire-text = { git = "https://github.com/akiselev/quire", rev = "388670c3f1d0a953592c6c96c5bd0d1a12f03a46" }
# Grapheme clusters: the characters of the text fields' accessibility runs (`text::runs`).
unicode-segmentation = "=1.13.3"
# Native file and message dialogs (`dialogs::native`) through rfd; without it they fail as unsupported.
rfd = { version = "0.17.2", optional = true }

[features]
dialogs = ["dep:rfd"]
# The native menu bar's description (`views::menu_model::MenuModel::to_menu_desc`); skelter-platform is a
# regular dependency since the text kinds read its clipboard.
native-menu = []

[dev-dependencies]
# The conformance pins (pins 1–7) against the Linux goldens: tests/text_pins.rs.
svelters-conformance = { path = "../svelters-conformance" }
