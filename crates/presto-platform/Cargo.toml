[package]
name = "presto-platform"
description = "presto's platform layer: windows, input, IME, clipboard, OS layers and frame sources; winit 0.30.13 plus shims first."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Native file and message dialogs through rfd.
dialogs = ["dep:rfd"]

[dependencies]
presto-base = { workspace = true }
accesskit = { workspace = true }
smallvec = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }
log = "0.4"
rfd = { version = "0.17.2", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.35.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27.1"
# The objc2 0.5 family: the one winit 0.30.13 and accesskit_macos 0.27 link.
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSDate", "NSGeometry", "NSProcessInfo", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.2.2", features = ["CALayer", "CAMetalLayer", "CATransaction", "objc2-metal"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
accesskit_unix = "0.24.0"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
smithay-clipboard = "0.7.3"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
