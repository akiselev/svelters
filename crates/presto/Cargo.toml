[package]
name = "presto"
description = "presto: the app runner tying the platform, the tree, text and the compositor together on the UI thread."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
presto-core = { workspace = true }
presto-frame = { workspace = true }
presto-compositor = { workspace = true }
presto-platform = { workspace = true }
presto-text = { workspace = true }
presto-widgets = { workspace = true }
wgpu = { workspace = true }

# The own platform backends (architecture §3, platform.md §5), each on by default on its OS; the facade
# picks one at start and falls back to presto-platform's winit backend (`presto::run`).
[features]
default = ["win32", "wayland", "macos"]
win32 = ["dep:presto-platform-win32"]
wayland = ["dep:presto-platform-wayland"]
macos = ["dep:presto-platform-macos"]

[target.'cfg(target_os = "windows")'.dependencies]
presto-platform-win32 = { path = "../presto-platform-win32", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
presto-platform-wayland = { path = "../presto-platform-wayland", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
presto-platform-macos = { path = "../presto-platform-macos", optional = true }
