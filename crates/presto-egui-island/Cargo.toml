[package]
name = "presto-egui-island"
description = "presto's egui island: an egui 0.37 context rendered on presto's device and composited as a layer."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
accesskit = { workspace = true }
wgpu = { workspace = true }
# One egui minor, pinned exactly, as svelters-egui pins it (D9); egui moves together with cadatomic.
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }

[dev-dependencies]
pollster = "0.4"
