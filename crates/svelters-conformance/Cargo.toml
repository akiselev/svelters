[package]
name = "svelters-conformance"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "WG3 native-behaviour references (widget survey NA1): pin scripts, the key-role table, the `state` trace writer, golden files and the XTEST injector"

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust X11 client (already in the tree through winit); `xtest` adds the XTEST extension.
x11rb = { version = "0.13.2", features = ["xtest"] }

# WG3m: the macOS user path (CGEvent, AX) and the fixture's run loop (src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSGeometry"] }

[dev-dependencies]
# The AppKit capture runs on the process's first thread (svelters_apple::testing::run_cases).
svelters-apple.workspace = true
svelters-abi.workspace = true
# The egui measurement (tests/egui_measure.rs): the egui backend under kittest, no display.
svelters-egui = { path = "../svelters-egui", features = ["kittest"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_kittest = "=0.37.0"

# The GTK capture (tests/gtk_capture.rs) runs on Linux only (XTEST on a private Xvfb).
[target.'cfg(target_os = "linux")'.dev-dependencies]
svelters-gtk.workspace = true
gtk = { workspace = true, features = ["v4_6"] }

# WG3m: AppKit must run on the main thread, so no libtest harness; opt-in (NA_MACOS=1), macOS only.
[[test]]
name = "appkit_capture"
harness = false
