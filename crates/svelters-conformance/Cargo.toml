[package]
name = "svelters-conformance"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "WG3 native-behaviour references (widget survey NA1): pin scripts, the key-role table, the `state` trace writer, golden files and the XTEST injector"

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust X11 client (already in the tree through winit); `xtest` adds the XTEST extension.
x11rb = { version = "0.13.2", features = ["xtest"] }

[dev-dependencies]
svelters-abi.workspace = true
svelters-gtk.workspace = true
gtk = { workspace = true, features = ["v4_6"] }
# The egui measurement (tests/egui_measure.rs): the egui backend under kittest, no display.
svelters-egui = { path = "../svelters-egui", features = ["kittest"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_kittest = "=0.37.0"
