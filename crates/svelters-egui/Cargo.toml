[package]
name = "svelters-egui"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The egui backend (G1): a retained scene arena laid out by taffy and painted through egui each frame"

[features]
default = ["eframe", "kittest", "source", "dialogs", "intl"]
# IN1: numeric widgets format and parse in the host's locale (svelters-intl); also the host's `Intl`.
intl = ["dep:svelters-intl", "svelters-host/intl"]
# The windowed runner (`Backend::run`): eframe with the glow renderer on X11/Wayland.
eframe = ["dep:eframe"]
# The headless test runner (`harness`): egui_kittest without a renderer, so no GPU and no display.
kittest = ["dep:egui_kittest"]
# Q1: apps loaded from source (`svelters-egui-run --entry`), compiled live by svelters-compiler.
source = ["svelters-modules/source"]
# WG4b: native file and message dialogs (`svelters:app/egui`) through rfd; without it they reject with
# `unsupported` unless a `DialogBackend` is installed.
dialogs = ["dep:rfd"]

[dependencies]
svelters-abi.workspace = true
svelters-host.workspace = true
svelters-intl = { workspace = true, optional = true }
# AS1: the asset registry (`assets`) needs only the base crate; `source` adds the live compiler.
svelters-modules.workspace = true
# CS5e: the CSS engine (selectors, cascade, computed style) runs in process on the scene.
svelters-style.workspace = true
serde_json.workspace = true
# RA1: provider kinds (`#[svelters::widget]`) and states register with inventory (ARCH-EMBED D2(a)).
inventory = "0.3"
# OW4: the own `text-edit` runs on quire-text (TC0: text, change sets, selections, history, word
# rules, field commands). FX1's word rules and FX3's undo models moved there (ARCH-WIDGETS §4).
quire-text = { git = "https://github.com/akiselev/quire", rev = "6f35566233c4ddbb62500eccf7c63c72ae95bced" }
# D9 (provisional, plans/milestones/G1-egui-skeleton.md): one egui minor per svelters-egui line,
# pinned exactly. All egui crates move together.
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui_kittest = { version = "=0.37.0", optional = true }
# WG4b: `date-picker` (EGUI.md §5: same-week crates only; egui_extras moves with egui).
egui_extras = { version = "=0.37.0", default-features = false, features = ["datepicker"] }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
# WG4b: native dialogs. rfd has no egui dependency, so it never holds the egui pin back.
rfd = { version = "0.17.2", optional = true }
# WG4b: the dialog functions are Rust exports (`#[svelters::export(module = "egui")]`).
svelters = { path = "../svelters" }
# DX2: the system clipboard (`platform::SystemClipboard`) on every desktop; Linux adds W5's features below.
arboard = { version = "3.7", default-features = false }
taffy = { version = "=0.15.0", default-features = false, features = ["std", "flexbox", "grid", "calc", "block_layout", "content_size"] }
# AS1: the own SVG loader (`assets::SvgLoader`). The version egui_extras 0.37 pins, so one resvg links.
resvg = { version = "=0.45.1", default-features = false }
# ICR1: the colour-slot rewrite (`icons::slot_svg`) parses icon SVGs with the roxmltree usvg links.
roxmltree = "=0.20.0"
# WG2b: `image` decodes PNG (the version arboard locks).
image = { version = "0.25", default-features = false, features = ["png"] }

# CB1: egui's text fields copy, cut and paste through egui-winit's clipboard, which is the OS clipboard
# (arboard) only with egui-winit's `clipboard` feature. eframe turns it on through its default
# `clipboard` feature, which svelters-egui and its embedders (cadatomic: eframe and svelters-egui
# without default features) leave off, so Cmd/Ctrl+C/V in a field used an in-process string. This
# dependency turns the feature on for every app that links svelters-egui (features unify), so
# `text-edit`, `svelters:clipboard` (DX2) and other apps see one clipboard.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `x11` and `wayland` as eframe has them: winit does not build on Linux without a backend (a build of
# svelters-egui without eframe, as svelters-testkit's snapshots have, would get none).
egui-winit = { version = "=0.37.0", default-features = false, features = ["clipboard", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
# W5: the system primary selection (`primary::use_system`), the arboard egui-winit already locks.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# The tests use the kittest harness and the eframe runner whatever features the build selects
# (CI builds this crate in one command with `--no-default-features` meant for another package).
svelters-egui = { path = ".", features = ["eframe", "kittest", "source"] }
egui_kittest = "=0.37.0"
# WG2b: the image tests encode their PNGs
image = { version = "0.25", default-features = false, features = ["png"] }
# IC1: tests/icon_loader.rs renders icon SVGs through egui_extras' SvgLoader (resvg 0.45, no text, no rasters).
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }

[lints.clippy]
# ZU3: allowed for tests, examples and bins; lib.rs denies it for the library (see clippy.toml).
disallowed_methods = "allow"
# OW0: the same for the egui widget wrappers (lib.rs denies them in the library).
disallowed_types = "allow"
