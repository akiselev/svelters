[package]
name = "presto-widgets"
description = "presto's built-in kinds: interaction units, paint helpers, theme tokens, Tier 0 and Tier 1 widgets, views, text editing."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
presto-core = { workspace = true }
presto-text = { workspace = true }
presto-anim = { workspace = true }
serde_json = { workspace = true }
# Native file and message dialogs (`dialogs::native`) through rfd; without it they fail as unsupported.
rfd = { version = "0.17.2", optional = true }

[features]
dialogs = ["dep:rfd"]
