[package]
name = "svelters"
description = "Expose an app's Rust types and functions to Svelte (svelters:app/<module>): the macros plus the host's export runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
svelters-macros = { path = "../svelters-macros" }
svelters-host.workspace = true

[features]
# `#[js(tokio)] async fn` exports.
tokio = ["svelters-host/tokio"]

[dev-dependencies]
svelters-host = { workspace = true, features = ["tokio"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "time", "sync"] }
svelters-abi.workspace = true
svelters-backend-log.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
