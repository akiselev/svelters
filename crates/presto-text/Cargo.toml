[package]
name = "presto-text"
description = "presto's text stack: fonts, shaping and layout (parley), glyph rasterisation (skrifa), caches."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
parley = { workspace = true }
# fontconfig is loaded at runtime (only with system fonts on), so building needs no libfontconfig-dev.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
# The skrifa parley 0.12 pins (one copy of read-fonts in the binary; text-stack.md §2.6 option (c)).
skrifa = "0.44"
png = "0.18"
