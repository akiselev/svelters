[package]
name = "svelters-macros"
description = "Proc macros of the svelters facade: #[derive(Record, Enum, Error)], #[svelters::object], #[svelters::export]"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
