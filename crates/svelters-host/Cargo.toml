[package]
name = "svelters-host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
svelters-abi.workspace = true
svelters-backend-log.workspace = true
# SCHED1: the Spawner/Clock seams the host's job and wake hooks take (no dependencies of its own).
svelters-sched.workspace = true
rquickjs.workspace = true
# Q1: the engine boundary (`ModuleProvider`) and the bundle provider; runners add `SourceProvider`.
svelters-modules = { workspace = true, features = ["serde"] }
serde_json.workspace = true
# RA2: `Json<T>` crosses serde values, typed from `schemars::JsonSchema`.
serde.workspace = true
schemars.workspace = true
sourcemap = { version = "9.3.2", default-features = false }
notify = "8"
# DX1: JS console and `logger()` records; standard per-app directories.
tracing = "0.1"
directories = "6"
inventory = "0.3"
# E1: `#[js(worker)]` exports run on rayon.
rayon = "1.12"
# DX2: `svelters:shell` opens URLs and files with the system handler (SystemShell).
open = "5.3"
# DX2/SV75: the system clipboard (`platform::SystemClipboard`, feature `system-clipboard`); Linux adds
# the Wayland primary selection below.
arboard = { version = "3.7", optional = true, default-features = false }
# E1: `#[js(tokio)] async fn` exports (feature `tokio`).
tokio = { version = "1.47", optional = true, default-features = false, features = ["rt", "rt-multi-thread"] }

# IN1: `Intl` over ICU4X (feature `intl`).
svelters-intl = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# W5: the Wayland primary selection (`platform::system_primary`), with `system-clipboard`.
arboard = { version = "3.7", optional = true, default-features = false, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
# ZU3: the hang watchdog samples the UI thread's stack (a signal plus `trace_unsynchronized`).
libc = "0.2"
backtrace = "0.3"

[dev-dependencies]
# Q1 tests load apps from source.
svelters-modules = { workspace = true, features = ["source"] }

[features]
default = ["intl"]
tokio = ["dep:tokio"]
# IN1: `Intl` (NumberFormat, PluralRules, Collator, DateTimeFormat), `toLocaleString`/`localeCompare`
# and `Host::set_locale`, over ICU4X data for a locale subset (svelters-intl). On by default: stock
# Svelte code and libraries call `toLocaleString`, and cadatomic needs it; the size cost is in
# plans/milestones/IN1-intl.md.
intl = ["dep:svelters-intl"]
# DX2/SV75: the desktop clipboard (`platform::SystemClipboard`, arboard: the system clipboard and the
# Linux primary selection) and `Platform::system`. Off by default, so headless, wasm and mobile hosts
# never link arboard; svelters-egui turns it on, and svelters-skelter has it as a feature.
system-clipboard = ["dep:arboard"]

[lints.clippy]
# ZU3: allowed for tests, examples and bins; lib.rs denies it for the library (see clippy.toml).
disallowed_methods = "allow"

[[bench]]
# W-J0: the JS→Rust crossing per binding shape (prints ns per call; run on a quiet machine).
name = "boundary"
harness = false
