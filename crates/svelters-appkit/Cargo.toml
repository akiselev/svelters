[package]
name = "svelters-appkit"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The macOS AppKit backend: svl_backend over NSApplication/NSView, generated kind tables, dynamic ObjC bridge"

[features]
# See svelters-apple: turn Objective-C exceptions in dynamic calls into errors (needs an SDK to build).
exceptions = ["svelters-apple/exceptions"]

[dependencies]
svelters-abi.workspace = true
svelters-apple.workspace = true

# On other platforms the crate is the generated tables and the pure lookup code (tested on Linux).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSValue", "NSObject", "NSNotification", "NSGeometry", "NSDate"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSEvent", "NSGraphics"] }
