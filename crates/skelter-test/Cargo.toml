[package]
name = "skelter-test"
description = "skelter's headless test harness with kittest's verbs."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The automation bridge (`crate::automation`): a `svelters_automation::Session` on a harness, over
# skelter-native UI (`SkelterNativeDriver`) or svelters-egui roots in egui islands (`SkelterDriver`).
automation = ["dep:svelters-automation", "dep:svelters-egui"]

[dependencies]
skelter-base = { workspace = true }
skelter = { workspace = true }
skelter-render = { workspace = true }
skelter-text = { workspace = true }
skelter-egui-island = { workspace = true }
skelter-platform = { workspace = true }
skelter-core = { workspace = true }
wgpu = { workspace = true }
pollster = "0.4"
# The `egui::Event`-shaped injection adapter (architecture §16.1) and the egui island harness; same
# pin as svelters-egui.
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }
# The pixel tier: egui_kittest's comparison (dify) and PNG goldens, at egui_kittest 0.37's versions.
dify = { version = "0.8.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
svelters-automation = { workspace = true, optional = true }
# No default features: no eframe, no native dialogs (the skelter workflow installs no GTK).
svelters-egui = { path = "../svelters-egui", default-features = false, optional = true }
# `crate::consumer`: AccessKit's own tree on the app's updates (same versions as the platform adapters).
accesskit_consumer = "0.39.1"

[target.'cfg(target_os = "linux")'.dependencies]
# `crate::consumer::Atspi`: AT-SPI's translation layer without D-Bus (accesskit_unix's versions).
accesskit_atspi_common = "0.21.0"
atspi-common = { version = "0.13", default-features = false }

[dev-dependencies]
skelter-test = { path = ".", features = ["automation"] }
# The automation test loads an app from source (fixtures/counter-egui) into an island.
svelters-egui = { path = "../svelters-egui", default-features = false, features = ["source"] }
svelters-host = { workspace = true }
svelters-modules = { workspace = true, features = ["source"] }
# JSON params of `Session::call` (tests/native_session.rs).
serde_json = { workspace = true }
# A real document with the built-in kinds (tests/menu.rs).
skelter-core = { workspace = true }
skelter-widgets = { workspace = true, features = ["native-menu"] }
