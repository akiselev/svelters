[package]
name = "svelters-skelter"
description = "The svelters backend on skelter: the backend ABI on skelter's tree, the generated skelter.json spec, the embed model."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skelter-base = { workspace = true }
skelter-core = { workspace = true }
skelter-motion = { workspace = true }
skelter = { workspace = true }
skelter-platform = { workspace = true }
skelter-compositor = { workspace = true }
skelter-text = { workspace = true }
skelter-widgets = { workspace = true }
smallvec = { workspace = true }
svelters-abi = { workspace = true }
svelters-host = { workspace = true }
# `svelters-skelter-run --entry`: apps compiled from source
svelters-modules = { workspace = true, features = ["source"] }
serde_json = { workspace = true }
svelters-style = { workspace = true }

[dev-dependencies]
# `tests/run.rs`: the app runner on the headless platform and compositor
skelter-test = { workspace = true }
