[package]
name = "svelters-style"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# CSS.md D5: the spec tokenizer and selector matching, pinned exactly (selectors breaks every 0.x).
cssparser = "=0.38.0"
selectors = "=0.41.0"
cssparser-color = "=0.6.0"
precomputed-hash = "0.1"
smallvec = "1"

[dev-dependencies]
# U1: the vocabulary test reads the theme token values from metadata/semantics/egui.json.
serde_json.workspace = true
