[package]
name = "svelters-compiler"
description = "Experimental Rust Svelte compiler with native framework semantics (NC1)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "svelters-compile"
path = "src/bin/svelters-compile.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourcemap = "9"
# CS5g: the CSS engine checks `<style>` for backends that run it (egui)
svelters-style.workspace = true
# U4: a utility's selector relative to its class (the escaping the engine uses)
cssparser = "=0.38.0"

[dev-dependencies]
svelters-host.workspace = true
svelters-backend-log.workspace = true
