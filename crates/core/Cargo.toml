cargo-features=["edition2021"]

[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2021"
name = "svelters-core"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4.14"
either = "1.6.1"
tracing = "0.1.26"
tracing-log = "0.1.2"
lazy_static = "1.4.0"
anyhow = "1.0.40"
parking_lot = "0.11.1"
tracing-subscriber = "0.2.18"
thiserror = "1.0.25"
tracing-macros = "0.0.0"
phf = { version="0.9", features=["macros"] }
smartstring = "0.2.6"
flume = "0.10.7"
serde_json = "1.0.64"
serde = "1.0.126"
spez = "0.1.1"
rquickjs = { version="0.1.1", path="../rquickjs", features=["full", "backtrace", "tokio", "frunk"] }
frunk = "0.4.0"
static_assertions = "1.1.0"
typedmap = "0.1.1"
smallvec = "1.6.1" 
ouroboros = "0.10.1"
slotmap = { version = "1.0.6", features = ["unstable"] }
smallbox = { version = "0.8.0", features = ["coerce"] }    # `Small Box` optimization: store small item on stack and fallback to heap for large item.
delegate = "0.6.1"    # Method delegation with less boilerplate
heapless = "0.7.5"            # `static` friendly data structures that don't require dynamic memory allocation

[dev-dependencies]
cucumber_rust = { git="https://github.com/bbqsrc/cucumber-rust", branch="main" }
tokio = { version="1", features=["macros", "rt-multi-thread"] }
pretty_assertions = "0.7"
rquickjs = { version="0.1.1", path="../rquickjs", features=[
    "full",
    "tokio",
    "dump-leaks",
    # "dump-mem",
] }

[[test]]
name = "runner"
harness = false # Allows Cucumber to print output instead of libtest

[features]
default = []
# Exposes internal builder types so users can create their own builder phases
# NOTE: If you opt-in to this feature, you give up API stability guarantees!
unstable = []
