[package]
name = "skelter-motion"
description = "skelter's native transitions, FLIP and springs for Svelte (svelte/transition, svelte/animate, svelte/motion)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skelter-base = { workspace = true }
skelter-anim = { workspace = true }
# the OP_ANIMATE payload and the native transition descriptor are JSON (motion.js)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
