[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters-qt"
version = "0.1.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "qt"

[dependencies]
log = "0.4.14"
either = "1.6.1"
tracing = "0.1.26"
tracing-log = "0.1.2"
lazy_static = "1.4.0"
anyhow = "1.0.40"
parking_lot = "0.11.1"
tracing-subscriber = "0.2.18"
thiserror = "1.0.25"
tracing-macros = "0.0.0"
phf = { version="0.9", features=["macros"] }
smartstring = "0.2.6"
flume = "0.10.7"
tokio = { version="1", features=["time"] }
qt_core = { version="0.5.0" }
qt_gui = { version="0.5.0" }
qt_widgets = { version="0.5.0" }
serde_json = "1.0.64"
serde = "1.0.126"
spez = "0.1.1"
rquickjs = { version="0.1.1", path="../rquickjs", features=["full", "tokio"] }
frunk = "0.3.2"
