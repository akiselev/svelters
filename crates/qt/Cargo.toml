[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters-qt"
version = "0.1.0"
build = "build.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[dependencies]
cpp = "0.5.6"
cstr = "0.2.8"
log = "0.4.14"
qmetaobject = "0.2.1"
qttypes = "0.2.1"
either = "1.6.1"
tracing = "0.1.26"
tracing-bunyan-formatter = "0.2.4"
tracing-log = "0.1.2"
tracing-subscriber = "0.2.18"
lazy_static = "1.4.0"
cast_trait_object = "0.1.3"
anyhow = "1.0.40"
parking_lot = "0.11.1"
thiserror = "1.0.25"
tracing-macros = "0.0.0"
phf = { version="0.9", features=["macros"] }
smartstring = "0.2.6"
rquickjs = { version="0.1.1", path="../rquickjs", features=["full", "tokio"] }
svelters-core = { version="0.1.0", path="../core" }
flume = "0.10.7"

[build-dependencies]
cpp_build = "0.5.6"
semver = "1.0.3"

[dev-dependencies]
cpp_build = "0.5.6"
