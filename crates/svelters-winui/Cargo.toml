[package]
name = "svelters-winui"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "WinUI 3 (Windows App SDK) backend over windows-rs bindings generated from Microsoft.UI.Xaml.winmd"

# On non-Windows targets the crate is only the platform-neutral tables (src/table.rs,
# src/generated/names.rs) and their unit tests: no windows-* dependency is compiled.
[dependencies]
svelters-abi.workspace = true

# Pinned exactly: src/bindings.rs is generated by windows-bindgen 0.100.0 (tools/metadata/winui/regen.sh)
# and must match the runtime crates it calls into.
[target.'cfg(windows)'.dependencies]
windows-core = "=0.100.0"
windows-collections = "=0.100.0"
windows-reference = "=0.100.0"
windows-time = "=0.100.0"

[dev-dependencies]
svelters-host.workspace = true

# One STA thread for all generated tests (WinUI objects are thread-affine): no libtest harness.
[[test]]
name = "generated"
harness = false

# N4 non-GUI types: hand-written core checks and the generated ledger tests (same STA rule).
[[test]]
name = "types_core"
harness = false
