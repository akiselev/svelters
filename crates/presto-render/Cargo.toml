[package]
name = "presto-render"
description = "presto's wgpu renderer: instanced primitives, atlases, batching, damage scissoring."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
presto-canvas = { workspace = true }
wgpu = { workspace = true }
etagere = { workspace = true }
lyon = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
pollster = "0.4"
presto-text = { workspace = true }
# Shader validation without an adapter, and reference images for the GPU tests.
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18"
