[package]
name = "presto-canvas"
description = "presto's native canvas layers: typed instance chunks in f64 world space, culling and LOD, a static cache with an overlay plane, Slug GPU text."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
lyon = { workspace = true }
# The skrifa presto-text uses (one copy of read-fonts in the binary).
skrifa = "0.44"

[dev-dependencies]
pollster = "0.4"
# Shader validation without an adapter.
naga = { version = "30.0.1", features = ["wgsl-in"] }
