[package]
name = "svelters-presto"
description = "The svelters backend on presto: the backend ABI on presto's tree, the generated presto.json spec, the embed model."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
presto-base = { workspace = true }
presto-core = { workspace = true }
presto = { workspace = true }
presto-platform = { workspace = true }
presto-compositor = { workspace = true }
presto-text = { workspace = true }
presto-widgets = { workspace = true }
smallvec = { workspace = true }
svelters-abi = { workspace = true }
svelters-host = { workspace = true }
# `svelters-presto-run --entry`: apps compiled from source
svelters-modules = { workspace = true, features = ["source"] }
serde_json = { workspace = true }
svelters-style = { workspace = true }

[dev-dependencies]
# `tests/run.rs`: the app runner on the headless platform and compositor
presto-test = { workspace = true }
