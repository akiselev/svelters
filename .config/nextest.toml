# GUI integration tests start real GTK/Qt windows under Xvfb. GTK's GL renderer runs in software
# there, and several at once can stall or lose the (virtual) Vulkan device, so they share a small
# group. One retry covers that environmental flake; a real failure still fails twice.
[test-groups]
gui = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(counter) | package(svelters-gtk) | package(counter-qt)'
test-group = 'gui'
retries = 1
# A GUI test that hangs (a run loop waiting for an event that never comes) is killed instead of
# holding a build slot for hours: reported slow at 2 min, terminated at 6 min.
slow-timeout = { period = "120s", terminate-after = 3 }
