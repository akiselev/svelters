cargo-features = ["edition2021"]

[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2021"
name = "svelters-core"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.40"
delegate = "0.6.1"            # Method delegation with less boilerplate
either = "1.6.1"
flume = "0.10.7"
frunk = "0.4.0"
heapless = "0.7.5"            # `static` friendly data structures that don't require dynamic memory allocation
lazy_static = "1.4.0"
log = "0.4.14"
ouroboros = "0.10.1"
parking_lot = "0.11.1"
query_interface = "0.3.5"     # Dynamically query a type-erased object for any trait implementation
serde = "1.0.126"
serde_json = "1.0.64"
smallvec = "1.6.1"
smartstring = "0.2.6"
spez = "0.1.1"
static_assertions = "1.1.0"
thiserror = "1.0.25"
tracing = "0.1.26"
tracing-log = "0.1.2"
tracing-macros = "0.0.0"
tracing-subscriber = "0.2.18"
typedmap = "0.1.1"

[dependencies.rquickjs]
version = "0.1.1"
path = "../crates/rquickjs"
features = ["full", "backtrace", "tokio", "frunk"]

[dependencies.phf]
version = "0.9"
features = ["macros"]

[dependencies.smallbox]
version = "0.8.0"
features = ["coerce"]

[dependencies.slotmap]
version = "1.0.6"
features = ["unstable"]

[dev-dependencies]
cucumber_rust = { git = "https://github.com/bbqsrc/cucumber-rust", branch = "main" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pretty_assertions = "0.7"
rquickjs = { version = "0.1.1", path = "../crates/rquickjs", features = [
    "full",
    "tokio",
    "dump-leaks",
    # "dump-mem",
] }

[[test]]
name = "runner"
harness = false # Allows Cucumber to print output instead of libtest

[features]
default = []
# Exposes internal builder types so users can create their own builder phases
# NOTE: If you opt-in to this feature, you give up API stability guarantees!
unstable = []
