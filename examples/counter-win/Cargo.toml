[package]
name = "counter-win"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs a fixture bundle (default fixtures/counter-win) in the host on the WinUI 3 backend (Windows only)"

[dependencies]
svelters-abi.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
svelters-host.workspace = true
svelters-winui.workspace = true

[dev-dependencies]
serde_json.workspace = true

# tests/na_capture.rs (WG3w): the NA1 capture on WinUI TextBoxes through SendInput and UI Automation.
[target.'cfg(windows)'.dev-dependencies]
svelters-conformance = { path = "../../crates/svelters-conformance" }
windows = { version = "0.62.2", features = ["Win32_Foundation"] }

# Spawns the binary with --selftest (WinUI needs its own STA main thread): no libtest harness.
[[test]]
name = "counter"
harness = false
