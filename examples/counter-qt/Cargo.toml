[package]
name = "counter-qt"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Leaf crate: nothing in the project depends on it except the final binary.
[dependencies]
svelters-abi.workspace = true

[dev-dependencies]
svelters-host.workspace = true

[build-dependencies]
svelters-qt-build.workspace = true

# Both run under a display (xvfb-run) and need the main thread for Qt, so no libtest harness.
