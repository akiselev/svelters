id = "tab-view"
title = "Tab view"
family = "tabs"
kinds = ["tab-view", "tab"]
size = [440, 300]
states = ["normal", "hover", "focus-visible", "disabled"]
notes = "A strip of captions over the selected page; each `tab` names its caption with `title` and shows a close button with `closable`. Look at the selected caption's indicator, hover, close glyphs, long titles and many tabs in a narrow strip: the captions scroll (wheel, the scroll buttons at the strip's end) and the overflow button opens a menu of every tab, the shown one checked."

[[variant]]
id = "basic"
title = "Selected tab"
file = "basic.svelte"
args = { selected = [0, 2] }

[[variant]]
id = "closable"
title = "Closable, long titles, overflow"
file = "closable.svelte"

[[variant]]
id = "rtl"
title = "Right-to-left titles"
file = "rtl.svelte"

[[variant]]
id = "overflow"
title = "Overflow: scroll buttons and the menu of every tab"
file = "overflow.svelte"
args = { menu = [false, true] }

[[variant]]
id = "rtl-overflow"
title = "Right-to-left, overflowing"
file = "rtl-overflow.svelte"
