id = "icon"
title = "Icon"
family = "controls"
kinds = ["icon"]
size = [240, 64]
notes = "A glyph or a registry icon; with `frame` an icon button. The gallery registers a demo icon set (`skelter_gallery::icons::DEMO`); an unregistered key shows the fallback."

[[variant]]
id = "glyph"
title = "Glyph"
file = "glyph.svelte"
args = { size = [12, 16, 24, 32] }

[[variant]]
id = "button"
title = "Icon button"
file = "button.svelte"
args = { selected = [false, true] }

[[variant]]
id = "registry"
title = "Registry key"
file = "registry.svelte"

[[variant]]
id = "source"
title = "Imported SVG"
file = "source.svelte"
args = { tint = [true, false] }

[[variant]]
id = "toolbar"
title = "A dense toolbar"
file = "toolbar.svelte"
