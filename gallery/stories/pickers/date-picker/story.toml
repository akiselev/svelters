id = "date-picker"
title = "Date picker"
family = "pickers"
kinds = ["date-picker"]
size = [340, 360]
states = ["normal", "hover", "active", "focus-visible", "disabled"]
notes = "The date button (`format`, a strftime subset; empty, the format's fields as a dimmed placeholder) and, with `open`, its calendar drop in the window's overlay stack. Today is the gallery's fixed day (2026-10-22), so an empty picker opens on October 2026 every run."

[[variant]]
id = "format"
title = "Formats"
file = "format.svelte"
args = { format = ["%Y-%m-%d", "%d %B %Y", "%A, %e %B %Y"] }

[[variant]]
id = "empty"
title = "No value"
file = "empty.svelte"

[[variant]]
id = "open"
title = "Open"
file = "open.svelte"
args = { value = ["2026-10-14", ""] }

[[variant]]
id = "rtl-open"
title = "Right-to-left, open"
file = "rtl-open.svelte"
