id = "color-picker"
title = "Colour picker"
family = "pickers"
kinds = ["color-picker"]
size = [340, 420]
states = ["normal", "hover", "active", "focus-visible", "disabled"]
notes = "The colour well and, with `open`, its colour editor drop in the window's overlay stack. Look at the well's swatch (translucent over a checkerboard), the drop's placement under the well and its surface."

[[variant]]
id = "value"
title = "Opaque and translucent"
file = "value.svelte"
args = { value = ["#c0392b", "#2e86c180", "#ffffff"] }

[[variant]]
id = "open"
title = "Open"
file = "open.svelte"
args = { value = ["#c0392b", "#2e86c180"] }
