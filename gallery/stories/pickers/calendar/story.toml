id = "calendar"
title = "Calendar"
family = "pickers"
kinds = ["calendar"]
size = [340, 300]
states = ["normal", "focus-visible", "disabled"]
notes = "An inline month grid with ISO week numbers and the month header. Every variant sets `value` (the shown month follows it; with none it would be today's, which changes). Look at the picked day, today, out-of-month days, the `min`/`max` greyed days and the header buttons."

[[variant]]
id = "value"
title = "A picked day"
file = "value.svelte"
args = { "weekday-format" = ["short", "narrow"] }

[[variant]]
id = "range"
title = "min and max, no week numbers"
file = "range.svelte"
