id = "tooltip"
title = "Tooltip"
family = "views"
kinds = []
size = [320, 120]
states = ["normal", "hover"]
notes = "The common `tooltip` prop on a widget. skelter-widgets' `tooltip` view kind is not registered for Svelte (see the coverage list); the hover state shows whether the hover text appears without the pointer delay."

[[variant]]
id = "button"
title = "On a button"
file = "button.svelte"
args = { text = ["Save the file", "Save every open file in the workspace, including the ones in other windows"] }
