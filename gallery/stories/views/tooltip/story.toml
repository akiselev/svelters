id = "tooltip"
title = "Tooltip"
family = "views"
kinds = ["button", "tooltip"]
size = [320, 120]
states = ["normal", "hover"]
notes = "The common `tooltip` prop on a widget, and the `tooltip` kind's surface on its own. In the `hover` state the gallery rests the pointer on the subject past the platform's tooltip delay, so the hover text shows as it would for a person; `element` is the `tooltip` kind: in the window's top layer next to its owner (`top-center`, flipped below when there is no room above), in every state. A long text wraps to stay inside the window."

[[variant]]
id = "button"
title = "On a button"
file = "button.svelte"
args = { text = ["Save the file", "Save every open file in the workspace, including the ones in other windows"] }

[[variant]]
id = "element"
title = "The tooltip surface"
file = "element.svelte"
args = { text = ["Save the file", "Save every open file in the workspace, including the ones in other windows and the scratch buffers", "احفظ الملف"] }
