[workspace]
resolver = "3"
members = [
    "crates/skelter-base",
    "crates/skelter-core",
    "crates/skelter-anim",
    "crates/skelter-frame",
    "crates/skelter-text",
    "crates/skelter-render",
    "crates/skelter-canvas",
    "crates/skelter-compositor",
    "crates/skelter-platform",
    "crates/skelter-widgets",
    "crates/skelter-motion",
    "crates/skelter-egui-island",
    "crates/skelter-test",
    "crates/skelter",
    "crates/svelters-skelter",
    "crates/skelter-platform-win32",
    "crates/skelter-platform-wayland",
    "crates/skelter-platform-macos",
    "crates/svelters-abi",
    "crates/svelters-host",
    "crates/svelters-backend-log",
    "crates/svelters-gtk",
    "crates/svelters-qt-build",
    "crates/svelters-apple",
    "crates/svelters-appkit",
    "crates/svelters-winui",
    "crates/svelters-egui",
    "crates/svelters-automation",
    "crates/svelters-conformance",
    "crates/svelters-style",
    "crates/svelters-compiler",
    "crates/svelters-modules",
    "crates/svelters-cli",
    "crates/svelters-macros",
    "crates/svelters",
    "crates/svelters-testkit",
    "crates/svelters-intl",
    "crates/svelters-sched",
    "examples/counter",
    "examples/counter-qt",
    "examples/counter-mac",
    "examples/counter-win",
    "examples/exports",
    "examples/egui-kinds",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
skelter-base = { path = "crates/skelter-base" }
skelter-core = { path = "crates/skelter-core" }
skelter-anim = { path = "crates/skelter-anim" }
skelter-frame = { path = "crates/skelter-frame" }
skelter-text = { path = "crates/skelter-text" }
skelter-render = { path = "crates/skelter-render" }
skelter-canvas = { path = "crates/skelter-canvas" }
skelter-compositor = { path = "crates/skelter-compositor" }
skelter-platform = { path = "crates/skelter-platform" }
skelter-widgets = { path = "crates/skelter-widgets" }
skelter-motion = { path = "crates/skelter-motion" }
skelter-egui-island = { path = "crates/skelter-egui-island" }
skelter-test = { path = "crates/skelter-test" }
skelter = { path = "crates/skelter" }
svelters-skelter = { path = "crates/svelters-skelter" }
svelters-abi = { path = "crates/svelters-abi" }
svelters-host = { path = "crates/svelters-host" }
svelters-style = { path = "crates/svelters-style" }
svelters-backend-log = { path = "crates/svelters-backend-log" }
svelters-gtk = { path = "crates/svelters-gtk" }
svelters-qt-build = { path = "crates/svelters-qt-build" }
svelters-apple = { path = "crates/svelters-apple" }
svelters-appkit = { path = "crates/svelters-appkit" }
svelters-winui = { path = "crates/svelters-winui" }
svelters-egui = { path = "crates/svelters-egui" }
svelters-automation = { path = "crates/svelters-automation" }
svelters-testkit = { path = "crates/svelters-testkit" }
svelters-intl = { path = "crates/svelters-intl" }
svelters-sched = { path = "crates/svelters-sched" }
svelters-compiler = { path = "crates/svelters-compiler" }
svelters-modules = { path = "crates/svelters-modules", default-features = false }
svelters-conformance = { path = "crates/svelters-conformance" }
gtk = { package = "gtk4", version = "0.11" }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
serde_json = "1"
serde = "1"
# RA2: `Json<T>` typings (cadatomic uses schemars 1).
schemars = "1"
cc = "1"
# skelter (plans/research/skelter/): third-party versions shared by the skelter crates.
accesskit = "0.25.1"
smallvec = { version = "1.16", features = ["union", "const_generics"] }
bytemuck = { version = "1.25", features = ["derive"] }
taffy = { version = "=0.15.0", default-features = false, features = ["std", "flexbox", "grid", "calc", "block_layout", "content_size"] }
wgpu = "30.0.1"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
raw-window-handle = "0.6"
parley = "0.12"
etagere = "0.3"
lyon = "1.0"

# QuickJS is C compiled by the cc crate; at the dev profile's opt-level 0 it runs 5-10x slower, which
# makes JS-heavy tests (10k-row lists) hit the host's turn budget. Optimise it in every profile.
# skelter: taffy runs on every relayout; Zed builds it at opt-level 3 in dev for the same reason.
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.rquickjs-sys]
opt-level = 2

# svelters-cli builds and reads its deflated docs packs with it; unoptimised it takes ~4 s per pack.
[profile.dev.package.miniz_oxide]
opt-level = 2
