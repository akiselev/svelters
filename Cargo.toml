cargo-features = ["strip"]

[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
path = "src/main.rs"
name = "svelters"

[lib]
path = "src/lib.rs"
name = "svelters"

[dependencies]
tracing = "0.1.26"
tracing-bunyan-formatter = "0.2.4"
tracing-log = "0.1.2"
tracing-subscriber = "0.2.18"
lazy_static = "1.4.0"
rquickjs = { version = "0.1.1", path = "./crates/rquickjs", features = [
    "full",
    "backtrace",
    "tokio",
    "frunk",
] }
svelters-compiler = { version = "0.1.0", path = "./crates/compiler" }
svelters-core = { version = "0.1.0", path = "./crates/core" }
svelters-gtk4 = { version = "0.1.0", path = "./crates/gtk4" }
anyhow = "1.0.40"
notify = "4.0.17"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
opt-level = 'z'
codegen-units = 1
panic = 'abort'

[workspace]
members = [
    "crates/core",
    "crates/gtk4",
    "crates/macros",
    "crates/compiler",
    "crates/rquickjs",
    "crates/rquickjs/rquickjs-core",
    "crates/rquickjs/rquickjs-macro",
]
exclude = ["codegen", "crates/oldqt", "crates/qt"]
