[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2018"
name = "svelte-qt-native"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
cpp = "0.5.6"
cstr = "0.2.8"
log = "0.4.14"
napi-derive = "1"
qmetaobject = "0.2.1"
qttypes = "0.2.1"
tracing = "0.1.26"
tracing-bunyan-formatter = "0.2.4"
tracing-log = "0.1.2"
tracing-subscriber = "0.2.18"
lazy_static = "1.4.0"
cast_trait_object = "0.1.3"

[dependencies.napi]
version = "1"
default_features = false
features = ["napi8", "serde-json", "tokio_rt"]

[target.'cfg(all(unix, not(target_env = "musl"), not(target_arch = "aarch64"), not(target_arch = "arm")))'.dependencies]
jemallocator = { version = "0.3", features = ["disable_initial_exec_tls"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "0.1" }

[build-dependencies]
napi-build = "1"
cpp_build = "0.5.6"

[profile.release]
lto = true

[dev-dependencies]
cpp_build = "0.5.6"
