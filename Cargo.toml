[workspace]
resolver = "3"
members = [
    "crates/svelters-abi",
    "crates/svelters-host",
    "crates/svelters-backend-log",
    "crates/svelters-gtk",
    "crates/svelters-qt-build",
    "examples/counter",
    "examples/counter-qt",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
svelters-abi = { path = "crates/svelters-abi" }
svelters-host = { path = "crates/svelters-host" }
svelters-backend-log = { path = "crates/svelters-backend-log" }
svelters-gtk = { path = "crates/svelters-gtk" }
svelters-qt-build = { path = "crates/svelters-qt-build" }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
serde_json = "1"
cc = "1"
