[package]
authors = ["Alexander Kiselev <svelters@akiselev.com>"]
edition = "2018"
name = "svelters"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
path = "src/main.rs"
name = "svelters"

[lib]
path = "src/lib.rs"
name = "svelters"

[dependencies]
cpp = "0.5.6"
cstr = "0.2.8"
log = "0.4.14"
# qmetaobject = "0.2.1"
# qttypes = "0.2.1"
tracing = "0.1.26"
tracing-bunyan-formatter = "0.2.4"
tracing-log = "0.1.2"
tracing-subscriber = "0.2.18"
lazy_static = "1.4.0"
cast_trait_object = "0.1.3"
tree-sitter = "0.19.5"
tree-sitter-javascript = "0.19.0"
tree-sitter-svelte = "0.8.1"
tree-sitter-cpp = "0.19.0"
# rquickjs = { path = "./libs/rquickjs", features = ["full", "tokio", "bindgen"] }
rquickjs = { version="0.1.1", path="./crates/rquickjs", features=["full", "tokio"] }
swc_common = { version="0.10.20", features=["tty-emitter"] }
swc_ecmascript = "0.36.3"
swc_bundler = "0.37.4"
swc_ecma_ast = "0.45.0"
swc_ecma_codegen = "0.55.4"
swc_ecma_parser = "0.57.4"
anyhow = "1.0.40"
parking_lot = "0.11.1"
fs_extra = "1.2.0"
notify = "4.0.17"
swc_ecma_transforms_typescript = "0.19.4"
tokio = { version="1", features=["full"] }
node-resolve = "2.2.0"
swc_ecma_transforms_base = "0.15.7"
swc_ecma_visit = "0.31.0"
common-path = "1.0.0"
quickjs_runtime = "0.4.2"

# [target.'cfg(all(unix, not(target_env = "musl"), not(target_arch = "aarch64"), not(target_arch = "arm")))'.dependencies]
# jemallocator = { version = "0.3", features = ["disable_initial_exec_tls"] }

# [target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# mimalloc = { version = "0.1" }

[build-dependencies]
cpp_build = "0.5.6"
npm_rs = "0.1.1"

[profile.release]
lto = true

[dev-dependencies]
cpp_build = "0.5.6"
