[workspace]
resolver = "3"
members = [
    "crates/svelters-abi",
    "crates/svelters-host",
    "crates/svelters-backend-log",
    "crates/svelters-gtk",
    "crates/svelters-qt-build",
    "crates/svelters-apple",
    "crates/svelters-appkit",
    "crates/svelters-winui",
    "crates/svelters-egui",
    "crates/svelters-automation",
    "crates/svelters-conformance",
    "crates/svelters-style",
    "crates/svelters-compiler",
    "crates/svelters-modules",
    "crates/svelters-cli",
    "crates/svelters-macros",
    "crates/svelters",
    "crates/svelters-testkit",
    "crates/svelters-sched",
    "examples/counter",
    "examples/counter-qt",
    "examples/counter-mac",
    "examples/counter-win",
    "examples/exports",
    "examples/egui-kinds",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
svelters-abi = { path = "crates/svelters-abi" }
svelters-host = { path = "crates/svelters-host" }
svelters-style = { path = "crates/svelters-style" }
svelters-backend-log = { path = "crates/svelters-backend-log" }
svelters-gtk = { path = "crates/svelters-gtk" }
svelters-qt-build = { path = "crates/svelters-qt-build" }
svelters-apple = { path = "crates/svelters-apple" }
svelters-appkit = { path = "crates/svelters-appkit" }
svelters-winui = { path = "crates/svelters-winui" }
svelters-egui = { path = "crates/svelters-egui" }
svelters-automation = { path = "crates/svelters-automation" }
svelters-testkit = { path = "crates/svelters-testkit" }
svelters-sched = { path = "crates/svelters-sched" }
svelters-compiler = { path = "crates/svelters-compiler" }
svelters-modules = { path = "crates/svelters-modules", default-features = false }
svelters-conformance = { path = "crates/svelters-conformance" }
gtk = { package = "gtk4", version = "0.11" }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
serde_json = "1"
serde = "1"
# RA2: `Json<T>` typings (cadatomic uses schemars 1).
schemars = "1"
cc = "1"

# QuickJS is C compiled by the cc crate; at the dev profile's opt-level 0 it runs 5-10x slower, which
# makes JS-heavy tests (10k-row lists) hit the host's turn budget. Optimise it in every profile.
[profile.dev.package.rquickjs-sys]
opt-level = 2

# svelters-cli builds and reads its deflated docs packs with it; unoptimised it takes ~4 s per pack.
[profile.dev.package.miniz_oxide]
opt-level = 2
